<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit E Ward Rounds</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f5;
      margin: 0;
      padding: 10px;
    }
    .container {
      max-width: 1100px;
      margin: auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      color: white;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .header h1 { margin: 0; font-size: 22px; font-weight: 600; }
    .header-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .btn {
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary { background: #4caf50; color: white; }
    .btn-secondary { background: #1976d2; color: white; }
    .btn-danger { background: #d32f2f; color: white; }
    .controls {
      padding: 16px;
      background: #fafafa;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    select, input {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ddd;
      flex: 1;
      min-width: 160px;
    }
    .content { padding: 16px; }
    .ward-section { margin-bottom: 24px; }
    .ward-header {
      background: #1976d2;
      color: white;
      padding: 12px;
      border-radius: 6px;
      font-weight: 500;
    }
    .er-header { background: #c62828 !important; }
    .table-wrapper {
      overflow-x: auto;
      margin-top: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }
    tr:hover { background: #f9f9f9; }
    .status {
      font-weight: 600;
      border-radius: 8px;
      padding: 3px 8px;
      color: white;
    }
    .status.New { background: #7b1fa2; }
    .status.Stable { background: #43a047; }
    .status.Critical { background: #f57c00; }
    .status.Discharged { background: #0288d1; }
    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; }
      .table-wrapper { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyCTUw2zpoz_lgMrDCt00CsudqvZgGu4xko",
      authDomain: "unit-e-1d07b.firebaseapp.com",
      databaseURL: "https://unit-e-1d07b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "unit-e-1d07b",
      storageBucket: "unit-e-1d07b.firebasestorage.app",
      messagingSenderId: "465930916258",
      appId: "1:465930916258:web:0ec4d478bb3d6d7bd262fb",
      measurementId: "G-6W2X2BBJLQ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const { useState, useEffect } = React;

    function WardRoundsApp() {
      const [patients, setPatients] = useState([]);
      const [filterStatus, setFilterStatus] = useState('New admission');
      const [search, setSearch] = useState('');

      useEffect(() => {
        const patientsRef = db.ref('patients');
        patientsRef.on('value', (snapshot) => {
          const data = snapshot.val() || {};
          const patientsArray = Object.entries(data).map(([id, value]) => ({ id, ...value }));
          setPatients(patientsArray);
        });
        return () => patientsRef.off();
      }, []);

      const filtered = patients.filter(p =>
        (!filterStatus || p.status === filterStatus) &&
        (p.patientName || '').toLowerCase().includes(search.toLowerCase())
      );

      const erPatients = filtered.filter(p => p.location === 'ER');
      const wardPatients = filtered.filter(p => p.location !== 'ER');

      const addPatient = () => {
        const name = prompt("Enter patient name:");
        if (!name) return;
        const newPatient = {
          patientName: name,
          diagnosis: "Not specified",
          location: "Ward 1",
          assignedDoctor: "Unassigned",
          status: "New admission",
        };
        db.ref('patients').push(newPatient);
      };

      const exportData = () => {
        const ws = XLSX.utils.json_to_sheet(patients);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Patients");
        XLSX.writeFile(wb, "UnitE_WardRounds.xlsx");
      };

      const importData = (event) => {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            const json = JSON.parse(e.target.result);
            Object.values(json).forEach(p => db.ref('patients').push(p));
            alert("Imported successfully!");
          };
          reader.readAsText(file);
        }
      };

      return (
        <div className="container">
          <div className="header">
            <h1>Unit E Ward Rounds</h1>
            <div className="header-buttons">
              <button className="btn btn-primary" onClick={addPatient}>+ Add</button>
              <button className="btn btn-secondary" onClick={exportData}>Export</button>
              <label className="btn btn-secondary">
                Import
                <input type="file" accept=".json" style={{ display: "none" }} onChange={importData}/>
              </label>
            </div>
          </div>

          <div className="controls">
            <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
              <option value="">All statuses</option>
              <option value="New admission">New admission</option>
              <option value="Stable">Stable</option>
              <option value="Critical">Critical</option>
              <option value="Discharged">Discharged</option>
            </select>
            <input type="text" placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} />
          </div>

          <div className="content">
            {erPatients.length > 0 && (
              <div className="ward-section">
                <div className="ward-header er-header">Emergency Room (ER)</div>
                <div className="table-wrapper">
                  <table>
                    <thead><tr><th>Name</th><th>Diagnosis</th><th>Doctor</th><th>Status</th></tr></thead>
                    <tbody>
                      {erPatients.map(p => (
                        <tr key={p.id}>
                          <td>{p.patientName}</td>
                          <td>{p.diagnosis}</td>
                          <td>{p.assignedDoctor}</td>
                          <td><span className="status New">{p.status}</span></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            <div className="ward-section">
              <div className="ward-header">Wards</div>
              <div className="table-wrapper">
                <table>
                  <thead><tr><th>Name</th><th>Diagnosis</th><th>Location</th><th>Doctor</th><th>Status</th></tr></thead>
                  <tbody>
                    {wardPatients.map(p => (
                      <tr key={p.id}>
                        <td>{p.patientName}</td>
                        <td>{p.diagnosis}</td>
                        <td>{p.location}</td>
                        <td>{p.assignedDoctor}</td>
                        <td><span className="status New">{p.status}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WardRoundsApp />);
  </script>
</body>
</html>

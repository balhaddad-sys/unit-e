  <style>

    .wrap{ max-width:1200px; margin:0 auto; padding:10px; }

    .topbar{ background:var(--green); color:white; padding:12px 16px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); }

    .btn-del{ width:28px; height:28px; border-radius:6px; background:#fef2f2; color:#ef4444; border:1px solid #fee2e2; font-weight:bold; cursor:pointer; }

    .modal-head{ background:var(--purple); padding:14px; color:white; font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
    .modal-body{ padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
    .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:12px 16px; border-top:1px solid var(--border); }
    
    .sync-badge { font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: 600; }
    .sync-badge.idle { background: rgba(255,255,255,0.2); color: white; }
    .sync-badge.syncing { background: #fef08a; color: #854d0e; }

    /* Lab Image Styles */
    .add-lab-area { border: 2px dashed var(--purple); border-radius: 12px; padding: 24px; text-align: center; background: #faf5ff; cursor: pointer; transition: all 0.2s; }
    .add-lab-area:hover { background: #f3e8ff; border-color: #a855f7; }
    .add-lab-icon { font-size: 32px; margin-bottom: 8px; }
    .add-lab-text { font-weight: 600; color: var(--purple); margin-bottom: 4px; }

    .lab-images-grid { display: flex; flex-direction: column; gap: 12px; }
    .lab-image-card { background: #f8fafc; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    .lab-image-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: linear-gradient(135deg, #7e22ce 0%, #a855f7 100%); color: white; }
    .lab-image-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .lab-image-btn.delete:hover { background: rgba(239,68,68,0.8); }

    /* Image Viewer */
    .image-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; display: flex; flex-direction: column; }
    .image-viewer-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; color: white; }
    .image-viewer-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
    .image-viewer-body img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    .image-viewer-nav { display: flex; justify-content: center; gap: 12px; padding: 16px; }
    .image-viewer-nav button { background: rgba(255,255,255,0.1); border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }

    @media(min-width: 768px){
      .p-card{ flex-direction:row; align-items:flex-start; gap:14px; }
      .col-1{ width:130px; display:flex; flex-direction:column; gap:6px; }
      .col-2{ flex:1; display:flex; flex-direction:column; gap:6px; }
      .col-3{ width:280px; display:flex; flex-direction:column; gap:6px; }
    }
  </style>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCTUw2zpoz_lgMrDCt00CsudqvZgGu4xko",
      authDomain: "unit-e-1d07b.firebaseapp.com",
      databaseURL: "https://unit-e-1d07b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "unit-e-1d07b",
      storageBucket: "unit-e-1d07b.firebasestorage.app",
      messagingSenderId: "465930916258",
      appId: "1:465930916258:web:0ec4d478bb3d6d7bd262fb"
    };

    if (window.firebase && !firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    const SHEETS_SYNC_URL = "https://script.google.com/macros/s/AKfycbzeCRMInJT0ipKr3xgVvDpr6O3Y21dX7qqxoXipDdYz-JvrLZoC71xLicQO2lKxz6Rwzg/exec";
    const pingSheets = () => {
      const url = `${SHEETS_SYNC_URL}?t=${Date.now()}`;
      if (navigator.sendBeacon) navigator.sendBeacon(url, new Blob([], { type: "text/plain" }));
      else fetch(url, { method: "GET", mode: "no-cors", cache: "no-store" }).catch(() => {});
    };

    const WARD_ORDER = ["Ward 19", "Ward 20", "Ward 21", "Ward 22", "Ward 27", "Ward 5", "Ward 10", "ICU", "ER", "Unassigned"];
    const STATUS_OPTIONS = ["New", "Chronic", "Non-Chronic"];
    
    const formatDateTime = (ts) => {
      if (!ts) return { date: "", time: "" };
      const d = new Date(ts);
      return {
        date: d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
        time: d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
      };
    };

    const compressImage = (file, maxWidth = 800) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width, height = img.height;
            if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.5));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

    // --- ENHANCED PRE-PROCESSING: UPSCALE + CONTRAST ---
    const preprocessImage = (imageFile) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = URL.createObjectURL(imageFile);
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          // 1. UPSCALING: We multiply dims by 2.5. 
          // This makes text large enough for Tesseract to see dots vs commas.
          const scaleFactor = 2.5; 
          canvas.width = img.width * scaleFactor;
          canvas.height = img.height * scaleFactor;
          
          // Draw image scaled up
          ctx.scale(scaleFactor, scaleFactor);
          ctx.drawImage(img, 0, 0);
          
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;
          
          // 2. ADAPTIVE BINARIZATION
          // Instead of simple contrast, we check pixel brightness.
          // If a pixel is lighter than grey (128), we make it WHITE. Otherwise BLACK.
          // This removes paper texture and shadows.
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i + 1], b = data[i + 2];
            // Human perception of brightness
            const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
            
            // Threshold: 140 is usually good for black text on white paper
            const val = brightness > 140 ? 255 : 0; 
            
            data[i] = data[i + 1] = data[i + 2] = val;
          }
          
          ctx.putImageData(imgData, 0, 0);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
      });
    };

    // --- ENHANCED PARSER: Fuzzy Matching for Lab Labels ---
    const robustParse = (text) => {
      // Common OCR error fixes
      const clean = text.replace(/\|/g, 'I').replace(/O/g, '0').replace(/o/g, '0');
      const results = {};
      
      // Regex Logic:
      // (?:...) non-capturing group for synonyms
      // [^0-9]*?  Skip any garbage chars (like ":", ".", " ", "-") until the number
      // (\d+[.,]?\d*) Capture the number
      const patterns = [
        // WBC: matches "WBC", "Leukocytes", "W.B.C"
        { key: 'WBC', regex: /(?:WBC|W\.B\.C|Leukocytes|White\sBlood)[^0-9]*?(\d+[.,]?\d*)/i },
        // Hb: matches "Hb", "HGB", "Hemoglobin"
        { key: 'Hb',  regex: /(?:Hb|HGB|H\.G\.B|Hemoglobin)[^0-9]*?(\d+[.,]?\d*)/i },
        // Plt: matches "PLT", "Platelet", "Plts"
        { key: 'Plt', regex: /(?:PLT|P1T|Platelet)[^0-9]*?(\d{2,})/i },
        // Cr: matches "Cr", "Creatinine", "CRE"
        { key: 'Cr',  regex: /(?:Cre|Creatinine|Cr\.|Cr)[^0-9]*?(\d+[.,]?\d*)/i }
      ];

      patterns.forEach(p => {
        // Try line by line first (Highest Precision)
        const lines = clean.split('\n');
        let found = null;
        
        for(let line of lines) {
           // Skip lines that are too short to be valid results
           if(line.length < 5) continue;
           
           const match = line.match(p.regex);
           if (match && match[1]) {
             // Valid Lab Logic: WBC < 50, Hb < 20. If it reads "200" for Hb, it's likely wrong.
             const num = parseFloat(match[1].replace(',', '.'));
             // Basic Sanity Check (Optional, but helps precision)
             if(p.key === 'Hb' && num > 25) continue; // Unlikely Hb
             
             found = match[1].replace(',', '.');
             break; 
           }
        }
        
        // Fallback: Search whole text if line-search fails
        if (!found) {
            const match = clean.match(p.regex);
            if(match && match[1]) found = match[1].replace(',', '.');
        }

        if (found) results[p.key] = found;
      });

      return results;
    };

    const LabModal = ({ patient, onClose, onSave }) => {
      const [labImages, setLabImages] = useState(() => {
        const data = patient.labImages;
        if (!data) return [];
        return Array.isArray(data) ? data : Object.values(data); 
      });

      const [labValues, setLabValues] = useState(() => patient.labValues || []);
      const [viewMode, setViewMode] = useState('images'); 
      const [processing, setProcessing] = useState(false);
      const [statusMsg, setStatusMsg] = useState("");
      const [saving, setSaving] = useState(false);
      const fileRef = useRef(null);

      const handleFile = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        setProcessing(true);
        setStatusMsg("Enhancing image & reading...");
        
        try {
          const compressed = await compressImage(file);
          
          // 1. Process with Upscaling
          const cleanImageBase64 = await preprocessImage(file);
          
          // 2. OCR with Specific Whitelist (Only allow lab characters)
          let extracted = {};
          try {
            const worker = await Tesseract.createWorker('eng');
            await worker.setParameters({
              // Only allow letters, numbers, dots, commas, spaces, % and /
              tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.,%:/ '
            });
            const ret = await worker.recognize(cleanImageBase64);
            extracted = robustParse(ret.data.text);
            await worker.terminate();
          } catch (ocrErr) {
            console.error(ocrErr);
          }

          const timestamp = Date.now();
          const newImage = { id: timestamp.toString(), image: compressed, timestamp: timestamp, note: "" };

          if (Object.keys(extracted).length > 0) {
             const newValEntry = { id: timestamp.toString(), date: timestamp, ...extracted };
             setLabValues(prev => [newValEntry, ...prev]);
             setViewMode('table'); 
             setStatusMsg(`Found: WBC ${extracted.WBC||'-'}, Hb ${extracted.Hb||'-'}`);
          } else {
             setStatusMsg("Could not read values. Please enter manually.");
             setViewMode('table');
          }

          setLabImages(prev => [newImage, ...prev]);
        } catch (err) {
          console.error(err);
          setStatusMsg("Error processing.");
        }
        setProcessing(false);
        e.target.value = ''; 
      };

      const handleDeleteVal = (id) => {
        if(confirm("Delete this entry?")) setLabValues(prev => prev.filter(v => v.id !== id));
      };

      const handleSave = async () => {
        setSaving(true);
        await onSave(patient.id, { labImages, labValues });
        setSaving(false);
        onClose();
      };

      return (
        <div className="modalOverlay">
          <div className="modal">
            <div className="modal-head">
              <span>🧪 Labs: {patient.name}</span>
              {!saving && <button onClick={onClose} style={{background:'none',border:'none',color:'white',fontSize:'18px'}}>×</button>}
            </div>

            <div style={{display:'flex', padding:'10px', gap:'10px', background:'#f8fafc', borderBottom:'1px solid #e2e8f0'}}>
              <button onClick={() => setViewMode('images')} className={`btn ${viewMode === 'images' ? 'btn-blue' : 'btn-white'}`} style={{flex:1}}>📷 Photos</button>
              <button onClick={() => setViewMode('table')} className={`btn ${viewMode === 'table' ? 'btn-blue' : 'btn-white'}`} style={{flex:1}}>📊 Flowsheet</button>
            </div>

            <div className="modal-body">
              {statusMsg && <div style={{padding:'8px', background:'#f0fdf4', color:'#166534', fontSize:'13px', borderRadius:'6px', marginBottom:'10px', border:'1px solid #bbf7d0'}}>{statusMsg}</div>}

              {viewMode === 'images' && (
                <>
                  <div className="add-lab-area" onClick={() => !processing && fileRef.current?.click()} style={{opacity: processing?0.5:1}}>
                    <input type="file" ref={fileRef} hidden accept="image/*" onChange={handleFile} />
                    {processing ? <div className="add-lab-text">⏳ Enhancing & Scanning...</div> : 
                    <><div className="add-lab-icon">📸</div><div className="add-lab-text">Add Lab Photo</div></>}
                  </div>
                  <div className="lab-images-grid">
                    {labImages.map((img) => (
                      <div key={img.id} className="lab-image-card">
                        <div className="lab-image-header">
                           <span>{formatDateTime(img.timestamp).date}</span>
                           <button className="lab-image-btn delete" onClick={() => {
                             if(confirm('Delete?')) setLabImages(prev => prev.filter(i => i.id !== img.id));
                           }}>×</button>
                        </div>
                        <img src={img.image} style={{width:'100%', display:'block'}} />
                      </div>
                    ))}
                  </div>
                </>
              )}

              {viewMode === 'table' && (
                <div>
                  <table style={{width:'100%', borderCollapse:'collapse', fontSize:'13px'}}>
                    <thead>
                      <tr style={{background:'#f1f5f9', color:'#475569'}}>
                        <th style={{padding:'8px', textAlign:'left'}}>Date</th>
                        <th style={{padding:'8px', textAlign:'left'}}>WBC</th>
                        <th style={{padding:'8px', textAlign:'left'}}>Hb</th>
                        <th style={{padding:'8px', textAlign:'left'}}>Plt</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody>
                      {labValues.map((val) => (
                        <tr key={val.id} style={{borderBottom:'1px solid #cbd5e1'}}>
                          <td style={{padding:'8px', color:'#64748b'}}>{formatDateTime(val.date).date}</td>
                          <td style={{padding:'4px'}}><input className="inp" style={{width:'50px', fontWeight:'bold'}} value={val.WBC||''} onChange={(e)=> {
                             const v = e.target.value; setLabValues(prev => prev.map(p => p.id === val.id ? {...p, WBC: v} : p))
                          }} /></td>
                          <td style={{padding:'4px'}}><input className="inp" style={{width:'50px', fontWeight:'bold'}} value={val.Hb||''} onChange={(e)=> {
                             const v = e.target.value; setLabValues(prev => prev.map(p => p.id === val.id ? {...p, Hb: v} : p))
                          }} /></td>
                          <td style={{padding:'4px'}}><input className="inp" style={{width:'50px', fontWeight:'bold'}} value={val.Plt||''} onChange={(e)=> {
                             const v = e.target.value; setLabValues(prev => prev.map(p => p.id === val.id ? {...p, Plt: v} : p))
                          }} /></td>
                           <td><button className="btn-del" onClick={()=>handleDeleteVal(val.id)}>×</button></td>
                        </tr>
                      ))}
                      <tr>
                         <td colSpan="5" style={{padding:'10px', textAlign:'center'}}>
                           <button className="btn btn-white" style={{fontSize:'12px', width:'100%', justifyContent:'center'}} onClick={()=>{
                             setLabValues(prev => [{id: Date.now().toString(), date: Date.now(), WBC:'', Hb:'', Plt:''}, ...prev])
                           }}>+ Add Manual Row</button>
                         </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              )}
            </div>
            <div className="modal-foot">
              <button className="btn btn-green" onClick={handleSave} disabled={saving}>{saving?'Saving...':'Save Changes'}</button>
            </div>
          </div>
        </div>
      );
    };

    const ImageViewer = ({ images, currentIndex, onClose, onNavigate }) => {
      const current = images[currentIndex];
      if (!current) return null;
      return (
        <div className="image-viewer" onClick={onClose}>
          <div className="image-viewer-header" onClick={e => e.stopPropagation()}>
            <div className="image-viewer-title">
              {formatDateTime(current.timestamp).date} {formatDateTime(current.timestamp).time}
            </div>
            <button style={{background:'none', border:'none', color:'white', fontSize:'24px', cursor:'pointer'}} onClick={onClose}>×</button>
          </div>
          <div className="image-viewer-body" onClick={e => e.stopPropagation()}>
            <img src={current.image} />
          </div>
          {images.length > 1 && (
            <div className="image-viewer-nav" onClick={e => e.stopPropagation()}>
              <button onClick={() => onNavigate(currentIndex - 1)} disabled={currentIndex === 0}>←</button>
              <span style={{color:'white'}}>{currentIndex + 1} / {images.length}</span>
              <button onClick={() => onNavigate(currentIndex + 1)} disabled={currentIndex === images.length - 1}>→</button>
            </div>
          )}
        </div>
      );
    };

    const UnitWardRounds = () => {
      const [patients, setPatients] = useState([]);
      const [notice, setNotice] = useState("");
      const [noticeCollapsed, setNoticeCollapsed] = useState(false);
      const [search, setSearch] = useState("");
      const [statusFilter, setStatusFilter] = useState("All");
      const [collapsedWards, setCollapsedWards] = useState({});
      const [isSyncing, setIsSyncing] = useState(false);
      const [viewingLabsFor, setViewingLabsFor] = useState(null);

      useEffect(() => {
        setIsSyncing(true);
        const pRef = db.ref('patients');
        const nRef = db.ref('notice');
        
        pRef.on('value', (snap) => {
          const val = snap.val();
          if (val) {
            const arr = Object.keys(val).map(k => ({ id: k, ...val[k] }));
            setPatients(arr);
          } else {
            setPatients([]);
          }
          setIsSyncing(false);
        });

        nRef.on('value', (snap) => {
          setNotice(snap.val() || "");
        });

        return () => { pRef.off(); nRef.off(); };
      }, []);

      const updatePatient = (id, field, value) => {
        const pIndex = patients.findIndex(p => p.id === id);
        if (pIndex === -1) return;
        const newPatients = [...patients];
        newPatients[pIndex] = { ...newPatients[pIndex], [field]: value };
        setPatients(newPatients);
        
        db.ref(`patients/${id}`).update({ [field]: value });
        if(field === 'status' || field === 'ward') pingSheets();
      };

      const addPatient = () => {
        const newRef = db.ref('patients').push();
        const newP = { id: newRef.key, ward: "Unassigned", bed: "", name: "", status: "New", diagnosis: "", plan: "", labs: 0, labImages: [] };
        newRef.set(newP);
      };

      const deletePatient = (id) => {
        if (confirm("Delete patient?")) {
          db.ref(`patients/${id}`).remove();
        }
      };

      const saveLabs = async (patientId, data) => {
        const pIndex = patients.findIndex(p => p.id === patientId);
        if (pIndex === -1) return;
        const updatedPatient = { ...patients[pIndex], labImages: data.labImages, labValues: data.labValues };
        const updatedPatients = [...patients];
        updatedPatients[pIndex] = updatedPatient;
        setPatients(updatedPatients);
        
        await db.ref(`patients/${patientId}`).update({ labImages: data.labImages, labValues: data.labValues });
      };

      const saveNotice = () => {
        db.ref('notice').set(notice);
      };

      const toggleWard = (w) => {
        setCollapsedWards(prev => ({...prev, [w]: !prev[w]}));
      };

      const filtered = patients.filter(p => {
        const s = search.toLowerCase();
        const matchSearch = (p.name || "").toLowerCase().includes(s) || (p.diagnosis || "").toLowerCase().includes(s);
        const matchFilter = statusFilter === "All" || p.status === statusFilter;
        return matchSearch && matchFilter;
      });

      const byWard = useMemo(() => {
        const grp = {};
        WARD_ORDER.forEach(w => grp[w] = []);
        filtered.forEach(p => {
          const w = p.ward && WARD_ORDER.includes(p.ward) ? p.ward : "Unassigned";
          if (!grp[w]) grp[w] = [];
          grp[w].push(p);
        });
        return grp;
      }, [filtered]);

      const getCounts = () => {
        const c = { New: 0, Chronic: 0, "Non-Chronic": 0 };
        patients.forEach(p => { if (c[p.status] !== undefined) c[p.status]++; });
        return c;
      };
      const counts = getCounts();

      return (
        <div className="wrap">
          <div className="topbar">
            <div className="title-row">
              <div className="title">
                <h1>Unit E Rounds</h1>
              </div>
              <span className={`sync-badge ${isSyncing ? 'syncing' : 'idle'}`}>
                {isSyncing ? 'Syncing...' : 'Live'}
              </span>
            </div>
            <div className="actions">
              <button className="btn btn-white" onClick={addPatient}>+ Patient</button>
              <button className="btn btn-green" onClick={() => window.open(SHEET_URL, '_blank')}>
                <img src="https://img.icons8.com/color/48/google-sheets.png" width="16" alt="sheets"/> Sheet
              </button>
            </div>
          </div>

          <div className={`notice-banner ${noticeCollapsed ? 'notice-collapsed' : ''}`} onClick={() => noticeCollapsed && setNoticeCollapsed(false)}>
            <div className="notice-header">
              <span className="notice-title">Team Announcement</span>
              <div className="notice-actions">
                {!noticeCollapsed && <button className="notice-btn save" onClick={(e) => { e.stopPropagation(); saveNotice(); }}>Save</button>}
                <button className="notice-btn" onClick={(e) => { e.stopPropagation(); setNoticeCollapsed(!noticeCollapsed); }}>
                  {noticeCollapsed ? 'Expand' : 'Hide'}
                </button>
              </div>
            </div>
            {!noticeCollapsed && (
              <textarea 
                className="notice-textarea" 
                placeholder="Write handover notes, instructions, or meeting times here..." 
                value={notice} 
                onChange={e => setNotice(e.target.value)}
              />
            )}
            {noticeCollapsed && (
               <div className={`notice-content ${!notice ? 'empty' : ''}`}>
                 {notice || "No announcements."}
               </div>
            )}
          </div>

          <div className="controls-container">
            <div className="filter-row">
              <button className={`filter-btn ${statusFilter === 'All' ? 'active' : ''}`} onClick={() => setStatusFilter('All')}>
                All ({patients.length})
              </button>
              {STATUS_OPTIONS.map(s => (
                <button key={s} className={`filter-btn ${statusFilter === s ? 'active' : ''}`} onClick={() => setStatusFilter(s)}>
                  {s} ({counts[s]})
                </button>
              ))}
            </div>
            <input 
              className="search-bar" 
              placeholder="Search patient name or diagnosis..." 
              value={search} 
              onChange={e => setSearch(e.target.value)} 
            />
          </div>

          {WARD_ORDER.map(ward => {
            const list = byWard[ward] || [];
            if (list.length === 0) return null;
            const isCollapsed = collapsedWards[ward];

            return (
              <div key={ward} className="ward-section">
                <div className="ward-header" onClick={() => toggleWard(ward)}>
                  <span>{ward}</span>
                  <span className="ward-count">{list.length}</span>
                  <span className={`arrow ${isCollapsed ? 'collapsed' : ''}`}>▼</span>
                </div>
                <div className={`ward-body ${isCollapsed ? 'is-hidden' : ''}`}>
                  {list.map(p => (
                    <div key={p.id} className="p-card">
                      <div className="col-1">
                        <input className="inp inp-bed" placeholder="Bed" value={p.bed} onChange={(e) => updatePatient(p.id, 'bed', e.target.value)} />
                        <select className="inp" value={p.ward} onChange={(e) => updatePatient(p.id, 'ward', e.target.value)}>
                          {WARD_ORDER.map(w => <option key={w} value={w}>{w}</option>)}
                        </select>
                        <select 
                          className={`status-select ${p.status === 'New' ? 'status-new' : p.status === 'Chronic' ? 'status-chronic' : 'status-non'}`} 
                          value={p.status} 
                          onChange={(e) => updatePatient(p.id, 'status', e.target.value)}
                        >
                          {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                        </select>
                      </div>
                      
                      <div className="col-2">
                        <input className="inp inp-name" placeholder="Patient Name" value={p.name} onChange={(e) => updatePatient(p.id, 'name', e.target.value)} />
                        <textarea className="inp inp-area" placeholder="Diagnosis / Active Issues" value={p.diagnosis} onChange={(e) => updatePatient(p.id, 'diagnosis', e.target.value)} />
                      </div>
                      
                      <div className="col-3">
                         <textarea className="inp inp-area" placeholder="Plan" value={p.plan} onChange={(e) => updatePatient(p.id, 'plan', e.target.value)} />
                         <div style={{display:'flex', justifyContent:'space-between'}}>
                           <button 
                             className={`btn-lab ${p.labImages && (Array.isArray(p.labImages) ? p.labImages.length : Object.keys(p.labImages).length) > 0 ? 'has-labs' : ''}`}
                             onClick={() => setViewingLabsFor(p)}
                           >
                             🧪 View Labs
                             {p.labImages && (Array.isArray(p.labImages) ? p.labImages.length : Object.keys(p.labImages).length) > 0 && (
                               <div className="lab-count">
                                 {Array.isArray(p.labImages) ? p.labImages.length : Object.keys(p.labImages).length}
                               </div>
                             )}
                           </button>
                           <button className="btn-del" onClick={() => deletePatient(p.id)}>×</button>
                         </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}

          {viewingLabsFor && (
            <LabModal 
              patient={viewingLabsFor} 
              onClose={() => setViewingLabsFor(null)}
              onSave={saveLabs}
            />
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<UnitWardRounds />);
  </script>
</body>
</html>

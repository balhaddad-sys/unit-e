const parseVisionToNeuralInput = (rawText) => {
    if (!rawText) return [];
    
    // 1. Clean up common monitor glare artifacts
    const cleanLines = rawText.split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l.length > 2); // Ignore tiny noise
        
    const potentialItems = [];

    // 2. The Regex: Looks for "TestName ... Number"
    // Captures: "WBC 5.4", "Hb . 120", "Platelets: 250"
    const lineRegex = /([a-zA-Z%\/\-\(\)\+\s]{2,15})[:\.\s\|]+([<>]?\d{1,4}(?:\.\d{1,3})?)/;

    cleanLines.forEach(line => {
        // Skip header trash
        if (/(Name|Date|Sex|Age|Page|Report|Unit|Ref)/i.test(line)) return;

        const match = line.match(lineRegex);
        if (match) {
            potentialItems.push({
                test: match[1].trim(), // e.g. "WBC"
                value: match[2].trim() // e.g. "5.4"
            });
        }
    });

    return potentialItems;
};

let _ocrWorker = null;
let _ocrWorkerReady = false;

const getOcrWorker = async (loggerFn) => {
    if (_ocrWorker && _ocrWorkerReady) return _ocrWorker;
    if (_ocrWorker) {
        try { await _ocrWorker.terminate(); } catch (e) { console.warn("Error terminating old worker:", e); }
        _ocrWorker = null;
        _ocrWorkerReady = false;
    }
    loggerFn && loggerFn({ status: "initializing", progress: 0 });
    try {
        _ocrWorker = await Tesseract.createWorker('eng', 1, {
            logger: (m) => { console.log("Tesseract:", m); loggerFn && loggerFn(m); }
        });
        _ocrWorkerReady = true;
        console.log("OCR Worker ready!");
        return _ocrWorker;
    } catch (err) {
        console.error("Failed to create OCR worker:", err);
        _ocrWorker = null;
        _ocrWorkerReady = false;
        throw err;
    }
};

const callVisionAPI = async (dataUrl, options = {}, setProgress, setStage, debugLog) => {
    debugLog && debugLog('info', 'Starting Vision API call...');
    setStage && setStage("Preprocessing for Vision...");
    setProgress && setProgress(5);

    // ✅ Preprocess specifically for Vision (NO binarize)
    const pre = await preprocessForOCR(dataUrl, {
        mode: options.mode || "CBC",
        smartCrop: options.smartCrop !== false,
        manualCrop: options.manualCrop || null,
        deskew: options.deskew !== false,
        binarize: false,          // ✅ key change
        contrastBoost: 1.2
    });

    setStage && setStage("Connecting to Google Vision API...");
    setProgress && setProgress(15);

    let imageData = pre.processed;
    if (imageData.includes(',')) imageData = imageData.split(',')[1];

    debugLog && debugLog('info', `Processed image length: ${imageData.length} chars`);
    debugLog && debugLog('info', `Proxy URL: ${VISION_API_PROXY_URL}`);

    try {
        const requestBody = {
            action: 'ocr',
            image: imageData,
            mode: 'DOCUMENT_TEXT_DETECTION',      // ✅ correct feature
            // Extra hints (safe even if proxy ignores them)
            languageHints: ['en'],                // add 'ar' if needed: ['en','ar']
            clientMeta: {
                ocrMode: options.mode || "CBC",
                skewAngle: pre.skewAngle,
                usedCrop: pre.cropUsed
            }
        };

        debugLog && debugLog('info', `Request payload size: ${JSON.stringify(requestBody).length} bytes`);

        const response = await fetch(VISION_API_PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(requestBody),
            redirect: 'follow'
        });

        debugLog && debugLog('info', `Response status: ${response.status} ${response.statusText}`);
        setProgress && setProgress(70);
        setStage && setStage("Processing Vision API response...");

        const responseText = await response.text();
        debugLog && debugLog('info', `Response body (first 500): ${responseText.substring(0, 500)}`);

        if (!response.ok) throw new Error(`Vision API HTTP ${response.status} - ${responseText}`);

        let result;
        try { result = JSON.parse(responseText); }
        catch { throw new Error(`Failed to parse response: ${responseText.substring(0, 200)}`); }

        if (result.error) throw new Error(result.error);

        setProgress && setProgress(95);

        return {
            text: result.text || "",
            confidence: result.confidence || 85,
            lines: result.lines || [],
            source: 'google_vision',
            wordCount: result.wordCount || 0,
            cropUsed: pre.cropUsed,
            skewAngle: pre.skewAngle,
            threshold: pre.threshold
        };
    } catch (err) {
        debugLog && debugLog('error', `Vision API call failed: ${err.message}`);
        throw err;
    }
};
// ============ IMAGE PREPROCESSING ============
const clamp01 = (x) => Math.max(0, Math.min(1, x));

const luminanceGray = (r, g, b) => (0.2126 * r + 0.7152 * g + 0.0722 * b) | 0;

const boxBlurGray = (gray, w, h) => {
    const out = new Uint8ClampedArray(gray.length);
    const idx = (x, y) => y * w + x;
    for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
            let sum = 0;
            sum += gray[idx(x-1, y-1)] + gray[idx(x, y-1)] + gray[idx(x+1, y-1)];
            sum += gray[idx(x-1, y)] + gray[idx(x, y)] + gray[idx(x+1, y)];
            sum += gray[idx(x-1, y+1)] + gray[idx(x, y+1)] + gray[idx(x+1, y+1)];
            out[idx(x, y)] = (sum / 9) | 0;
        }
    }
    for (let x = 0; x < w; x++) { out[idx(x, 0)] = gray[idx(x, 0)]; out[idx(x, h-1)] = gray[idx(x, h-1)]; }
    for (let y = 0; y < h; y++) { out[idx(0, y)] = gray[idx(0, y)]; out[idx(w-1, y)] = gray[idx(w-1, y)]; }
    return out;
};

const otsuThreshold = (gray) => {
    const hist = new Array(256).fill(0);
    for (let i = 0; i < gray.length; i++) hist[gray[i]]++;
    const total = gray.length;
    let sum = 0;
    for (let t = 0; t < 256; t++) sum += t * hist[t];
    let sumB = 0, wB = 0, wF = 0, varMax = 0, threshold = 128;
    for (let t = 0; t < 256; t++) {
        wB += hist[t];
        if (wB === 0) continue;
        wF = total - wB;
        if (wF === 0) break;
        sumB += t * hist[t];
        const mB = sumB / wB;
        const mF = (sum - sumB) / wF;
        const between = wB * wF * (mB - mF) * (mB - mF);
        if (between > varMax) { varMax = between; threshold = t; }
    }
    return threshold;
};

const rotateCanvas = (srcCanvas, angleDeg) => {
    const ang = angleDeg * Math.PI / 180;
    const w = srcCanvas.width, h = srcCanvas.height;
    const cos = Math.abs(Math.cos(ang));
    const sin = Math.abs(Math.sin(ang));
    const nw = Math.ceil(w * cos + h * sin);
    const nh = Math.ceil(w * sin + h * cos);
    const out = document.createElement("canvas");
    out.width = nw; out.height = nh;
    const ctx = out.getContext("2d", { willReadFrequently: true });
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, nw, nh);
    ctx.translate(nw / 2, nh / 2);
    ctx.rotate(ang);
    ctx.drawImage(srcCanvas, -w / 2, -h / 2);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    return out;
};

const projectionScore = (binCanvas) => {
    const ctx = binCanvas.getContext("2d", { willReadFrequently: true });
    const { width: w, height: h } = binCanvas;
    const data = ctx.getImageData(0, 0, w, h).data;
    const rows = new Array(h).fill(0);
    for (let y = 0; y < h; y++) {
        let sum = 0;
        for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            if (data[i] < 128) sum++;
        }
        rows[y] = sum;
    }
    let mean = rows.reduce((a, b) => a + b, 0) / h;
    let v = 0;
    for (let y = 0; y < h; y++) { const d = rows[y] - mean; v += d * d; }
    return v / h;
};

const detectSkewAngle = (binCanvas) => {
    const maxW = 600;
    const scale = binCanvas.width > maxW ? (maxW / binCanvas.width) : 1;
    const proxy = document.createElement("canvas");
    proxy.width = Math.floor(binCanvas.width * scale);
    proxy.height = Math.floor(binCanvas.height * scale);
    const pctx = proxy.getContext("2d", { willReadFrequently: true });
    pctx.imageSmoothingEnabled = false;
    pctx.drawImage(binCanvas, 0, 0, proxy.width, proxy.height);
    let bestAngle = 0;
    let bestScore = -Infinity;
    for (let a = -6; a <= 6; a += 0.5) {
        const rot = rotateCanvas(proxy, a);
        const s = projectionScore(rot);
        if (s > bestScore) { bestScore = s; bestAngle = a; }
    }
    return bestAngle;
};

const applyCropToCanvas = (img, crop) => {
    const c = { top: clamp01(crop?.top ?? 0), bottom: clamp01(crop?.bottom ?? 0), left: clamp01(crop?.left ?? 0), right: clamp01(crop?.right ?? 0) };
    const sx = Math.floor(img.width * c.left), sy = Math.floor(img.height * c.top);
    const sw = Math.floor(img.width * (1 - c.left - c.right)), sh = Math.floor(img.height * (1 - c.top - c.bottom));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, sw); canvas.height = Math.max(1, sh);
    canvas.getContext("2d", { willReadFrequently: true }).drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    return canvas;
};

const preprocessForOCR = async (dataUrl, options = {}) => {
    const { mode = "CBC", smartCrop = true, manualCrop = null, deskew = true } = options;
    const img = new Image();
    img.src = dataUrl;
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("Failed to load image")); });
    const modeConfig = OCR_MODES[mode] || OCR_MODES.Other;
    const crop = manualCrop || (smartCrop ? modeConfig.crop : { top: 0, bottom: 0, left: 0, right: 0 });
    const croppedCanvas = applyCropToCanvas(img, crop);
    const scale = (croppedCanvas.width < 900 ? 2.2 : 1.8);
    const upCanvas = document.createElement("canvas");
    upCanvas.width = Math.floor(croppedCanvas.width * scale);
    upCanvas.height = Math.floor(croppedCanvas.height * scale);
    const upCtx = upCanvas.getContext("2d", { willReadFrequently: true });
    upCtx.imageSmoothingEnabled = false;
    upCtx.drawImage(croppedCanvas, 0, 0, upCanvas.width, upCanvas.height);
    const imageData = upCtx.getImageData(0, 0, upCanvas.width, upCanvas.height);
    const d = imageData.data;
    const gray = new Uint8ClampedArray(upCanvas.width * upCanvas.height);
    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
        gray[p] = luminanceGray(d[i], d[i+1], d[i+2]);
    }
    const blurred = boxBlurGray(gray, upCanvas.width, upCanvas.height);
    const th = otsuThreshold(blurred);
    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
        const v = blurred[p] < th ? 0 : 255;
        d[i] = d[i+1] = d[i+2] = v;
        d[i+3] = 255;
    }
    upCtx.putImageData(imageData, 0, 0);
    let finalCanvas = upCanvas;
    let skewAngle = 0;
    if (deskew) {
        try {
            skewAngle = detectSkewAngle(upCanvas);
            if (Math.abs(skewAngle) >= 0.3) {
                finalCanvas = rotateCanvas(upCanvas, -skewAngle);
            }
        } catch (e) { console.warn("Deskew failed; continuing without:", e); }
    }
    return { processed: finalCanvas.toDataURL("image/png"), cropUsed: crop, skewAngle, threshold: th };
};

// ============ TESSERACT OCR (with preprocessing) ============
const runTesseractOCR = async (dataUrl, options = {}, setProgress, setStage, debugLog) => {
    const { mode = "CBC", smartCrop = true, manualCrop = null, deskew = true, psm = "6" } = options;
    debugLog && debugLog('info', 'Starting Tesseract OCR...');
    try {
        setStage && setStage("Preprocessing (Otsu + deskew)...");
        setProgress && setProgress(5);
        const pre = await preprocessForOCR(dataUrl, { mode, smartCrop, manualCrop, deskew });
        setStage && setStage("Initializing Tesseract...");
        setProgress && setProgress(10);
        const worker = await getOcrWorker((m) => {
            if (m?.status === "recognizing text" && typeof m.progress === "number") {
                setProgress && setProgress(10 + Math.round(m.progress * 80));
            }
        });
        setStage && setStage("Recognizing text (Tesseract)...");
        await worker.setParameters({
            tessedit_pageseg_mode: String(psm),
            preserve_interword_spaces: "1",
            user_defined_dpi: "300",
            tessedit_char_whitelist: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789%/<>.-+μ^()[]{}:;,# "
        });
        const result = await worker.recognize(pre.processed);
        setProgress && setProgress(95);
        setStage && setStage("Processing results...");
        const text = result?.data?.text || "";
        const confidence = Number(result?.data?.confidence || 0);
        const lines = Array.isArray(result?.data?.lines)
            ? result.data.lines.map(l => ({ text: String(l.text || "").trim(), confidence: Number(l.confidence || 0) })).filter(l => l.text)
            : [];
        setProgress && setProgress(100);
        debugLog && debugLog('success', `Tesseract completed. Text length: ${text.length}, Confidence: ${confidence}`);
        return { text, confidence, pass: `PSM ${psm}`, cropUsed: pre.cropUsed, skewAngle: pre.skewAngle, threshold: pre.threshold, lines, source: 'tesseract' };
    } catch (err) {
        debugLog && debugLog('error', `Tesseract error: ${err.message}`);
        console.error("Tesseract OCR Error:", err);
        throw err;
    }
};

// ============ HYBRID OCR ENGINE ============
const runHybridOCR = async (dataUrl, options = {}, setProgress, setStage, ocrEngine = 'hybrid', debugLog) => {
    debugLog && debugLog('info', `OCR Engine: ${ocrEngine}`);
    
    if (ocrEngine === 'tesseract') {
        return await runTesseractOCR(dataUrl, options, setProgress, setStage, debugLog);
    }
    
    if (ocrEngine === 'vision') {
        try {
            return await callVisionAPI(dataUrl, options, setProgress, setStage, debugLog);
        } catch (err) {
            throw new Error(`Vision API failed: ${err.message}`);
        }
    }
    
    // Hybrid mode: Try Vision first, fallback to Tesseract
    try {
        debugLog && debugLog('info', 'Hybrid mode: Trying Vision API first...');
        setStage && setStage("Trying Google Vision API (primary)...");
        const visionResult = await callVisionAPI(dataUrl, setProgress, setStage, debugLog);
        
        // If Vision API returns good results, use them
        if (visionResult.confidence >= 70 || visionResult.text.length > 50) {
            debugLog && debugLog('success', 'Vision API returned good results');
            return visionResult;
        }
        
        // If Vision results are poor, try Tesseract as backup
        debugLog && debugLog('info', 'Vision results unclear, falling back to Tesseract...');
        setStage && setStage("Vision results unclear, trying Tesseract...");
        const tesseractResult = await runTesseractOCR(dataUrl, options, setProgress, setStage, debugLog);
        
        // Return whichever has better confidence
        if (tesseractResult.confidence > visionResult.confidence) {
            debugLog && debugLog('info', 'Using Tesseract results (higher confidence)');
            return tesseractResult;
        }
        debugLog && debugLog('info', 'Using Vision results');
        return visionResult;
        
    } catch (visionErr) {
        debugLog && debugLog('error', `Vision API failed: ${visionErr.message}`);
        console.warn("Vision API failed, falling back to Tesseract:", visionErr);
        setStage && setStage("Vision API unavailable, using Tesseract...");
        return await runTesseractOCR(dataUrl, options, setProgress, setStage, debugLog);
    }
};

// ============ LAB VALUE PARSING ============
const redactPHI = (text) => {
    let t = String(text || "");
    t = t.replace(/\b\d{3}-\d{2}-\d{4}\b/g, "███-██-████");
    t = t.replace(/\b(MRN|MRN\.)\s*[:#]?\s*\d{5,}\b/gi, "MRN:█████");
    return t;
};

const NUMERIC_SUB_MAP = new Map([
    ["l", "1"], ["I", "1"], ["`", "1"], ["]", "1"], ["!", "1"], ["|", "1"],
    ["O", "0"], ["D", "0"], ["o", "0"], ["Q", "0"],
    ["S", "5"], ["s", "5"],
    ["Z", "2"], ["z", "2"],
    ["B", "8"], ["ß", "8"]
]);

const cleanNumericString = (raw) => {
    let s = String(raw || "").trim();
    s = s.replace(/[^0-9A-Za-z.<>\-+]/g, "");
    if (/[A-Za-z]/.test(s)) {
        s = s.split("").map(ch => NUMERIC_SUB_MAP.get(ch) ?? ch).join("");
    }
    const parts = s.split(".");
    if (parts.length > 2) s = parts[0] + "." + parts.slice(1).join("");
    s = s.replace(/(?!^[<>])[^0-9.<>-]/g, "");
    return s;
};

const levenshtein = (a, b) => {
    const matrix = Array.from({ length: b.length + 1 }, (_, i) => [i]);
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            matrix[i][j] = b[i - 1] === a[j - 1]
                ? matrix[i - 1][j - 1]
                : Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
        }
    }
    return matrix[b.length][a.length];
};

const normalizeTestName = (raw) => {
    const s = String(raw || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    for (const [test, def] of Object.entries(TEST_DEFINITIONS)) {
        if (s === test.toUpperCase().replace(/[^A-Z0-9]/g, '')) return test;
        for (const alias of (def.aliases || [])) {
            if (s === alias.toUpperCase().replace(/[^A-Z0-9]/g, '')) return test;
        }
    }
    if (s.length >= 2 && s.length <= 12) {
        let bestMatch = null, bestDist = Infinity;
        for (const [test, def] of Object.entries(TEST_DEFINITIONS)) {
            const testNorm = test.toUpperCase().replace(/[^A-Z0-9]/g, '');
            const dist = levenshtein(s, testNorm);
            if (dist < bestDist && dist <= Math.max(1, Math.floor(testNorm.length / 3))) {
                bestDist = dist; bestMatch = test;
            }
            for (const alias of (def.aliases || [])) {
                const aliasNorm = alias.toUpperCase().replace(/[^A-Z0-9]/g, '');
                const aDist = levenshtein(s, aliasNorm);
                if (aDist < bestDist && aDist <= Math.max(1, Math.floor(aliasNorm.length / 3))) {
                    bestDist = aDist; bestMatch = test;
                }
            }
        }
        if (bestMatch) return bestMatch;
    }
    return raw.trim();
};

const validateValue = (test, value) => {
    const def = TEST_DEFINITIONS[test];
    if (!def) return { status: 'unknown', message: 'Unknown test' };
    const numVal = parseFloat(value);
    if (isNaN(numVal)) return { status: 'invalid', message: 'Non-numeric' };
    if (numVal < def.critLow || numVal > def.critHigh) return { status: 'invalid', message: `Outside range` };
    if (numVal < def.refLow || numVal > def.refHigh) return { status: 'abnormal', message: numVal < def.refLow ? 'Low' : 'High' };
    return { status: 'normal', message: 'Normal' };
};

const determineFlag = (test, value, extractedFlag) => {
    const def = TEST_DEFINITIONS[test];
    if (!def) return extractedFlag || 'N';
    const numVal = parseFloat(value);
    if (isNaN(numVal)) return extractedFlag || 'N';
    if (numVal < def.refLow) return 'L';
    if (numVal > def.refHigh) return 'H';
    return 'N';
};

const parseLabsFromText = (text, mode = "CBC", meta = {}) => {
    const ocrLines = (meta?.lines?.length ? meta.lines : null);
    const lines = ocrLines
        ? ocrLines.map(x => ({ line: x.text, conf: x.confidence }))
        : String(text || "").split(/\r?\n/).map(l => ({ line: l.trim(), conf: null }));
    const values = [];
    const seen = new Set();
    const UNIT_ANCHORS = [
  "mmol/L", "mmol\\/L",
  "μmol/L", "µmol/L", "umol/L", "u?mol/L",
  "mg/L", "g/L", "U/L", "ng/L", "pg/mL",
  "sec", "%", "fL", "pg", "mmHg", "L/L",
  "10^9/L", "10^12/L",
  "10*9/L", "10*12/L",
  "10x9/L", "10x12/L",
  "10 9/L", "10 12/L"
];
    const unitRe = new RegExp(`\\b(${UNIT_ANCHORS.join("|").replace(/\//g, "\\/")})\\b`, "i");
    const valueRe = /[<>-]?\d{1,4}(?:\.\d{1,3})?/;
    
    for (const obj of lines) {
        const raw = obj.line;
        if (!raw) continue;
        if (/^(date|time|patient|name|id|mrn|dob|specimen|collected|received|printed|page|lab|hospital|report)/i.test(raw)) continue;
        let testRaw = "";
        let valRaw = "";
        let unitRaw = "";
        const unitMatch = raw.match(unitRe);
        if (unitMatch) {
            unitRaw = unitMatch[1];
            const beforeUnit = raw.slice(0, unitMatch.index).trim();
            const mVal = beforeUnit.match(new RegExp(`${valueRe.source}\\s*$`));
            if (mVal) valRaw = mVal[0];
            if (valRaw) testRaw = beforeUnit.slice(0, beforeUnit.length - valRaw.length).trim();
        } else {
            const m = raw.match(/^([A-Za-z][A-Za-z0-9%\/\-\(\)\+\s]{1,25}?)\s*[:\.]?\s*([<>-]?\S+)/);
            if (m) { testRaw = m[1]; valRaw = m[2]; }
        }
        if (!testRaw || !valRaw) continue;
        const test = normalizeTestName(testRaw);
        const cleaned = cleanNumericString(valRaw);
        const mNum = cleaned.match(new RegExp(`^${valueRe.source}$`)) ? cleaned : (cleaned.match(valueRe)?.[0] || "");
        if (!mNum) continue;
        if (/^\d{4}$/.test(mNum) || /^\d{2}:\d{2}/.test(mNum)) continue;
        const def = TEST_DEFINITIONS[test];
        const unit = unitRaw || def?.unit || "";
        let flag = "N";
        if (/\bH\b|\bHIGH\b|\*H\*/i.test(raw)) flag = "H";
        else if (/\bL\b|\bLOW\b|\*L\*/i.test(raw)) flag = "L";
        if (def) flag = determineFlag(test, mNum, flag);
        let refLow = "", refHigh = "";
        if (def) { refLow = String(def.refLow); refHigh = String(def.refHigh); }
        const validation = def ? validateValue(test, mNum) : { status: "unknown" };
        let conf = 65;
        if (def) conf += 20;
        if (flag !== "N") conf += 5;
        if (typeof obj.conf === "number") conf = (conf * 0.5 + obj.conf * 0.5);
        conf = Math.max(10, Math.min(100, conf));
        const lowConfidence = (typeof obj.conf === "number" && obj.conf < 75);
        const key = `${test}|${mNum}|${unit}`;
        if (seen.has(key)) continue;
        seen.add(key);
        values.push({ test, value: mNum, flag, unit, refLow, refHigh, validation, confidence: conf, lowConfidence, raw, lineConfidence: obj.conf });
    }
    const modeConfig = OCR_MODES[mode] || OCR_MODES.Other;
    const expectedOrder = modeConfig.expectedTests || [];
    values.sort((a, b) => {
        const aIdx = expectedOrder.indexOf(a.test), bIdx = expectedOrder.indexOf(b.test);
        if (aIdx === -1 && bIdx === -1) return 0;
        if (aIdx === -1) return 1;
        if (bIdx === -1) return -1;
        return aIdx - bIdx;
    });
    return values;
};

const compressImage = (file, maxWidth = 1400) => {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.85));
            };
            img.onerror = () => reject(new Error("Failed to load image"));
            img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error("Failed to read file"));
        reader.readAsDataURL(file);
    });
};

                },
                body: JSON.stringify({ action: 'test' }),
                redirect: 'follow'
            });
            addDebugLog('info', `Response status: ${response.status}`);
            const text = await response.text();
            addDebugLog('success', `Test response: ${text.substring(0, 300)}`);
        } catch (err) {
            addDebugLog('error', `Test failed: ${err.message}`);
        }
    };

    return (
        <div className="modalOverlay" onClick={onClose}>
            <div className="modal" onClick={e => e.stopPropagation()}>
                <div className="modal-head">
                    <span>🧪 Labs - {patient.name}</span>
                    <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'white', fontSize: '18px', cursor: 'pointer' }}>×</button>
                </div>
                <div className="modal-body">
                    <div className="tabs">
                        <button className={`tab ${tab === "Values" ? "active" : ""}`} onClick={() => setTab("Values")}>📋 Values</button>
                        <button className={`tab ${tab === "Images" ? "active" : ""}`} onClick={() => setTab("Images")}>🖼 Images</button>
                        <button className={`tab ${tab === "Debug" ? "active" : ""}`} onClick={() => setTab("Debug")}>🔧 Debug</button>
                    </div>

                    {/* OCR Engine Selection */}
                    <div className="ocr-engine-toggle">
                        <button 
                            className={`engine-btn vision ${ocrEngine === 'vision' ? 'active' : ''}`}
                            onClick={() => setOcrEngine('vision')}
                        >
                            🌐 Google Vision
                        </button>
                        <button 
                            className={`engine-btn hybrid ${ocrEngine === 'hybrid' ? 'active' : ''}`}
                            onClick={() => setOcrEngine('hybrid')}
                        >
                            ⚡ Hybrid (Best)
                        </button>
                        <button 
                            className={`engine-btn tesseract ${ocrEngine === 'tesseract' ? 'active' : ''}`}
                            onClick={() => setOcrEngine('tesseract')}
                        >
                            📱 Tesseract (Offline)
                        </button>
                    </div>

                    {tab === "Debug" && (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                                <button className="btn btn-blue" onClick={testVisionAPI}>🔗 Test Vision API</button>
                                <button className="btn btn-white" onClick={() => setDebugLogs([])}>🗑 Clear Logs</button>
                            </div>
                            <div style={{ fontSize: 12, color: '#64748b', fontWeight: 600 }}>
                                Proxy URL: <code style={{ background: '#f1f5f9', padding: '2px 6px', borderRadius: 4 }}>{VISION_API_PROXY_URL}</code>
                            </div>
                            <div className="debug-panel" style={{ minHeight: 200, maxHeight: 400, overflow: 'auto' }}>
                                {debugLogs.length === 0 ? (
                                    <pre style={{ color: '#64748b' }}>No logs yet. Try uploading an image or testing the API.</pre>
                                ) : (
                                    debugLogs.map((log, i) => (
                                        <pre key={i} className={log.type}>
                                            [{log.time}] [{log.type.toUpperCase()}] {log.msg}
                                        </pre>
                                    ))
                                )}
                            </div>
                        </div>
                    )}

                    {tab !== "Debug" && (
                        <>
                            <div className="ocr-settings-panel">
                                <div className="ocr-settings-title">⚙ OCR Settings</div>
                                <div className="ocr-settings-grid">
                                    <div className="ocr-setting">
                                        <div className="ocr-setting-label">Lab Type</div>
                                        <select className="inp" value={defaultOcrMode} onChange={(e) => setDefaultOcrMode(e.target.value)} style={{ background: "white" }}>
                                            {Object.entries(OCR_MODES).map(([k, v]) => <option key={k} value={k}>{v.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="ocr-setting">
                                        <div className="ocr-setting-label">Smart Crop</div>
                                        <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, fontWeight: 600 }}>
                                            <input type="checkbox" checked={defaultSmartCrop} onChange={e => setDefaultSmartCrop(e.target.checked)} />
                                            Auto-trim
                                        </label>
                                    </div>
                                    <div className="ocr-setting">
                                        <div className="ocr-setting-label">Deskew</div>
                                        <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, fontWeight: 600 }}>
                                            <input type="checkbox" checked={defaultDeskew} onChange={e => setDefaultDeskew(e.target.checked)} />
                                            Auto-rotate
                                        </label>
                                    </div>
                                    {ocrEngine !== 'vision' && (
                                        <div className="ocr-setting">
                                            <div className="ocr-setting-label">PSM (Tesseract)</div>
                                            <select className="inp" value={defaultPSM} onChange={(e) => setDefaultPSM(e.target.value)} style={{ background: "white" }}>
                                                <option value="6">6 — Table / Block</option>
                                                <option value="7">7 — Single Line (ROI)</option>
                                            </select>
                                        </div>
                                    )}

                            <div
                                className={`add-lab-area ${dragging ? 'dragging' : ''}`}

                                    <>

                                <button className="btn btn-blue" onClick={() => cameraRef.current?.click()}>📸 Camera</button>

                            </div>
                            <input ref={fileRef} type="file" accept="image/*" onChange={handleFileInput} style={{ display: 'none' }} />
                            <input ref={cameraRef} type="file" accept="image/*" capture="environment" onChange={handleFileInput} style={{ display: 'none' }} />

                            {ocrError && (
                                <div className="ocr-error">
                                    ⚠ {ocrError}

                    {tab === "Values" && (valuesFeed.length === 0 ? (
                        <div className="empty-labs">

                        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>

                                const { date, time } = formatDateTime(item.timestamp);
                                const hasVals = (item.values || []).length > 0;
                                const confClass = getConfidenceClass(item.avgValueConfidence || item.confidence);
                                const isVision = item.source === 'google_vision';
                                return (
                                    <div key={item.id} className="lab-values-card">
                                        <div className={`lab-values-head ${isVision ? 'vision' : ''}`}>
                                            <div>
                                                <div className="lab-values-title">{date} • {time}</div>
                                                <div className="lab-values-sub">
                                                    {item.note ? item.note + " • " : ""}
                                                    {OCR_MODES[item.ocrMode]?.name || item.ocrMode}
                                                    {typeof item.skewAngle === "number" && item.source === 'tesseract' ? ` • skew: ${item.skewAngle.toFixed(1)}°` : ""}
                                                    {item.threshold !== null && item.source === 'tesseract' ? ` • th: ${item.threshold}` : ""}
                                                </div>
                                            </div>
                                            <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                                                <span className={`pill ${isVision ? 'vision' : 'tesseract'}`}>
                                                    {isVision ? '🌐 Vision' : '📱 Tesseract'}
                                                </span>
                                                <span className={`pill ${confClass}-conf`}>{Math.round(item.avgValueConfidence || item.confidence)}%</span>
                                                <span className="pill">{hasVals ? `${item.values.length} values` : "—"}</span>
                                                <button className="lab-image-btn" onClick={() => setShowRawText(showRawText === item.id ? null : item.id)}>
                                                    {showRawText === item.id ? '🔼' : '🔽'} Raw
                                                </button>
                                                <button className="lab-image-btn" onClick={() => {
                                                    const img = labImages.find(x => x.id === item.id);
                                                    if (img) runOcrOnImage(img);
                                                }}>🔁</button>
                                            </div>
                                        </div>
                                        {showRawText === item.id && (
                                            <div className="raw-text-panel">
                                                <pre>{item.rawText || "(empty)"}</pre>
                                            </div>
                                        )}
                                        <div className="lab-values-body">
                                            {!hasVals ? (
                                                <div style={{ color: "#94a3b8", fontWeight: 600 }}>
                                                    No values detected. Try different Lab Type, Manual Crop, or re-scan.
                                                </div>
                                            ) : (
                                                <div className="kv-grid">
                                                    {item.values.map(v => {
                                                        const valClass = v.validation?.status === 'invalid' ? 'invalid' : '';
                                                        return (
                                                            <div key={v.test} className={`kv ${valClass}`}>
                                                                <div className="k">
                                                                    {v.test}
                                                                    <span className={`confidence-dot ${getConfidenceClass(v.confidence)}`} title={`${Math.round(v.confidence)}%`}></span>
                                                                    {v.lowConfidence && (
                                                                        <span style={{ color: "#b45309", fontWeight: 900, fontSize: 11 }}>
                                                                            ⚠ Low conf
                                                                        </span>
                                                                    )}
                                                                    {v.validation?.status === 'invalid' && <span style={{ color: '#ef4444', fontWeight: 800 }}>⚠</span>}
                                                                </div>
                                                                <div className="v">
                                                                    <input
                                                                        value={v.value || ""}
                                                                        onChange={e => updateOcrValue(item.id, v.test, 'value', e.target.value)}
                                                                    />
                                                                    <span className="u">{v.unit || ""}</span>
                                                                    <span className={`flag ${v.flag || "N"}`}>{v.flag || "N"}</span>
                                                                </div>
                                                                {(v.refLow || v.refHigh) && (
                                                                    <div style={{ marginTop: 6, fontSize: 11, color: "#64748b", fontWeight: 600 }}>
                                                                        Ref: {v.refLow} – {v.refHigh}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                        <div className="ocr-stats">
                                            <div className="ocr-stat">Source: <span className={isVision ? 'vision' : ''}>{item.source || item.pass || "—"}</span></div>
                                            <div className="ocr-stat">Confidence: <span>{Math.round(item.confidence)}%</span></div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    ))}

                    {tab === "Images" && (labImages.length === 0 ? (
                        <div className="empty-labs">
                            <div className="empty-labs-icon">🔬</div>
                            <div style={{ fontSize: 14 }}>No lab images yet.</div>
                        </div>
                    ) : (
                        <div className="lab-images-grid">
                            {labImages.map((lab, idx) => {
                                const { date, time } = formatDateTime(lab.timestamp);
                                const count = (lab.ocr?.values || []).length;
                                const isVision = lab.ocr?.source === 'google_vision';
                                return (
                                    <div key={lab.id} className="lab-image-card">
                                        <div className="lab-image-header" style={isVision ? { background: 'linear-gradient(135deg, #4285f4 0%, #34a853 100%)' } : {}}>
                                            <div>
                                                <div className="lab-image-date">{date}</div>
                                                <div className="lab-image-time">{time} {count ? `• ${count} values` : ""}</div>
                                            </div>
                                            <div className="lab-image-actions">
                                                <span className={`source-badge ${isVision ? 'vision' : 'tesseract'}`}>
                                                    {isVision ? '🌐' : '📱'} {lab.ocr?.source || 'pending'}
                                                </span>
                                                <select
                                                    className="inp"
                                                    style={{ width: 110, padding: "4px 8px", fontSize: 11, background: "white" }}
                                                    value={lab.ocrMode || "CBC"}
                                                    onChange={(e) => setLabImages(prev => prev.map(x => x.id === lab.id ? ({ ...x, ocrMode: e.target.value }) : x))}
                                                >
                                                    {Object.keys(OCR_MODES).map(k => <option key={k} value={k}>{k}</option>)}
                                                </select>
                                                <button className="lab-image-btn" onClick={() => setCropModal({ imgId: lab.id })}>✂</button>
                                                <button className="lab-image-btn" onClick={() => runOcrOnImage(lab)}>🔎</button>
                                                <button className="lab-image-btn delete" onClick={() => deleteImage(lab.id)}>🗑</button>
                                            </div>
                                        </div>
                                        <div className="lab-image-container" onClick={() => setViewerIndex(idx)}>
                                            <img src={lab.image} alt="Lab" />
                                        </div>
                                        <div className="lab-image-note">
                                            <input
                                                type="text"
                                                placeholder="Add note..."
                                                value={lab.note || ""}
                                                onChange={e => updateNote(lab.id, e.target.value)}
                                                onClick={e => e.stopPropagation()}
                                            />
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    ))}
                </div>
                <div className="modal-foot">
                    <button className="btn btn-white" onClick={onClose}>Cancel</button>
                    <button className="btn" style={{ background: 'var(--purple)', color: 'white' }} onClick={handleSave}>
                        Save ({labImages.length})
                    </button>
                </div>
            </div>
            {viewerIndex !== null && <ImageViewer images={labImages} currentIndex={viewerIndex} onClose={() => setViewerIndex(null)} />}
            {cropModal && (() => {
                const img = labImages.find(x => x.id === cropModal.imgId);
                if (!img) return null;
                const modeConfig = OCR_MODES[img.ocrMode || "CBC"] || OCR_MODES.CBC;
                return (
                    <CropModal
                        image={img.image}
                        initialCrop={img.manualCrop || modeConfig.crop}
                        onClose={() => setCropModal(null)}
                        onApply={(crop) => {
                            setLabImages(prev => prev.map(x => x.id === img.id ? ({ ...x, manualCrop: crop }) : x));
                            setCropModal(null);
                        }}
                    />
                );
            })()}
        </div>
    );
};

const NoticeBanner = ({ notice, onSave }) => {
    const [editing, setEditing] = useState(false);
    const [collapsed, setCollapsed] = useState(false);
    const [text, setText] = useState(notice?.text || "");
    useEffect(() => setText(notice?.text || ""), [notice?.text]);
    if (collapsed) return (
        <div className="notice-banner notice-collapsed" onClick={() => setCollapsed(false)}>
            <div className="notice-header">
                <span className="notice-title">📢 Notice</span>
                <span style={{ fontSize: '11px', color: '#a16207' }}>▼</span>
            </div>
        </div>
    );
    return (
        <div className="notice-banner">
            <div className="notice-header">
                <span className="notice-title">📢 Notice</span>
                <div className="notice-actions">
                    {editing ? (
                        <>
                            <button className="notice-btn" onClick={() => { setText(notice?.text || ""); setEditing(false); }}>Cancel</button>
                            <button className="notice-btn save" onClick={() => { onSave(text); setEditing(false); }}>Save</button>
                        </>
                    ) : (
                        <>
                            <button className="notice-btn" onClick={() => setCollapsed(true)}>▲</button>
                            <button className="notice-btn" onClick={() => setEditing(true)}>Edit</button>
                        </>
                    )}
                </div>
            </div>
            {editing ? (
                <textarea className="notice-textarea" value={text} onChange={e => setText(e.target.value)} autoFocus />
            ) : (
                <div className={`notice-content ${!notice?.text ? 'empty' : ''}`}>{notice?.text || "No notices"}</div>
            )}
        </div>
    );
};

const App = () => {
    const [patients, setPatients] = useState([]);
    const [notice, setNotice] = useState({ text: "", updatedAt: null });
    const [search, setSearch] = useState("");
    const [viewFilter, setViewFilter] = useState("All");
    const [addModal, setAddModal] = useState(false);
    const [labModal, setLabModal] = useState(null);
    const [newP, setNewP] = useState({ ward: "Ward 19", bed: "", name: "", diagnosis: "", doctor: "", plan: "", status: "New", mrn: "" });
    const [collapsedWards, setCollapsedWards] = useState({});
    const [syncing, setSyncing] = useState(false);
    const [toast, setToast] = useState(null);
    const syncTimer = useRef(null);

    const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

    const scheduleSync = useCallback(() => {
        setSyncing(true);
        if (syncTimer.current) clearTimeout(syncTimer.current);
        syncTimer.current = setTimeout(() => {
            pingSheets();
            setTimeout(() => setSyncing(false), 1000);
        }, 500);
    }, []);

    useEffect(() => {
        db.ref('notice').on('value', snap => setNotice(snap.val() || { text: "" }));
        db.ref('patients').on('value', snap => {
            const val = snap.val();
            setPatients(val ? Object.keys(val).map(k => ({ id: k, ...val[k], bed: cleanBed(val[k].bed) })) : []);
        });
        return () => { db.ref('notice').off(); db.ref('patients').off(); };
    }, []);

    const saveNotice = (text) => db.ref('notice').set({ text: text.trim(), updatedAt: Date.now() }).then(() => showToast("✓ Saved"));
    const saveLabImages = (patientId, labImages) => db.ref(`patients/${patientId}/labImages`).set(labImages).then(() => { showToast("✓ Labs saved"); scheduleSync(); });
    const isDup = (ward, name, excludeId) => patients.some(p => p.id !== excludeId && makeKey(p.ward, p.name) === makeKey(ward, name));

    const update = useCallback((id, field, value) => {
        const p = patients.find(x => x.id === id);
        if (field === 'name' && isDup(p?.ward, value, id)) { showToast("⚠ Duplicate"); return; }
        if (field === 'ward' && isDup(value, p?.name, id)) { showToast("⚠ Duplicate"); return; }
        db.ref(`patients/${id}`).update({ [field]: field === 'bed' ? cleanBed(value) : value, timestamp: Date.now() }).then(scheduleSync);
    }, [patients, scheduleSync]);

    const del = (id) => confirm("Delete?") && db.ref(`patients/${id}`).remove().then(() => { showToast("✓ Deleted"); pingSheets(); });

    const saveNew = () => {
        const c = {
            ward: newP.ward || "Unassigned",
            bed: cleanBed(newP.bed),
            name: newP.name.trim(),
            diagnosis: newP.diagnosis,
            doctor: newP.doctor,
            status: newP.status || "New",
            plan: newP.plan,
            mrn: newP.mrn,
            timestamp: Date.now(),
            labImages: []
        };
        if (!c.name) { alert("Enter name"); return; }
        if (isDup(c.ward, c.name)) { alert("Duplicate"); return; }
        db.ref("patients").push(c).then(() => {
            setAddModal(false);
            setNewP({ ward: "Ward 19", bed: "", name: "", diagnosis: "", doctor: "", plan: "", status: "New", mrn: "" });
            showToast("✓ Added");
            pingSheets();
        });
    };

    const groups = useMemo(() => {
        const g = {};
        (viewFilter === 'All' ? patients : patients.filter(p => p.status === viewFilter))
            .filter(p => `${p.name}${p.bed}${p.ward}${p.diagnosis}`.toLowerCase().includes(search.toLowerCase()))
            .forEach(p => { const w = p.ward || "Unassigned"; (g[w] = g[w] || []).push(p); });
        return { g, keys: Object.keys(g).sort((a, b) => WARD_ORDER.indexOf(a) - WARD_ORDER.indexOf(b)) };
    }, [patients, search, viewFilter]);

    const getLabCount = (p) => (p.labImages || []).length;

    return (
        <div className="wrap">
            <div className="topbar">
                <div className="title">
                    <div className="title-row">
                        <h1>Unit E</h1>
                        <span className={`sync-badge ${syncing ? 'syncing' : 'idle'}`}>{syncing ? '⏳' : '✓'} {patients.length}</span>
                    </div>
                </div>
                <div className="actions">
                    <button className="btn btn-white" onClick={() => setAddModal(true)}>+ Add</button>
                    <button className="btn btn-green" onClick={() => window.open(SHEET_URL, '_blank')}>📊</button>
                    <button className="btn btn-blue" onClick={() => { setSyncing(true); pingSheets(); showToast("🔄 Syncing..."); setTimeout(() => setSyncing(false), 2000); }}>🔄</button>
                </div>
            </div>

            <NoticeBanner notice={notice} onSave={saveNotice} />

            <div className="controls-container">
                <div className="filter-row">
                    {['All', 'New', 'Chronic', 'Non-Chronic'].map(f => (
                        <button key={f} className={`filter-btn ${viewFilter === f ? 'active' : ''}`} onClick={() => setViewFilter(f)}>{f}</button>
                    ))}
                </div>
                <input className="search-bar" placeholder="Search patients..." value={search} onChange={e => setSearch(e.target.value)} />
            </div>

            {groups.keys.map(ward => (
                <div key={ward} className="ward-section">
                    <div className="ward-header" onClick={() => setCollapsedWards(p => ({ ...p, [ward]: !p[ward] }))}>
                        <div><span className={`arrow ${collapsedWards[ward] ? 'collapsed' : ''}`}>▼</span> {ward}</div>
                        <span className="ward-count">{groups.g[ward].length}</span>
                    </div>
                    <div className={`ward-body ${collapsedWards[ward] ? 'is-hidden' : ''}`}>
                        {groups.g[ward].map(p => (
                            <div className="p-card" key={p.id}>
                                <div className="mobile-row col-1">
                                    <input className="inp inp-bed" value={p.bed || ''} placeholder="Bed" onChange={e => update(p.id, 'bed', e.target.value)} />
                                    <input className="inp inp-doc" value={p.doctor || ''} placeholder="Dr." onChange={e => update(p.id, 'doctor', e.target.value)} />
                                </div>
                                <div className="col-2">
                                    <div style={{ display: 'flex', gap: 8 }}>
                                        <input className="inp inp-name" value={p.name || ''} placeholder="Name" onChange={e => update(p.id, 'name', e.target.value)} />
                                        <input className="inp" style={{ width: '90px' }} value={p.mrn || ''} placeholder="MRN" onChange={e => update(p.id, 'mrn', e.target.value)} />
                                    </div>
                                    <input className="inp" value={p.diagnosis || ''} placeholder="Diagnosis" onChange={e => update(p.id, 'diagnosis', e.target.value)} />
                                </div>
                                <div className="col-3">
                                    <textarea className="inp inp-area" value={p.plan || ''} placeholder="Plan..." onChange={e => update(p.id, 'plan', e.target.value)} />
                                </div>
                                <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                                    <button className={`btn-lab ${getLabCount(p) > 0 ? 'has-labs' : ''}`} onClick={() => setLabModal(p)}>
                                        🧪 Labs {getLabCount(p) > 0 && <span className="lab-count">{getLabCount(p)}</span>}
                                    </button>
                                    <select
                                        className={`status-select status-${(p.status || "").toLowerCase().split('-')[0]}`}
                                        value={p.status || ""}
                                        onChange={e => update(p.id, 'status', e.target.value)}
                                    >
                                        <option value="">-</option>
                                        {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                                    </select>
                                    <button className="btn-del" onClick={() => del(p.id)}>×</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            ))}

            {addModal && (
                <div className="modalOverlay">
                    <div className="modal" style={{ maxWidth: '450px' }}>
                        <div className="modal-head" style={{ background: 'var(--green)' }}>Add Patient</div>
                        <div className="modal-body">
                            <div>
                                <label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>Ward</label>
                                <select className="inp" value={newP.ward} onChange={e => setNewP({ ...newP, ward: e.target.value })}>
                                    {WARD_ORDER.map(w => <option key={w}>{w}</option>)}
                                </select>
                            </div>
                            <div style={{ display: 'flex', gap: 10 }}>
                                <div style={{ flex: 1 }}>
                                    <label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>Bed</label>
                                    <input className="inp" value={newP.bed} onChange={e => setNewP({ ...newP, bed: e.target.value })} />
                                </div>
                                <div style={{ flex: 1 }}>
                                    <label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>Doctor</label>
                                    <input className="inp" value={newP.doctor} onChange={e => setNewP({ ...newP, doctor: e.target.value })} />
                                </div>
                            </div>
                            <div>
                                <label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>Name</label>
                                <input className="inp" value={newP.name} onChange={e => setNewP({ ...newP, name: e.target.value })} />
                            </div>
                            <div style={{ display: 'flex', gap: 10 }}>
                                <div style={{ flex: 1 }}>
                                    <label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>MRN</label>
                                    <input className="inp" value={newP.mrn} onChange={e => setNewP({ ...newP, mrn: e.target.value })} />
                                </div>
                                <div style={{ flex: 1 }}>
                                    <label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>Status</label>
                                    <select className="inp" value={newP.status} onChange={e => setNewP({ ...newP, status: e.target.value })}>
                                        {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>Diagnosis</label>
                                <input className="inp" value={newP.diagnosis} onChange={e => setNewP({ ...newP, diagnosis: e.target.value })} />
                            </div>
                            <div>
                                <label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>Plan</label>
                                <textarea className="inp inp-area" value={newP.plan} onChange={e => setNewP({ ...newP, plan: e.target.value })} />
                            </div>
                        </div>
                        <div className="modal-foot">
                            <button className="btn btn-white" onClick={() => setAddModal(false)}>Cancel</button>
                            <button className="btn btn-blue" onClick={saveNew}>Save</button>
                        </div>
                    </div>
                </div>
            )}

            {labModal && <LabModal patient={labModal} onClose={() => setLabModal(null)} onSave={saveLabImages} />}
            {toast && <div className="toast">{toast}</div>}
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

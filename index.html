  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const firebaseConfig = {

      messagingSenderId: "465930916258",
      appId: "1:465930916258:web:0ec4d478bb3d6d7bd262fb"
    };

    if (window.firebase && !firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const SHEETS_SYNC_URL = "https://script.google.com/macros/s/AKfycbzeCRMInJT0ipKr3xgVvDpr6O3Y21dX7qqxoXipDdYz-JvrLZoC71xLicQO2lKxz6Rwzg/exec";
    const SPREADSHEET_ID = "1I2Cmm2YPUuJw4o4cOgl-iFmqTmfy6S9btFZ-5AIMxh4";
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/edit`;

    const pingSheets = () => {
      const url = `${SHEETS_SYNC_URL}?t=${Date.now()}`;
      if (navigator.sendBeacon) navigator.sendBeacon(url, new Blob([], { type: "text/plain" }));
      else fetch(url, { method: "GET", mode: "no-cors", cache: "no-store" }).catch(() => {});
    };

    const WARD_ORDER = ["Ward 19", "Ward 20", "Ward 21", "Ward 22", "Ward 27", "Ward 5", "Ward 10", "ICU", "ER", "Unassigned"];
    const STATUS_OPTIONS = ["New", "Chronic", "Non-Chronic"];

    const isTimestamp = (val) => String(val || "").match(/^\d{4}-\d{2}-\d{2}|^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s|\d{13,}|T\d{2}:\d{2}/);
    const cleanBed = (val) => isTimestamp(val) ? "" : String(val || "").trim();
    const makeKey = (ward, name) => `${(ward || "").toLowerCase().trim()}|${(name || "").toLowerCase().trim()}`;

    const formatDateTime = (ts) => {
      if (!ts) return { date: "", time: "" };
      const d = new Date(ts);
      return {
        date: d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
        time: d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
      };
    };

    // ---------- OCR (GitHub Pages FIX) ----------
    let _ocrWorkerPromise = null;

    const getOcrWorker = async (loggerFn) => {
      if (_ocrWorkerPromise) return _ocrWorkerPromise;

      const TESS_BASE = "https://unpkg.com/tesseract.js@5.0.5/dist";
      const LANG_BASE = "https://tessdata.projectnaptha.com/4.0.0";

      _ocrWorkerPromise = (async () => {
        const worker = await Tesseract.createWorker({
          logger: (m) => loggerFn && loggerFn(m),
          workerPath: `${TESS_BASE}/worker.min.js`,
          corePath: `${TESS_BASE}/tesseract-core.wasm.js`,
          langPath: LANG_BASE
        });

        await worker.loadLanguage("eng");
        await worker.initialize("eng");
        await worker.setParameters({
          preserve_interword_spaces: "1",
          user_defined_dpi: "300",
          tessedit_char_whitelist: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz.%/()-+<>:=,"
        });
        return worker;
      })();

      return _ocrWorkerPromise;
    };

    // ---------- OCR MODES + CROPPING ----------
    const OCR_MODES = ["CBC", "Chemistry", "ABG", "Other"];
    const clamp01 = (x) => Math.max(0, Math.min(1, x));

    const presetCrop = (mode) => {
      switch (mode) {
        case "CBC":       return { top: 0.10, bottom: 0.07, left: 0.05, right: 0.05 };
        case "Chemistry": return { top: 0.12, bottom: 0.08, left: 0.05, right: 0.05 };
        case "ABG":       return { top: 0.18, bottom: 0.14, left: 0.10, right: 0.10 };
        default:          return { top: 0.06, bottom: 0.06, left: 0.05, right: 0.05 };
      }
    };

    const applyCropToCanvas = (img, crop) => {
      const c = {
        top: clamp01(crop?.top ?? 0),
        bottom: clamp01(crop?.bottom ?? 0),
        left: clamp01(crop?.left ?? 0),
        right: clamp01(crop?.right ?? 0),
      };
      const sx = Math.floor(img.width * c.left);
      const sy = Math.floor(img.height * c.top);
      const sw = Math.floor(img.width * (1 - c.left - c.right));
      const sh = Math.floor(img.height * (1 - c.top - c.bottom));

      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, sw);
      canvas.height = Math.max(1, sh);
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      return canvas;
    };

    const otsuThreshold = (gray) => {
      const hist = new Array(256).fill(0);
      for (let i = 0; i < gray.length; i++) hist[gray[i]]++;
      const total = gray.length;

      let sum = 0;
      for (let t = 0; t < 256; t++) sum += t * hist[t];

      let sumB = 0, wB = 0, wF = 0;
      let varMax = 0, threshold = 128;

      for (let t = 0; t < 256; t++) {
        wB += hist[t];
        if (wB === 0) continue;
        wF = total - wB;
        if (wF === 0) break;

        sumB += t * hist[t];
        const mB = sumB / wB;
        const mF = (sum - sumB) / wF;
        const varBetween = wB * wF * (mB - mF) * (mB - mF);
        if (varBetween > varMax) {
          varMax = varBetween;
          threshold = t;
        }
      }
      return threshold;
    };

    const preprocessForOCR = async (dataUrl, { mode = "CBC", smartCrop = true, manualCrop = null } = {}) => {
      const img = new Image();
      img.src = dataUrl;
      await new Promise(res => img.onload = res);

      const crop = manualCrop ? manualCrop : (smartCrop ? presetCrop(mode) : { top:0, bottom:0, left:0, right:0 });
      const croppedCanvas = applyCropToCanvas(img, crop);

      // MOBILE SAFE SCALE (prevents freeze)
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const big = (croppedCanvas.width * croppedCanvas.height) > 2_000_000;
      const scale = (isMobile || big) ? 1.6 : 2.2;

      const up = document.createElement("canvas");
      up.width = Math.floor(croppedCanvas.width * scale);
      up.height = Math.floor(croppedCanvas.height * scale);
      const upCtx = up.getContext("2d", { willReadFrequently: true });
      upCtx.imageSmoothingEnabled = true;
      upCtx.imageSmoothingQuality = "high";
      upCtx.drawImage(croppedCanvas, 0, 0, up.width, up.height);

      const imageData = upCtx.getImageData(0, 0, up.width, up.height);
      const d = imageData.data;
      const gray = new Uint8ClampedArray(up.width * up.height);

      for (let i = 0, j = 0; i < d.length; i += 4, j++) {
        let g = (0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2]) | 0;
        g = Math.min(255, Math.max(0, (g - 128) * 1.30 + 128));
        gray[j] = g;
      }

      const grayCanvas = document.createElement("canvas");
      grayCanvas.width = up.width;
      grayCanvas.height = up.height;
      const gctx = grayCanvas.getContext("2d", { willReadFrequently: true });
      const gimg = gctx.createImageData(up.width, up.height);
      for (let i = 0, j = 0; i < gimg.data.length; i += 4, j++) {
        const v = gray[j];
        gimg.data[i] = gimg.data[i+1] = gimg.data[i+2] = v;
        gimg.data[i+3] = 255;
      }
      gctx.putImageData(gimg, 0, 0);

      const th = otsuThreshold(gray);
      const binCanvas = document.createElement("canvas");
      binCanvas.width = up.width;
      binCanvas.height = up.height;
      const bctx = binCanvas.getContext("2d", { willReadFrequently: true });
      const bimg = bctx.createImageData(up.width, up.height);
      for (let i = 0, j = 0; i < bimg.data.length; i += 4, j++) {
        const v = gray[j] > th ? 255 : 0;
        bimg.data[i] = bimg.data[i+1] = bimg.data[i+2] = v;
        bimg.data[i+3] = 255;
      }
      bctx.putImageData(bimg, 0, 0);

      return {
        gray: grayCanvas.toDataURL("image/png"),
        bin: binCanvas.toDataURL("image/png"),
        cropUsed: crop
      };
    };

    const runOCR = async (dataUrl, { mode = "CBC", smartCrop = true, manualCrop = null } = {}, setProgress) => {
      const worker = await getOcrWorker((m) => {
        if (m?.status === "recognizing text" && typeof m.progress === "number") {
          setProgress && setProgress(Math.round(m.progress * 100));
        }
      });

      const psmList = (mode === "ABG") ? ["6","11"] : ["6","4"];
      const pre = await preprocessForOCR(dataUrl, { mode, smartCrop, manualCrop });

      const candidates = [
        { name: "BIN", img: pre.bin, bonus: 6 },
        { name: "GRAY", img: pre.gray, bonus: 4 },
      ];

      let best = { text: "", confidence: 0, pass: "N/A", cropUsed: pre.cropUsed };

      for (const cand of candidates) {
        for (const psm of psmList) {
          await worker.setParameters({ tessedit_pageseg_mode: psm });
          const res = await worker.recognize(cand.img);
          const text = (res?.data?.text || "").trim();
          const conf = Number(res?.data?.confidence || 0);

          const bonus =
            /WBC|RBC|Hb|HGB|Hct|MCV|MCHC|RDW|PLT|Plate|MPV|Na|K|Cl|Urea|Creat|CRP|pH|pCO2|pO2|HCO3|Lactate/i.test(text)
              ? cand.bonus
              : 0;

          const score = conf + bonus;
          if (score > (best.confidence + 0.1)) {
            best = { text, confidence: conf, pass: `${cand.name}-PSM${psm}`, cropUsed: pre.cropUsed };
          }
        }
      }

      return best;
    };

    // ---------- PARSER ----------
    const TEST_UNITS = {
      WBC: "10^9/L", RBC: "10^12/L", Hb: "g/L", Hct: "L/L",
      MCV: "fL", MCH: "pg", MCHC: "g/L", RDW: "%", Plt: "10^9/L", MPV: "fL",
      Na: "mmol/L", K: "mmol/L", Cl: "mmol/L", Urea: "mmol/L", Cr: "µmol/L", Glucose: "mmol/L", CRP: "mg/L",
      pH: "", pCO2: "mmHg", pO2: "mmHg", HCO3: "mmol/L", Lactate: "mmol/L"
    };

    const normalizeTest = (raw) => {
      const s = String(raw || "").trim();
      const map = {
        "HGB": "Hb", "HEMOGLOBIN": "Hb",
        "HCT": "Hct", "PLT": "Plt", "PLATELETS": "Plt",
        "CREAT": "Cr", "CREATININE": "Cr",
        "SODIUM": "Na", "POTASSIUM": "K", "CHLORIDE": "Cl"
      };
      const up = s.toUpperCase().replace(/[^A-Z0-9]/g,'');
      if (map[up]) return map[up];

      const common = ["WBC","RBC","Hb","Hct","MCV","MCH","MCHC","RDW","Plt","MPV","Na","K","Cl","Urea","Cr","Glucose","CRP","pH","pCO2","pO2","HCO3","Lactate"];
      for (const c of common) {
        if (up === c.toUpperCase().replace(/[^A-Z0-9]/g,'')) return c;
      }
      return s;
    };

    const parseLabsFromText = (text) => {
      const lines = String(text || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);

      const values = [];
      const seen = new Set();
      const numeric = /([<>]?\d+(?:\.\d+)?)/;
      const range = /(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)/;

      for (const line of lines) {
        const mTest = line.match(/^([A-Za-z][A-Za-z0-9%\/\-\(\)\+]{1,12})\b/);
        if (!mTest) continue;
        const test = normalizeTest(mTest[1]);

        const mVal = line.match(numeric);
        if (!mVal) continue;
        const val = mVal[1];
        if (val.length > 7 && !val.includes(".")) continue;

        let flag = "N";
        if (/\bH\b/.test(line)) flag = "H";
        if (/\bL\b/.test(line)) flag = "L";

        let refLow = "", refHigh = "";
        const mRange = line.match(range);
        if (mRange) { refLow = mRange[1]; refHigh = mRange[2]; }

        const unit = TEST_UNITS[test] || "";

        const key = `${test}|${val}|${refLow}|${refHigh}|${unit}`;
        if (seen.has(key)) continue;
        seen.add(key);

        values.push({ test, value: val, flag, unit, refLow, refHigh, raw: line });
      }

      const order = ["WBC","RBC","Hb","Hct","MCV","MCH","MCHC","RDW","Plt","MPV","Na","K","Cl","Urea","Cr","Glucose","CRP","pH","pCO2","pO2","HCO3","Lactate"];
      values.sort((a,b) => (order.indexOf(a.test) - order.indexOf(b.test)));
      return values;
    };

    // ---------- IMAGES ----------
    const compressImage = (file, maxWidth = 1200) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = (height * maxWidth) / width;
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.75));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

    // ---------- Crop Modal ----------
    const CropModal = ({ image, initialCrop, onClose, onApply }) => {

      const boxStyle = {

        border: "2px solid #f59e0b",

                      type="range"

                      style={{ width:"100%" }}
                    />
                    <div style={{ fontSize:12, fontWeight:800, color:"#64748b" }}>{Math.round(crop[k]*100)}%</div>
                  </div>

    };

    // ---------- Image Viewer ----------
    const ImageViewer = ({ images, currentIndex, onClose }) => {
      const current = images[currentIndex];
      if (!current) return null;
      const { date, time } = formatDateTime(current.timestamp);

      return (
        <div className="image-viewer" onClick={onClose}>

            <button className="image-viewer-close" onClick={onClose}>×</button>

          <div className="image-viewer-body" onClick={e => e.stopPropagation()}>
            <img src={current.image} alt="Lab" />

    // ---------- Labs Modal ----------
    const LabModal = ({ patient, onClose, onSave }) => {
      const [labImages, setLabImages] = useState(patient.labImages || []);
      const [dragging, setDragging] = useState(false);
      const [viewerIndex, setViewerIndex] = useState(null);
      const [uploading, setUploading] = useState(false);
      const [tab, setTab] = useState("Values");

      const [ocrBusyId, setOcrBusyId] = useState(null);
      const [ocrProgress, setOcrProgress] = useState(0);

      const [defaultSmartCrop, setDefaultSmartCrop] = useState(true);
      const [cropModal, setCropModal] = useState(null); // { imgId }

      const fileRef = useRef(null);
      const cameraRef = useRef(null);

      const runOcrOnImage = async (imgObj) => {
        setOcrBusyId(imgObj.id);
        setOcrProgress(0);
        try {
          const best = await runOCR(
            imgObj.image,
            { mode: imgObj.ocrMode || "CBC", smartCrop: !!imgObj.smartCrop, manualCrop: imgObj.manualCrop || null },
            setOcrProgress
          );
          const values = parseLabsFromText(best.text);

          setLabImages(prev => prev.map(x => x.id === imgObj.id ? {
            ...x,
            ocr: {
              text: best.text,
              values,
              confidence: best.confidence,
              pass: best.pass,
              cropUsed: best.cropUsed || null,
              updatedAt: Date.now()
            }
          } : x));
        } catch (e) {
          console.error("OCR ERROR:", e);
          alert("OCR failed: " + (e?.message || e));
        }
        setOcrBusyId(null);
        setOcrProgress(0);
      };

      const handleFile = async (file) => {
        if (!file || !file.type.startsWith('image/')) return;

        setUploading(true);
        try {
          const compressed = await compressImage(file);
          const newImage = {
            id: Date.now().toString(),
            image: compressed,
            timestamp: Date.now(),
            note: "",
            ocrMode: defaultOcrMode,
            smartCrop: defaultSmartCrop,
            manualCrop: null,
            ocr: { text: "", values: [], confidence: 0, pass: "", updatedAt: null, cropUsed: null }

          setLabImages(prev => [newImage, ...prev]);

        setUploading(false);

      const handleDrop = (e) => {

      return (
        <div className="modalOverlay" onClick={onClose}>

            </div>

            <div className="modal-body">
              <div className="tabs">
                <button className={`tab ${tab === "Values" ? "active" : ""}`} onClick={() => setTab("Values")}>📋 Values</button>
                <button className={`tab ${tab === "Images" ? "active" : ""}`} onClick={() => setTab("Images")}>🖼️ Images</button>
              </div>

              {/* OCR defaults */}
              <div style={{ display:"flex", gap:10, flexWrap:"wrap", alignItems:"center", justifyContent:"space-between",
                            border:"1px solid #e9d5ff", background:"#faf5ff", borderRadius:12, padding:"10px 12px" }}>
                <div style={{ display:"flex", gap:10, alignItems:"center", flexWrap:"wrap" }}>
                  <div style={{ fontWeight:900, color:"#6b21a8" }}>OCR Default:</div>
                  <select className="inp" style={{ width: 150, background:"white" }} value={defaultOcrMode} onChange={(e)=>setDefaultOcrMode(e.target.value)}>
                    {OCR_MODES.map(m => <option key={m} value={m}>{m}</option>)}
                  </select>
                  <label style={{ display:"flex", alignItems:"center", gap:6, fontWeight:800, color:"#6b21a8" }}>
                    <input type="checkbox" checked={defaultSmartCrop} onChange={e=>setDefaultSmartCrop(e.target.checked)} />
                    Smart crop
                  </label>
                </div>
                <div style={{ fontSize:12, fontWeight:800, color:"#7c3aed" }}>Best: straight photo + zoom + no glare</div>
              </div>

              {/* Add image */}
              <div
                className={`add-lab-area ${dragging ? 'dragging' : ''}`}
                onClick={() => fileRef.current?.click()}
                onDragOver={e => { e.preventDefault(); setDragging(true); }}
                onDragLeave={() => setDragging(false)}
                onDrop={handleDrop}
              >
                {uploading ? (
                  <>
                    <div className="add-lab-icon">⏳</div>
                    <div className="add-lab-text">Processing...</div>
                  </>
                ) : (
                  <>
                    <div className="add-lab-icon">📷</div>
                    <div className="add-lab-text">Add Lab Image (Auto OCR)</div>
                    <div className="add-lab-hint">Tap to upload / take photo</div>
                  </>
                )}
              </div>

              <div style={{ display: 'flex', gap: 8, justifyContent: 'center' }}>
                <button className="btn btn-blue" onClick={() => cameraRef.current?.click()}>📸 Camera</button>
                <button className="btn btn-white" onClick={() => fileRef.current?.click()}>📁 Gallery</button>
              </div>

              <input ref={fileRef} type="file" accept="image/*" onChange={handleFileInput} style={{ display: 'none' }} />
              <input ref={cameraRef} type="file" accept="image/*" capture="environment" onChange={handleFileInput} style={{ display: 'none' }} />

              {ocrBusyId && (
                <div style={{ padding: "10px 12px", border: "1px solid #e9d5ff", borderRadius: 12, background:"#faf5ff", color:"#6b21a8", fontWeight: 800 }}>
                  🔎 OCR running… {ocrProgress}%
                </div>
              )}

              {/* VALUES */}
              {tab === "Values" && (
                <>
                  {valuesFeed.length === 0 ? (
                    <div className="empty-labs">
                      <div className="empty-labs-icon">🔬</div>
                      <div className="empty-labs-text">No labs yet.<br/>Add a photo to extract values.</div>
                    </div>
                  ) : (
                    <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                      {valuesFeed.map(item => {
                        const { date, time } = formatDateTime(item.timestamp);
                        const hasVals = (item.values || []).length > 0;
                        return (
                          <div key={item.id} className="lab-values-card">
                            <div className="lab-values-head">
                              <div>
                                <div className="lab-values-title">{date} • {time}</div>
                                <div className="lab-values-sub">
                                  {item.note ? item.note + " • " : ""}
                                  OCR: {Math.round(item.confidence || 0)}% ({item.pass || "—"})
                                </div>
                              </div>
                              <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                                <span className="pill">{hasVals ? `${item.values.length} values` : "No values"}</span>
                                <button
                                  className="lab-image-btn"
                                  onClick={() => {
                                    const img = labImages.find(x => x.id === item.id);
                                    if (img) runOcrOnImage(img);
                                  }}
                                >
                                  🔁 Re-run OCR
                                </button>
                              </div>
                            </div>

                            <div className="lab-values-body">
                              {!hasVals ? (
                                <div style={{ color:"#94a3b8", fontWeight:700 }}>
                                  No values detected. Try re-run OCR or use Manual Crop.
                                </div>
                              ) : (
                                <div className="kv-grid">
                                  {item.values.map(v => (
                                    <div key={v.test} className="kv">
                                      <div className="k">{v.test}</div>
                                      <div className="v">
                                        <input value={v.value || ""} onChange={e => updateOcrValue(item.id, v.test, e.target.value)} />
                                        <span className="u">{v.unit || ""}</span>
                                        <span className={`flag ${v.flag || "N"}`}>{v.flag || "N"}</span>
                                      </div>
                                      {(v.refLow || v.refHigh) && (
                                        <div style={{ marginTop:6, fontSize:12, color:"#64748b", fontWeight:700 }}>
                                          Ref: {v.refLow || "—"} – {v.refHigh || "—"}
                                        </div>
                                      )}
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </>
              )}

              {/* IMAGES */}
              {tab === "Images" && (
                <>
                  {labImages.length === 0 ? (
                    <div className="empty-labs">
                      <div className="empty-labs-icon">🔬</div>
                      <div className="empty-labs-text">No lab images yet.</div>
                    </div>

                    <div className="lab-images-grid">

                              <div>
                                <div className="lab-image-date">{date}</div>
                                <div className="lab-image-time">
                                  {time}{count ? ` • ${count} values` : ""}{lab.ocr?.confidence ? ` • OCR ${Math.round(lab.ocr.confidence)}%` : ""}

                              <div className="lab-image-actions">
                                <select
                                  className="inp"
                                  style={{ width: 130, padding: "4px 8px", fontSize: 12, background: "white" }}
                                  value={lab.ocrMode || "CBC"}
                                  onChange={(e)=>setLabImages(prev => prev.map(x => x.id === lab.id ? ({ ...x, ocrMode: e.target.value }) : x))}
                                >
                                  {OCR_MODES.map(m => <option key={m} value={m}>{m}</option>)}

                                <label style={{ display:"flex", alignItems:"center", gap:6, fontWeight:900, fontSize:12 }}>

                                  />

                                <button className="lab-image-btn" onClick={() => setCropModal({ imgId: lab.id })}>

            <div className="modal-foot">

    // ---------- Notice Banner ----------

    // ---------- Main App ----------
    const App = () => {
      const [patients, setPatients] = useState([]);
      const [notice, setNotice] = useState({ text: "", updatedAt: null });
      const [search, setSearch] = useState("");
      const [viewFilter, setViewFilter] = useState("All");
      const [addModal, setAddModal] = useState(false);

      const [newP, setNewP] = useState({ ward: "Ward 19", bed: "", name: "", diagnosis: "", doctor: "", plan: "", status: "New", mrn: "" });
      const [collapsedWards, setCollapsedWards] = useState({});
      const [syncing, setSyncing] = useState(false);
      const [toast, setToast] = useState(null);
      const syncTimer = useRef(null);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

      const scheduleSync = useCallback(() => {
        setSyncing(true);
        if (syncTimer.current) clearTimeout(syncTimer.current);
        syncTimer.current = setTimeout(() => { pingSheets(); setTimeout(() => setSyncing(false), 1000); }, 500);
      }, []);

      useEffect(() => {
        db.ref('notice').on('value', snap => setNotice(snap.val() || { text: "" }));
        db.ref('patients').on('value', snap => {
          const val = snap.val();
          setPatients(val ? Object.keys(val).map(k => ({ id: k, ...val[k], bed: cleanBed(val[k].bed) })) : []);
        });
        return () => { db.ref('notice').off(); db.ref('patients').off(); };
      }, []);

      const saveNotice = (text) => db.ref('notice').set({ text: text.trim(), updatedAt: Date.now() }).then(() => showToast("✓ Saved"));

      const saveLabImages = (patientId, labImages) => {
        db.ref(`patients/${patientId}/labImages`).set(labImages).then(() => {
          showToast("✓ Labs saved");
          scheduleSync();
        });
      };

      const isDup = (ward, name, excludeId) => patients.some(p => p.id !== excludeId && makeKey(p.ward, p.name) === makeKey(ward, name));

      const update = useCallback((id, field, value) => {
        const p = patients.find(x => x.id === id);
        if (field === 'name' && isDup(p?.ward, value, id)) { showToast("⚠️ Duplicate"); return; }
        if (field === 'ward' && isDup(value, p?.name, id)) { showToast("⚠️ Duplicate"); return; }
        db.ref(`patients/${id}`).update({ [field]: field === 'bed' ? cleanBed(value) : value, timestamp: Date.now() }).then(scheduleSync);
      }, [patients, scheduleSync]);

      const del = (id) => confirm("Delete?") && db.ref(`patients/${id}`).remove().then(() => { showToast("✓ Deleted"); pingSheets(); });

      const saveNew = () => {
        const c = { ward: newP.ward || "Unassigned", bed: cleanBed(newP.bed), name: newP.name.trim(), diagnosis: newP.diagnosis, doctor: newP.doctor, status: newP.status || "New", plan: newP.plan, mrn: newP.mrn, timestamp: Date.now(), labImages: [] };
        if (!c.name) { alert("Enter name"); return; }
        if (isDup(c.ward, c.name)) { alert("Duplicate"); return; }
        db.ref("patients").push(c).then(() => {
          setAddModal(false);
          setNewP({ ward: "Ward 19", bed: "", name: "", diagnosis: "", doctor: "", plan: "", status: "New", mrn: "" });
          showToast("✓ Added");
          pingSheets();
        });
      };

      const groups = useMemo(() => {
        const g = {};
        (viewFilter === 'All' ? patients : patients.filter(p => p.status === viewFilter))
          .filter(p => `${p.name}${p.bed}${p.ward}${p.diagnosis}`.toLowerCase().includes(search.toLowerCase()))
          .forEach(p => { const w = p.ward || "Unassigned"; (g[w] = g[w] || []).push(p); });
        return { g, keys: Object.keys(g).sort((a, b) => WARD_ORDER.indexOf(a) - WARD_ORDER.indexOf(b)) };
      }, [patients, search, viewFilter]);

      const getLabCount = (p) => (p.labImages || []).length;

      return (
        <div className="wrap">
          <div className="topbar">
            <div className="title">
              <div className="title-row">
                <h1>Unit E</h1>
                <span className={`sync-badge ${syncing ? 'syncing' : 'idle'}`}>{syncing ? '⏳' : '✓'} {patients.length}</span>
              </div>
            </div>
            <div className="actions">
              <button className="btn btn-white" onClick={() => setAddModal(true)}>+ Add</button>
              <button className="btn btn-green" onClick={() => window.open(SHEET_URL, '_blank')}>📊</button>
              <button className="btn btn-blue" onClick={() => { setSyncing(true); pingSheets(); showToast("🔄 Syncing..."); setTimeout(() => setSyncing(false), 2000); }}>🔄</button>
            </div>
          </div>

          <NoticeBanner notice={notice} onSave={saveNotice} />

          <div className="controls-container">
            <div className="filter-row">
              {['All', 'New', 'Chronic', 'Non-Chronic'].map(f => (
                <button key={f} className={`filter-btn ${viewFilter === f ? 'active' : ''}`} onClick={() => setViewFilter(f)}>{f}</button>
              ))}
            </div>
            <input className="search-bar" placeholder="Search..." value={search} onChange={e => setSearch(e.target.value)} />
          </div>

          {groups.keys.map(ward => (
            <div key={ward} className="ward-section">
              <div className="ward-header" onClick={() => setCollapsedWards(p => ({ ...p, [ward]: !p[ward] }))}>
                <div><span className={`arrow ${collapsedWards[ward] ? 'collapsed' : ''}`}>▼</span> {ward}</div>
                <span className="ward-count">{groups.g[ward].length}</span>
              </div>
              <div className={`ward-body ${collapsedWards[ward] ? 'is-hidden' : ''}`}>
                {groups.g[ward].map(p => (
                  <div className="p-card" key={p.id}>
                    <div className="mobile-row col-1">
                      <input className="inp inp-bed" value={p.bed || ''} placeholder="Bed" onChange={e => update(p.id, 'bed', e.target.value)} />
                      <input className="inp inp-doc" value={p.doctor || ''} placeholder="Dr." onChange={e => update(p.id, 'doctor', e.target.value)} />
                    </div>
                    <div className="col-2">
                      <div style={{ display: 'flex', gap: 8 }}>
                        <input className="inp inp-name" value={p.name || ''} placeholder="Name" onChange={e => update(p.id, 'name', e.target.value)} />
                        <input className="inp" style={{ width: '90px' }} value={p.mrn || ''} placeholder="MRN" onChange={e => update(p.id, 'mrn', e.target.value)} />
                      </div>
                      <input className="inp" value={p.diagnosis || ''} placeholder="Diagnosis" onChange={e => update(p.id, 'diagnosis', e.target.value)} />
                    </div>
                    <div className="col-3">
                      <textarea className="inp inp-area" value={p.plan || ''} placeholder="Plan..." onChange={e => update(p.id, 'plan', e.target.value)} />
                    </div>
                    <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                      <button className={`btn-lab ${getLabCount(p) > 0 ? 'has-labs' : ''}`} onClick={() => setLabModal(p)}>
                        🧪 Labs
                        {getLabCount(p) > 0 && <span className="lab-count">{getLabCount(p)}</span>}
                      </button>
                      <select className={`status-select status-${(p.status || "").toLowerCase().split('-')[0]}`} value={p.status || ""} onChange={e => update(p.id, 'status', e.target.value)}>
                        <option value="">-</option>
                        {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                      <button className="btn-del" onClick={() => del(p.id)}>×</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}

          {addModal && (
            <div className="modalOverlay">
              <div className="modal" style={{ maxWidth: '450px' }}>
                <div className="modal-head" style={{ background: 'var(--green)' }}>Add Patient</div>
                <div className="modal-body">
                  <div><label style={{ fontSize:11, fontWeight:800, color:"#64748b", textTransform:"uppercase" }}>Ward</label>
                    <select className="inp" value={newP.ward} onChange={e => setNewP({ ...newP, ward: e.target.value })}>{WARD_ORDER.map(w => <option key={w}>{w}</option>)}</select>
                  </div>
                  <div style={{ display: 'flex', gap: 10 }}>
                    <div style={{ flex: 1 }}><label style={{ fontSize:11, fontWeight:800, color:"#64748b", textTransform:"uppercase" }}>Bed</label><input className="inp" value={newP.bed} onChange={e => setNewP({ ...newP, bed: e.target.value })} /></div>
                    <div style={{ flex: 1 }}><label style={{ fontSize:11, fontWeight:800, color:"#64748b", textTransform:"uppercase" }}>Doctor</label><input className="inp" value={newP.doctor} onChange={e => setNewP({ ...newP, doctor: e.target.value })} /></div>
                  </div>
                  <div><label style={{ fontSize:11, fontWeight:800, color:"#64748b", textTransform:"uppercase" }}>Name</label><input className="inp" value={newP.name} onChange={e => setNewP({ ...newP, name: e.target.value })} /></div>
                  <div style={{ display: 'flex', gap: 10 }}>
                    <div style={{ flex: 1 }}><label style={{ fontSize:11, fontWeight:800, color:"#64748b", textTransform:"uppercase" }}>MRN</label><input className="inp" value={newP.mrn} onChange={e => setNewP({ ...newP, mrn: e.target.value })} /></div>
                    <div style={{ flex: 1 }}><label style={{ fontSize:11, fontWeight:800, color:"#64748b", textTransform:"uppercase" }}>Status</label>
                      <select className="inp" value={newP.status} onChange={e => setNewP({ ...newP, status: e.target.value })}>{STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}</select>
                    </div>
                  </div>
                  <div><label style={{ fontSize:11, fontWeight:800, color:"#64748b", textTransform:"uppercase" }}>Diagnosis</label><input className="inp" value={newP.diagnosis} onChange={e => setNewP({ ...newP, diagnosis: e.target.value })} /></div>
                  <div><label style={{ fontSize:11, fontWeight:800, color:"#64748b", textTransform:"uppercase" }}>Plan</label><textarea className="inp inp-area" value={newP.plan} onChange={e => setNewP({ ...newP, plan: e.target.value })} /></div>
                </div>
                <div className="modal-foot">
                  <button className="btn btn-white" onClick={() => setAddModal(false)}>Cancel</button>
                  <button className="btn btn-blue" onClick={saveNew}>Save</button>
                </div>
              </div>
            </div>
          )}

          {labModal && <LabModal patient={labModal} onClose={() => setLabModal(null)} onSave={saveLabImages} />}
          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Unit E Ward Rounds</title>

  <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script crossorigin="anonymous" src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/tesseract.js@5.0.2/dist/tesseract.min.js"></script>

  <script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    :root{ --green:#2e7d32; --green2:#1b5e20; --bg:#f0f2f5; --card:#fff; --border:#e5e7eb; --red:#d32f2f; }
    body{ margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:#111827; padding-bottom:60px; }
    .wrap{ max-width:1200px; margin:0 auto; padding:12px; }
    .app{ background:var(--card); border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.05); overflow:hidden; min-height:85vh; display:flex; flex-direction:column; }

    /* Header */
    .topbar{ background:linear-gradient(135deg, var(--green), var(--green2)); color:#fff; padding:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
    .title h1{ margin:0; font-size:20px; font-weight:700; }
    .subtitle{ font-size:12px; opacity:0.9; display:flex; align-items:center; gap:6px; }
    .dot{ width:8px; height:8px; border-radius:50%; background:#ffb300; border:2px solid rgba(255,255,255,0.8); }
    .dot.online{ background:#22c55e; }

    /* Buttons */
    .actions{ display:flex; gap:8px; }
    .btn{ border:none; border-radius:8px; padding:8px 12px; font-weight:600; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
    .btn-primary{ background:#fff; color:var(--green); }
    .btn-ghost{ background:rgba(255,255,255,0.2); color:#fff; }
    .btn-danger{ background:var(--red); color:#fff; width:28px; height:28px; padding:0; justify-content:center; border-radius:50%; }

    /* Controls */
    .controls{ padding:12px; background:#fafafa; border-bottom:1px solid var(--border); display:flex; gap:10px; flex-wrap:wrap; }
    .search-box{ flex:1; min-width:180px; padding:8px 12px; border:1px solid var(--border); border-radius:8px; outline:none; }
    .pillRow{ display:flex; gap:6px; overflow-x:auto; }
    .pill{ border:1px solid var(--border); background:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; color:#666; }
    .pill.active{ background:var(--green); color:#fff; border-color:var(--green); }

    /* Content */
    .content-area{ flex:1; overflow-x:auto; padding:10px; }
    .section{ margin-bottom:16px; border:1px solid var(--border); border-radius:10px; background:#fff; overflow:hidden; }
    .section-header{ background:#f8fafc; padding:10px; font-weight:700; font-size:13px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }

    table{ width:100%; border-collapse:collapse; font-size:14px; }
    th{ text-align:left; padding:10px; background:#fff; border-bottom:2px solid var(--border); color:#64748b; font-size:11px; text-transform:uppercase; }
    td{ padding:10px; border-bottom:1px solid var(--border); vertical-align:top; }
    .inp{ width:100%; border:1px solid transparent; padding:4px; border-radius:4px; background:transparent; font-family:inherit; resize:none; font-size:14px; }
    .inp:focus{ border-color:var(--green); background:#f0fdf4; outline:none; }

    /* Modal */
    .modalOverlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:99; padding:10px; }
    .modal{ background:#fff; width:100%; max-width:900px; max-height:90vh; border-radius:12px; display:flex; flex-direction:column; overflow:hidden; }
    .modalHeader{ padding:12px; background:#1e293b; color:#fff; display:flex; justify-content:space-between; align-items:center; }
    .modalBody{ padding:10px; overflow-y:auto; flex:1; }

    /* Mobile */
    @media(max-width:768px){
      table, thead, tbody, th, td, tr { display:block; }
      thead tr { position:absolute; top:-9999px; left:-9999px; }
      tr { margin:10px; border:1px solid var(--border); border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,0.05); }
      td { border-bottom:1px solid #f1f5f9; padding:10px; position:relative; }
      td:last-child { border-bottom:none; text-align:right; background:#f8fafc; }
      .inp { background:#f8fafc; border:1px solid #e2e8f0; margin-top:4px; }
      .inp:focus { background:#fff; }
      /* Mobile Labels */
      td:nth-of-type(1):before { content:"Bed/Loc"; font-size:10px; font-weight:800; color:#888; display:block; }
      td:nth-of-type(2):before { content:"Patient"; font-size:10px; font-weight:800; color:#888; display:block; }
      td:nth-of-type(3):before { content:"Diagnosis"; font-size:10px; font-weight:800; color:#888; display:block; }
      td:nth-of-type(4):before { content:"Plan"; font-size:10px; font-weight:800; color:#888; display:block; }
    }
  </style>
</head>
<body>

  <div id="root" style="padding:20px; text-align:center; font-family:sans-serif; color:#666;">
    <h3>Initializing App...</h3>
    <p>If this stays on screen, there is an error.</p>
  </div>

  <!-- Visible error overlay + promise rejection handler -->
  <script>
    function showFatal(msg) {
      const root = document.getElementById("root");
      if (root) {
        root.innerHTML = `
          <div style="max-width:900px;margin:20px auto;padding:14px;border:1px solid #ef4444;background:#fff1f2;border-radius:10px;font-family:system-ui">
            <h3 style="margin:0 0 8px 0;color:#b91c1c">App crashed</h3>
            <pre style="white-space:pre-wrap;margin:0;color:#111827">${String(msg)}</pre>
            <p style="margin:10px 0 0 0;color:#6b7280;font-size:12px">Open DevTools → Console for details.</p>
          </div>
        `;
      }
      alert("Error: " + msg);
    }

    window.onerror = function(message, source, lineno, colno, error) {
      showFatal(message + " @ " + lineno + ":" + colno);
    };

    window.onunhandledrejection = function(e) {
      showFatal(e?.reason?.message || e?.reason || "Unhandled promise rejection");
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCTUw2zpoz_lgMrDCt00CsudqvZgGu4xko",
      authDomain: "unit-e-1d07b.firebaseapp.com",
      databaseURL: "https://unit-e-1d07b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "unit-e-1d07b",
      storageBucket: "unit-e-1d07b.firebasestorage.app",
      messagingSenderId: "465930916258",
      appId: "1:465930916258:web:0ec4d478bb3d6d7bd262fb"
    };

    // Initialize Firebase
    let db;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch(e) { console.error(e); alert("Firebase Init Error: " + e.message); }

    // --- UTILS ---
    const clean = v => (v ?? "").toString().trim();
    const sortBed = (a, b) => {
      const na = parseInt(a.bed), nb = parseInt(b.bed);
      return (!isNaN(na) && !isNaN(nb)) ? na - nb : clean(a.bed).localeCompare(clean(b.bed));
    };

    const App = () => {
      const [patients, setPatients] = useState([]);
      const [loading, setLoading] = useState(true);
      const [online, setOnline] = useState(navigator.onLine);
      const [search, setSearch] = useState("");
      const [filter, setFilter] = useState("All");

      // Import Modal State
      const [modalOpen, setModalOpen] = useState(false);
      const [importData, setImportData] = useState([]);
      const [ocrProgress, setOcrProgress] = useState(null);

      const fileRef = useRef(null);

      // 1. Sync Data
      useEffect(() => {
        const handleStatus = () => setOnline(navigator.onLine);
        window.addEventListener('online', handleStatus);
        window.addEventListener('offline', handleStatus);

        if (db) {
          // OPTIONAL: anonymous sign-in (required if your DB rules are auth != null)
          if (firebase?.auth) {
            firebase.auth().signInAnonymously().catch(err => {
              console.error(err);
              alert("Auth Error: " + err.message);
              setLoading(false);
            });
          }

          const ref = db.ref('patients');

          // IMPORTANT: add error callback so you see PERMISSION_DENIED etc.
          ref.on(
            'value',
            snap => {
              const val = snap.val();
              const list = val ? Object.keys(val).map(k => ({ id:k, ...val[k] })) : [];
              setPatients(list);
              setLoading(false);
            },
            err => {
              console.error(err);
              alert("Firebase DB Error: " + err.message);
              setLoading(false);
            }
          );

          return () => {
            ref.off();
            window.removeEventListener('online', handleStatus);
            window.removeEventListener('offline', handleStatus);
          };
        } else {
          setLoading(false);
          window.removeEventListener('online', handleStatus);
          window.removeEventListener('offline', handleStatus);
        }
      }, []);

      // 2. Actions
      const update = (id, field, val) => db && db.ref(`patients/${id}`).update({ [field]: val });
      const add = (loc) => db && db.ref('patients').push({ location:clean(loc), bed:"", name:"", mrn:"", diagnosis:"", plan:"", timestamp:Date.now() });
      const del = (id) => confirm("Delete?") && db && db.ref(`patients/${id}`).remove();

      const exportExcel = () => {
        const data = patients.map(({id, timestamp, ...rest}) => rest);
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Rounds");
        XLSX.writeFile(wb, "Rounds.xlsx");
      };

      // 3. Import Logic
      const handleFile = async (e) => {
        const file = e.target.files?.[0];
        if(!file) return;

        const name = file.name.toLowerCase();

        try {
          // EXCEL
          if(name.endsWith('.xlsx') || name.endsWith('.xls')) {
            const reader = new FileReader();
            reader.onload = (evt) => {
              const wb = XLSX.read(evt.target.result, {type:'binary'});
              const ws = wb.Sheets[wb.SheetNames[0]];
              const json = XLSX.utils.sheet_to_json(ws);
              processJSON(json);
            };
            reader.readAsBinaryString(file);
          }
          // IMAGE (OCR)
          else if(name.match(/\.(jpg|jpeg|png|webp)$/)) {
            setModalOpen(true);
            setOcrProgress(0);
            setImportData([]);

            try {
              const res = await Tesseract.recognize(file, 'eng', {
                logger: m => m.status === 'recognizing text' && setOcrProgress(m.progress)
              });
              parseText(res.data.text);
            } catch(err) {
              alert("OCR Error: " + err.message);
              setModalOpen(false);
            }
            setOcrProgress(null);
          }
        } catch(err) {
          alert("File Error: " + err.message);
        }
        e.target.value = null;
      };

      const processJSON = (json) => {
        const mapped = json.map(r => {
          const k = Object.keys(r).reduce((acc, key) => ({...acc, [key.toLowerCase()]: r[key]}), {});
          return {
            bed: clean(k.bed || k['bed no'] || k.bedno),
            name: clean(k.name || k['patient name'] || k.patient),
            mrn: clean(k.mrn || k['file no'] || k.id),
            diagnosis: clean(k.diagnosis || k.dx || k.problem),
            plan: clean(k.plan || k.notes || k.mx),
            location: clean(k.location || k.ward || k.unit || ""),
            timestamp: Date.now()
          };
        }).filter(p => p.name || p.bed);

        setImportData(mapped);
        setModalOpen(true);
      };

      const parseText = (text) => {
        const lines = text.split('\n').filter(l => l.trim().length > 5);
        const mapped = lines.map(line => ({
          name: line, bed: "?", diagnosis: "From OCR", plan:"", location:"", timestamp: Date.now()
        }));
        setImportData(mapped);
      };

      const confirmImport = () => {
        if(!db) return;
        importData.forEach(p => db.ref('patients').push(p));
        setModalOpen(false);
        setImportData([]);
      };

      // 4. Grouping
      const groups = useMemo(() => {
        const g = {};
        const filtered = patients.filter(p =>
          (p.name + p.mrn + p.bed).toLowerCase().includes(search.toLowerCase())
        );
        filtered.forEach(p => {
          const loc = p.location || "Unassigned";
          if(!g[loc]) g[loc] = [];
          g[loc].push(p);
        });
        Object.keys(g).forEach(k => g[k].sort(sortBed));
        return g;
      }, [patients, search]);

      return (
        <div className="wrap">
          <div className="app">

            <div className="topbar">
              <div className="title">
                <h1>Unit E Ward Rounds</h1>
                <div className="subtitle">
                  <span className={`dot ${online?'online':''}`}></span> {online?'Online':'Offline'}
                </div>
              </div>
              <div className="actions">
                <input type="file" ref={fileRef} hidden onChange={handleFile} accept=".xlsx,.xls,.jpg,.png" />
                <button className="btn btn-ghost" onClick={() => fileRef.current.click()}>📷 / 📂 Import</button>
                <button className="btn btn-ghost" onClick={exportExcel}>📥 Export</button>
                <button className="btn btn-primary" onClick={() => add("")}>+ Add</button>
              </div>
            </div>

            <div className="controls">
              <input className="search-box" placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} />
              <div className="pillRow">
                {['All', 'Active', 'Discharge'].map(f => (
                  <div key={f} className={`pill ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>{f}</div>
                ))}
              </div>
            </div>

            <div className="content-area">
              {loading && <div style={{padding:20}}>Loading Data...</div>}
              {!loading && Object.keys(groups).sort().map(loc => (
                <div key={loc} className="section">
                  <div className="section-header">
                    <span>{loc} ({groups[loc].length})</span>
                    <button className="btn btn-ghost" style={{color:'#000', padding:'4px 8px'}} onClick={()=>add(loc==='Unassigned'?'':loc)}>+ Add</button>
                  </div>
                  <table>
                    <thead><tr><th width="80">Bed</th><th>Patient</th><th>Diagnosis</th><th>Plan</th><th width="30"></th></tr></thead>
                    <tbody>
                      {groups[loc].map(p => (
                        <tr key={p.id}>
                          <td>
                            <input className="inp" value={p.bed} placeholder="-" onChange={e=>update(p.id, 'bed', e.target.value)} />
                            {loc==='Unassigned' && (
                              <input
                                className="inp"
                                style={{fontSize:10, color:'blue'}}
                                value={p.location}
                                placeholder="Loc?"
                                onChange={e=>update(p.id, 'location', e.target.value)}
                              />
                            )}
                          </td>
                          <td>
                            <input className="inp" style={{fontWeight:'bold'}} value={p.name} placeholder="Name" onChange={e=>update(p.id, 'name', e.target.value)} />
                            <input className="inp" style={{fontSize:12, color:'#666'}} value={p.mrn} placeholder="MRN" onChange={e=>update(p.id, 'mrn', e.target.value)} />
                          </td>
                          <td><textarea className="inp" rows={2} value={p.diagnosis} placeholder="..." onChange={e=>update(p.id, 'diagnosis', e.target.value)} /></td>
                          <td><textarea className="inp" rows={2} value={p.plan} placeholder="..." onChange={e=>update(p.id, 'plan', e.target.value)} /></td>
                          <td><button className="btn btn-danger" onClick={()=>del(p.id)}>×</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              ))}
              {!loading && patients.length === 0 && <div style={{padding:20, color:'#999', textAlign:'center'}}>No patients found. Click + Add</div>}
            </div>

            {modalOpen && (
              <div className="modalOverlay">
                <div className="modal">
                  <div className="modalHeader">
                    <span>Import Preview</span>
                    <button className="btn btn-danger" onClick={()=>{setModalOpen(false); setOcrProgress(null);}}>×</button>
                  </div>
                  <div className="modalBody">
                    {ocrProgress !== null ? (
                      <div style={{padding:20, textAlign:'center'}}>Reading Image... {Math.round(ocrProgress*100)}%</div>
                    ) : (
                      <table>
                        <thead><tr><th>Bed</th><th>Name</th><th>Diagnosis</th></tr></thead>
                        <tbody>
                          {importData.map((r,i) => (
                            <tr key={i}><td>{r.bed}</td><td>{r.name}</td><td>{r.diagnosis}</td></tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                  <div className="modalHeader" style={{background:'#f1f5f9', color:'#000', justifyContent:'flex-end'}}>
                    <!-- FIXED: var(--green) must be a string in React style -->
                    <button
                      className="btn btn-primary"
                      style={{ background: "var(--green)", color: "white" }}
                      onClick={confirmImport}
                      disabled={ocrProgress !== null}
                    >
                      Confirm Import
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

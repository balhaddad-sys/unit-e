
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit E Ward Rounds</title>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Excel -->
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>

  <!-- Firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    :root{
      --bg:#f4f6f5;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#e5e7eb;
      --green:#2e7d32;
      --blue:#1976d2;
      --red:#c62828;
      --shadow: 0 2px 10px rgba(0,0,0,.08);
      --radius: 14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      padding:10px;
    }
    .container{
      max-width:1100px;
      margin:0 auto;
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    /* Error banner (shows if any crash happens) */
    .fatal{
      background:#ffebee;
      border:1px solid #ffcdd2;
      color:#b71c1c;
      padding:12px;
      margin:10px;
      border-radius:12px;
      font-weight:700;
      white-space:pre-wrap;
    }

    /* Header */
    .header{
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      color:#fff;
      padding:14px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      justify-content:space-between;
    }
    .header-title{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:210px;
    }
    .header h1{
      margin:0;
      font-size:20px;
      font-weight:800;
      letter-spacing:.2px;
    }
    .sub{
      font-size:12px;
      opacity:.95;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .dot{
      width:8px;height:8px;border-radius:50%;
      background:#ffb300;
      border:1px solid rgba(255,255,255,.7);
      display:inline-block;
    }
    .dot.online{ background:#4caf50; }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }
    .btn{
      border:0;
      border-radius:12px;
      padding:10px 12px;
      cursor:pointer;
      font-weight:800;
      font-size:13px;
      transition:.15s transform, .15s opacity;
      display:inline-flex;
      align-items:center;
      gap:8px;
      user-select:none;
      white-space:nowrap;
    }
    .btn:active{ transform:scale(.98); opacity:.9; }
    .btn.primary{ background:#ffffff; color:#1b5e20; }
    .btn.blue{ background:#1976d2; color:#fff; }
    .btn.gray{ background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.22); }
    .btn.danger{ background:#d32f2f; color:#fff; }

    .fileLabel{ position:relative; overflow:hidden; }
    .fileLabel input{ position:absolute; inset:0; opacity:0; cursor:pointer; }

    /* Controls */
    .controls{
      padding:12px;
      background:#fbfbfb;
      border-bottom:1px solid var(--border);
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }
    .control{ flex:1; min-width:170px; }
    input, select, textarea{
      width:100%;
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px 12px;
      font-size:14px;
      outline:none;
      background:#fff;
    }
    textarea{ min-height:110px; resize:vertical; }

    .seg{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      align-items:center;
    }
    .chip{
      border:1px solid var(--border);
      background:#fff;
      padding:9px 12px;
      border-radius:999px;
      font-size:13px;
      cursor:pointer;
      user-select:none;
      font-weight:700;
    }
    .chip.active{
      background:#e8f5e9;
      border-color:#a5d6a7;
      color:#1b5e20;
      font-weight:900;
    }

    /* Board sections */
    .content{ padding:12px; }
    .section{
      background:#fff;
      border:1px solid var(--border);
      border-radius:var(--radius);
      margin-bottom:12px;
      overflow:hidden;
    }
    .sectionHeader{
      padding:10px 12px;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-weight:900;
      letter-spacing:.2px;
    }
    .sectionHeader.blue{ background:var(--blue); }
    .sectionHeader.red{ background:var(--red); }
    .countPill{
      background: rgba(255,255,255,.2);
      border:1px solid rgba(255,255,255,.25);
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
    }

    .tableWrap{ overflow-x:auto; }
    table{
      width:100%;
      border-collapse:collapse;
      min-width:920px;
    }
    th, td{
      padding:10px 10px;
      border-bottom:1px solid #f1f5f9;
      text-align:left;
      vertical-align:top;
      font-size:13px;
    }
    th{
      background:#f8fafc;
      font-size:12px;
      color:#374151;
      letter-spacing:.2px;
      border-bottom:1px solid var(--border);
    }
    tr:hover{ background:#fafafa; }
    .rowBtn{ cursor:pointer; }

    .badge{
      display:inline-flex;
      align-items:center;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      border:1px solid transparent;
      white-space:nowrap;
    }
    .b-new{ background:#ede7f6; color:#4527a0; border-color:#d1c4e9; }
    .b-stable{ background:#e8f5e9; color:#1b5e20; border-color:#a5d6a7; }
    .b-critical{ background:#fff3e0; color:#e65100; border-color:#ffcc80; }
    .b-long{ background:#ffebee; color:#b71c1c; border-color:#ffcdd2; }
    .b-discharge{ background:#e3f2fd; color:#0d47a1; border-color:#bbdefb; }

    .notesMini{
      color:var(--muted);
      max-width:320px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .empty{
      padding:24px;
      text-align:center;
      color:var(--muted);
      font-weight:700;
    }

    /* Modal */
    .overlay{
      position:fixed; inset:0;
      background:rgba(0,0,0,.5);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:12px;
      z-index:999;
    }
    .modal{
      width:min(760px, 100%);
      background:#fff;
      border-radius:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
      max-height:92vh;
      display:flex;
      flex-direction:column;
    }
    .modalHead{
      padding:14px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background:#fbfbfb;
    }
    .modalHead h2{ margin:0; font-size:16px; font-weight:1000; }
    .modalBody{ padding:14px; overflow:auto; }
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    .grid .full{ grid-column:1 / -1; }
    .label{
      font-size:12px;
      font-weight:900;
      color:#374151;
      margin-bottom:6px;
    }
    .modalFoot{
      padding:12px 14px;
      border-top:1px solid var(--border);
      display:flex;
      gap:8px;
      justify-content:flex-end;
      background:#fff;
      flex-wrap:wrap;
    }
    .btn2{
      border:0;
      border-radius:12px;
      padding:10px 12px;
      font-weight:900;
      cursor:pointer;
      font-size:13px;
    }
    .btn2.save{ background:var(--green); color:#fff; }
    .

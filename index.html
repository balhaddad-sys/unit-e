<html lang="en">
<head>

  <title>Unit E Ward Rounds</title>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    :root{
      --green:#2e7d32;
      --green2:#1b5e20;
      --blue:#1976d2;
      --red:#c62828;
      --bg:#f5f5f5;
      --card:#ffffff;
      --muted:#6b7280;
      --border:#e5e7eb;
      --shadow: 0 6px 18px rgba(0,0,0,.08);
      --shadow2: 0 1px 3px rgba(0,0,0,.08);
      --radius: 14px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color:#111827;
    }

    .wrap{
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px;
    }

    .app{
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      border: 1px solid rgba(0,0,0,.04);
    }

    .topbar{
      background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
      color:white;
      padding: 16px 16px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    .title{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width: 200px;
    }
    .title h1{
      margin:0;
      font-size: 20px;
      line-height: 1.1;
      letter-spacing:.2px;
    }
    .subtitle{
      display:flex;
      align-items:center;
      gap:8px;
      font-size: 12px;
      opacity:.95;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background:#ffb300;
      border: 2px solid rgba(255,255,255,.9);
      box-shadow: 0 0 0 3px rgba(255,255,255,.15);
    }
    .dot.online{ background:#22c55e; }
    .dot.offline{ background:#ffb300; }

    .actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .btn{
      border: none;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition: transform .05s ease, opacity .15s ease, background .15s ease;
      user-select:none;
    }
    .btn:active{ transform: translateY(1px); }
    .btn-primary{ background: #ffffff; color: var(--green); }
    .btn-primary:hover{ opacity:.92; }
    .btn-ghost{
      background: rgba(255,255,255,.14);
      color:white;
      border: 1px solid rgba(255,255,255,.18);
    }
    .btn-ghost:hover{ background: rgba(255,255,255,.2); }
    .btn-danger{
      background:#ef4444;
      color:white;
    }
    .btn-small{ padding: 8px 10px; border-radius: 10px; font-size:12px; font-weight:700; }
    .btn-link{
      background:transparent;
      color: #0b5bd3;
      border:none;
      padding:0;
      cursor:pointer;
      font-weight:700;
    }

    .controls{
      padding: 12px 14px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .pillRow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

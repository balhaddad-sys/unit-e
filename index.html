<body>
  <div id="root" style="padding:40px; text-align:center; color:#666; font-family:sans-serif;">
    <h2>Loading App…</h2>
    <p>If this stays, something crashed.</p>
  </div>

  <script>
    (function(){
      const boot = { lines: [] };

      function ensureUI(){
        if (document.getElementById('bootbox')) return;
        const div = document.createElement('div');
        div.id = 'bootbox';
        div.innerHTML = `
          <div class="row">
            <div><b>Boot Log</b> <span id="bootstatus" style="opacity:.8">starting…</span></div>
            <button id="boottoggle">Hide</button>
          </div>
          <div id="bootlog"></div>
        `;
        document.body.appendChild(div);
        document.getElementById('boottoggle').onclick = () => {
          const log = document.getElementById('bootlog');
          const btn = document.getElementById('boottoggle');
          const hidden = log.style.display === 'none';
          log.style.display = hidden ? 'block' : 'none';
          btn.textContent = hidden ? 'Hide' : 'Show';
        };
      }

      boot.push = (msg) => {
        boot.lines.push(`[${new Date().toLocaleTimeString()}] ${msg}`);
        ensureUI();
        document.getElementById('bootlog').textContent = boot.lines.slice(-200).join('\n');
      };
      boot.status = (msg) => {
        ensureUI();
        document.getElementById('bootstatus').textContent = msg;
      };

      window.__boot = boot;

      window.showFatal = function(msg) {
        boot.push("FATAL: " + msg);
        const root = document.getElementById("root");
        if (root) {
          root.innerHTML = `
            <div style="max-width:900px;margin:20px auto;padding:14px;border:1px solid #ef4444;background:#fff1f2;border-radius:10px;font-family:system-ui">
              <h3 style="margin:0 0 8px 0;color:#b91c1c">App crashed</h3>
              <pre style="white-space:pre-wrap;margin:0;color:#111827">${String(msg)}</pre>
            </div>
          `;
        }
      };

      window.addEventListener("error", (e) => {
        showFatal((e && e.message) ? (e.message + " @ " + (e.lineno||"?") + ":" + (e.colno||"?")) : "Unknown error");
      });
      window.addEventListener("unhandledrejection", (e) => {
        showFatal(e?.reason?.message || e?.reason || "Unhandled promise rejection");
      });

      document.addEventListener("DOMContentLoaded", () => {
        boot.push("Boot logger ready");
        boot.push("React? " + (!!window.React));
        boot.push("ReactDOM? " + (!!window.ReactDOM));
        boot.push("Babel? " + (!!window.Babel));
        boot.push("firebase? " + (!!window.firebase));
      });
    })();
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCTUw2zpoz_lgMrDCt00CsudqvZgGu4xko",
      authDomain: "unit-e-1d07b.firebaseapp.com",
      databaseURL: "https://unit-e-1d07b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "unit-e-1d07b",
      storageBucket: "unit-e-1d07b.firebasestorage.app",
      messagingSenderId: "465930916258",
      appId: "1:465930916258:web:0ec4d478bb3d6d7bd262fb"
    };

    let db;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      __boot.push("Firebase init OK");
    } catch(e) {
      console.error(e);
      showFatal("Firebase Init Error: " + e.message);
    }

    const clean = v => (v ?? "").toString().trim();
    const sortBed = (a, b) => {
      const na = parseInt(a.bed), nb = parseInt(b.bed);
      return (!isNaN(na) && !isNaN(nb)) ? na - nb : clean(a.bed).localeCompare(clean(b.bed));
    };

    const App = () => {
      const [patients, setPatients] = useState([]);
      const [loading, setLoading] = useState(true);
      const [online, setOnline] = useState(navigator.onLine);
      const [search, setSearch] = useState("");
      const [filter, setFilter] = useState("All");

      const [modalOpen, setModalOpen] = useState(false);
      const [importData, setImportData] = useState([]);
      const [ocrProgress, setOcrProgress] = useState(null);
      const fileRef = useRef(null);

      useEffect(() => {
        const handleStatus = () => setOnline(navigator.onLine);
        window.addEventListener('online', handleStatus);
        window.addEventListener('offline', handleStatus);

        if (!db) { setLoading(false); return; }

        if (firebase?.auth) {
          firebase.auth().signInAnonymously()
            .then(() => __boot.push("Auth: anonymous OK"))
            .catch(err => __boot.push("Auth FAILED: " + err.message));
        }

        const ref = db.ref('patients');
        ref.on(
          'value',
          snap => {
            const val = snap.val();
            const list = val ? Object.keys(val).map(k => ({ id:k, ...val[k] })) : [];
            setPatients(list);
            setLoading(false);
            __boot.status("running ✅");
          },
          err => {
            console.error(err);
            showFatal("Firebase DB Error: " + err.message);
            setLoading(false);
          }
        );

        return () => {
          ref.off();
          window.removeEventListener('online', handleStatus);
          window.removeEventListener('offline', handleStatus);
        };
      }, []);

      const update = (id, field, val) => db && db.ref(`patients/${id}`).update({ [field]: val });
      const add = (loc) => db && db.ref('patients').push({ location:clean(loc), bed:"", name:"", mrn:"", diagnosis:"", plan:"", timestamp:Date.now() });
      const del = (id) => confirm("Delete?") && db && db.ref(`patients/${id}`).remove();

      const exportExcel = () => {
        const data = patients.map(({id, timestamp, ...rest}) => rest);
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Rounds");
        XLSX.writeFile(wb, "Rounds.xlsx");
      };

      const handleFile = async (e) => {
        const file = e.target.files?.[0];
        if(!file) return;
        const name = file.name.toLowerCase();

        try {
          if(name.endsWith('.xlsx') || name.endsWith('.xls')) {
            const reader = new FileReader();
            reader.onload = (evt) => {
              const wb = XLSX.read(evt.target.result, {type:'binary'});
              const ws = wb.Sheets[wb.SheetNames[0]];
              const json = XLSX.utils.sheet_to_json(ws);

              const mapped = json.map(r => {
                const k = Object.keys(r).reduce((acc, key) => ({...acc, [key.toLowerCase()]: r[key]}), {});
                return {
                  bed: clean(k.bed || k['bed no'] || k.bedno),
                  name: clean(k.name || k['patient name'] || k.patient),
                  mrn: clean(k.mrn || k['file no'] || k.id),
                  diagnosis: clean(k.diagnosis || k.dx || k.problem),
                  plan: clean(k.plan || k.notes || k.mx),
                  location: clean(k.location || k.ward || ""),
                  timestamp: Date.now()
                };
              }).filter(p => p.name || p.bed);

              setImportData(mapped);
              setModalOpen(true);
            };
            reader.readAsBinaryString(file);
          } else if(name.match(/\.(jpg|jpeg|png|webp)$/)) {
            setModalOpen(true);
            setOcrProgress(0);
            setImportData([]);

            const res = await Tesseract.recognize(file, 'eng', {
              logger: m => m.status === 'recognizing text' && setOcrProgress(m.progress)
            });

            const lines = res.data.text.split('\n').filter(l => l.trim().length > 4);
            setImportData(lines.map(l => ({ name:l, bed:"?", diagnosis:"", plan:"", location:"", timestamp:Date.now() })));
            setOcrProgress(null);
          }
        } catch(err) {
          showFatal("Import Error: " + err.message);
        }
        e.target.value = null;
      };

      const confirmImport = () => {
        if(!db) return;
        importData.forEach(p => db.ref('patients').push(p));
        setModalOpen(false);
        setImportData([]);
      };

      const groups = useMemo(() => {
        const g = {};
        const filtered = patients.filter(p => (p.name+p.mrn+p.bed).toLowerCase().includes(search.toLowerCase()));
        filtered.forEach(p => {
          const loc = p.location || "Unassigned";
          if(!g[loc]) g[loc] = [];
          g[loc].push(p);
        });
        Object.keys(g).forEach(k => g[k].sort(sortBed));
        return g;
      }, [patients, search]);

      return (
        <div className="wrap">
          <div className="app">

            <div className="topbar">
              <div className="title">
                <h1>Unit E Ward Rounds</h1>
                <div className="subtitle">
                  <span className={`dot ${online?'online':''}`}></span> {online?'Online':'Offline'}
                </div>
              </div>
              <div className="actions">
                <input type="file" ref={fileRef} hidden onChange={handleFile} accept=".xlsx,.xls,.jpg,.png" />
                <button className="btn btn-ghost" onClick={() => fileRef.current.click()}>📷 / 📂 Import</button>
                <button className="btn btn-ghost" onClick={exportExcel}>📥 Export</button>
                <button className="btn btn-primary" onClick={() => add("")}>+ Add</button>
              </div>
            </div>

            <div className="controls">
              <input className="search-box" placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} />
              <div className="pillRow">
                {['All', 'Active', 'Discharge'].map(f => (
                  <div key={f} className={`pill ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>{f}</div>
                ))}
              </div>
            </div>

            <div className="content-area">
              {loading && <div style={{padding:20}}>Loading Data...</div>}

              {!loading && Object.keys(groups).sort().map(loc => (
                <div key={loc} className="section">
                  <div className="section-header">
                    <span>{loc} ({groups[loc].length})</span>
                    <button className="btn btn-ghost" style={{color:'#000', padding:'4px 8px'}} onClick={()=>add(loc==='Unassigned'?'':loc)}>+ Add</button>
                  </div>
                  <table>
                    <thead><tr><th width="80">Bed</th><th>Patient</th><th>Diagnosis</th><th>Plan</th><th width="30"></th></tr></thead>
                    <tbody>
                      {groups[loc].map(p => (
                        <tr key={p.id}>
                          <td>
                            <input className="inp" value={p.bed} placeholder="-" onChange={e=>update(p.id, 'bed', e.target.value)} />
                            {loc==='Unassigned' && (
                              <input className="inp inp-blue" value={p.location} placeholder="Loc?" onChange={e=>update(p.id, 'location', e.target.value)} />
                            )}
                          </td>
                          <td>
                            <input className="inp inp-bold" value={p.name} placeholder="Name" onChange={e=>update(p.id, 'name', e.target.value)} />
                            <input className="inp inp-small" value={p.mrn} placeholder="MRN" onChange={e=>update(p.id, 'mrn', e.target.value)} />
                          </td>
                          <td><textarea className="inp" rows={2} value={p.diagnosis} placeholder="..." onChange={e=>update(p.id, 'diagnosis', e.target.value)} /></td>
                          <td><textarea className="inp" rows={2} value={p.plan} placeholder="..." onChange={e=>update(p.id, 'plan', e.target.value)} /></td>
                          <td><button className="btn btn-danger" onClick={()=>del(p.id)}>×</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              ))}

              {!loading && patients.length === 0 && (
                <div style={{padding:20, color:'#999', textAlign:'center'}}>No patients found. Click + Add</div>
              )}
            </div>

            {modalOpen && (
              <div className="modalOverlay">
                <div className="modal">
                  <div className="modalHeader">
                    <span>Import Preview</span>
                    <button className="btn btn-danger" onClick={()=>{setModalOpen(false); setOcrProgress(null);}}>×</button>
                  </div>

                  <div className="modalBody">
                    {ocrProgress !== null ? (
                      <div style={{padding:20, textAlign:'center'}}>Reading Image... {Math.round(ocrProgress*100)}%</div>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Unit E Ward Rounds</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script crossorigin src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <script crossorigin src="https://unpkg.com/tesseract.js@5.0.2/dist/tesseract.min.js"></script>
  <script crossorigin src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script crossorigin src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script crossorigin src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    :root{ --green:#2e7d32; --blue:#1565c0; --bg:#f1f5f9; --card:#ffffff; --border:#cbd5e1; --text:#0f172a; }
    
    body{ margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); padding-bottom:80px; }
    .wrap{ max-width:1200px; margin:0 auto; padding:10px; }
    
    /* APP CONTAINER */
    .app{ background:var(--bg); min-height:90vh; display:flex; flex-direction:column; gap:10px; }

    /* HEADER */
    .topbar{ background: var(--green); color:white; padding:16px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
    .title h1{ margin:0; font-size:18px; font-weight:700; }
    .subtitle{ font-size:12px; opacity:0.9; display:flex; align-items:center; gap:6px; margin-top:4px; }
    .dot{ width:8px; height:8px; border-radius:50%; background:#4ade80; }

    /* ACTIONS & SEARCH */
    .actions{ display:flex; gap:8px; flex-wrap:wrap; }
    .btn{ border:none; border-radius:6px; padding:8px 12px; font-weight:600; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:0.1s; }
    .btn:active{ transform:scale(0.96); }
    .btn-white{ background:white; color:var(--green); }
    .btn-ghost{ background:rgba(255,255,255,0.2); color:white; }
    .btn-red{ background:#fee2e2; color:#b91c1c; }
    
    .search-bar { width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:8px; font-size:15px; background:white; outline:none; }
    .search-bar:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(46,125,50,0.1); }

    /* WARD HEADERS (Like the blue bars in your Excel) */
    .ward-section { margin-top:20px; }
    .ward-header { 
      background: var(--blue); color:white; 
      padding:10px 14px; 
      border-radius:8px 8px 0 0; 
      font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:0.5px;
      display:flex; justify-content:space-between; align-items:center;
    }
    .ward-count { background:rgba(255,255,255,0.2); padding:2px 8px; border-radius:12px; font-size:11px; }

    /* PATIENT CARD */
    .p-card {
      background:white;
      border:1px solid var(--border);
      border-top:none;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .p-card:last-child { border-radius:0 0 8px 8px; }
    
    .p-row { display:flex; gap:10px; align-items:center; }
    .p-row-main { align-items: flex-start; }
    
    /* Input Styling */
    .inp { width:100%; padding:8px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px; font-family:inherit; background:#f8fafc; resize:none; transition:0.2s; }
    .inp:focus { background:white; border-color:var(--green); outline:none; }
    
    /* Specific Inputs */
    .inp-bed { width:70px; font-weight:800; text-align:center; color:var(--blue); }
    .inp-name { font-weight:700; font-size:15px; color:#1e293b; }
    .inp-doc { font-size:12px; color:#64748b; font-weight:600; width:120px; }
    .inp-area { min-height:50px; }

    /* Delete Button */
    .btn-del { width:30px; height:30px; border-radius:50%; background:#fee2e2; color:#ef4444; border:none; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; }

    /* MODAL (Add Patient) */
    .modalOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100; padding:15px; }
    .modal { background:white; width:100%; max-width:500px; border-radius:12px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 10px 25px rgba(0,0,0,0.2); }
    .modal-head { background:var(--green); padding:16px; color:white; font-weight:bold; font-size:16px; display:flex; justify-content:space-between; }
    .modal-body { padding:20px; display:flex; flex-direction:column; gap:12px; max-height:70vh; overflow-y:auto; }
    .form-group label { font-size:12px; font-weight:700; color:#64748b; margin-bottom:4px; display:block; }
    .form-group select, .form-group input { width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; font-size:14px; }
    .modal-foot { padding:16px; background:#f8fafc; border-top:1px solid #eee; display:flex; justify-content:flex-end; gap:10px; }

    @media(min-width: 768px) {
      .p-card { flex-direction:row; align-items:flex-start; }
      .p-col-left { width: 140px; display:flex; flex-direction:column; gap:6px; }
      .p-col-mid { flex:1; display:flex; flex-direction:column; gap:6px; }
      .p-col-right { width: 250px; display:flex; flex-direction:column; gap:6px; }
    }
  </style>
</head>
<body>

  <div id="root">
    <div style="padding:40px; text-align:center; color:#64748b;">Loading System...</div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyCTUw2zpoz_lgMrDCt00CsudqvZgGu4xko",
      authDomain: "unit-e-1d07b.firebaseapp.com",
      databaseURL: "https://unit-e-1d07b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "unit-e-1d07b",
      storageBucket: "unit-e-1d07b.firebasestorage.app",
      messagingSenderId: "465930916258",
      appId: "1:465930916258:web:0ec4d478bb3d6d7bd262fb"
    };

    let db;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch(e) { console.error(e); }

    // Helpers
    const clean = v => (v ?? "").toString().trim();
    // Sort: Ward first, then Bed number
    const sortPatients = (a, b) => {
      const wa = clean(a.ward).toLowerCase();
      const wb = clean(b.ward).toLowerCase();
      if(wa !== wb) return wa.localeCompare(wb);
      
      const na = parseInt(a.bed), nb = parseInt(b.bed);
      return (!isNaN(na) && !isNaN(nb)) ? na - nb : clean(a.bed).localeCompare(clean(b.bed));
    };

    const App = () => {
      const [patients, setPatients] = useState([]);
      const [loading, setLoading] = useState(true);
      const [search, setSearch] = useState("");
      
      // Modals
      const [addModal, setAddModal] = useState(false);
      const [importModal, setImportModal] = useState(false);
      const [importData, setImportData] = useState([]);
      const fileRef = useRef(null);

      // New Patient Form State
      const [newP, setNewP] = useState({
        ward: "Ward 19", bed: "", name: "", mrn: "", diagnosis: "", plan: "", doctor: ""
      });

      // --- 1. LOAD DATA ---
      useEffect(() => {
        if (!db) { setLoading(false); return; }
        const ref = db.ref('patients');
        ref.on('value', snap => {
          const val = snap.val();
          const list = val ? Object.keys(val).map(k => ({id:k, ...val[k]})) : [];
          setPatients(list);
          setLoading(false);
        });
        return () => ref.off();
      }, []);

      // --- 2. ACTIONS ---
      const update = (id, field, val) => { if(db) db.ref(`patients/${id}`).update({[field]:val}); };
      
      const saveNewPatient = () => {
        if(!newP.name) return alert("Patient name is required");
        if(db) db.ref('patients').push({ ...newP, timestamp: Date.now() });
        setAddModal(false);
        setNewP({ ward: "Ward 19", bed: "", name: "", mrn: "", diagnosis: "", plan: "", doctor: "" }); // Reset
      };

      const del = (id) => { if(confirm("Delete this patient?")) db && db.ref(`patients/${id}`).remove(); };
      const resetDB = () => { if(confirm("⚠️ RESET DATABASE: This deletes ALL patients.\n\nProceed?")) db && db.ref('patients').remove(); };

      const exportExcel = () => {
        const data = patients.map(({id, timestamp, ...rest}) => rest);
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Rounds");
        XLSX.writeFile(wb, "Rounds.xlsx");
      };

      // --- 3. IMPORT LOGIC ---
      const handleFile = async (e) => {
        const file = e.target.files?.[0];
        if(!file) return;
        
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const wb = XLSX.read(evt.target.result, {type:'binary'});
            const ws = wb.Sheets[wb.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(ws);
            
            const mapped = json.map(r => {
               const k = {};
               Object.keys(r).forEach(key => k[key.toLowerCase().trim()] = r[key]);
               return {
                 ward: clean(k.ward || k.location || "Unassigned"),
                 bed: clean(k.bed || k['bed no'] || k.room || k.column1),
                 name: clean(k.name || k.patient || k['patient name'] || k.column2),
                 diagnosis: clean(k.diagnosis || k.dx || k.column3),
                 doctor: clean(k.doctor || k['assigned doctor'] || k.column4),
                 plan: clean(k.plan || k.mx || ""),
                 mrn: clean(k.mrn || k.id || ""),
                 timestamp: Date.now()
               };
            }).filter(p => p.name); // Filter empty rows
            
            setImportData(mapped);
            setImportModal(true);
          } catch(err) { alert("Error reading file"); }
        };
        reader.readAsBinaryString(file);
        e.target.value = null;
      };

      const confirmImport = () => {
        if(!db) return;
        importData.forEach(p => db.ref('patients').push(p));
        setImportModal(false);
        setImportData([]);
      };

      // --- 4. GROUPING LOGIC ---
      const groupedPatients = useMemo(() => {
        const groups = {};
        const s = search.toLowerCase();
        
        // Filter first
        const filtered = patients.filter(p => 
          (p.name+p.mrn+p.bed+p.diagnosis+p.doctor).toLowerCase().includes(s)
        );

        // Group by Ward
        filtered.forEach(p => {
          const w = p.ward || "Unassigned";
          if(!groups[w]) groups[w] = [];
          groups[w].push(p);
        });

        // Sort inside groups
        Object.keys(groups).forEach(k => groups[k].sort(sortPatients));
        
        // Define Custom Ward Order (like excel)
        const customOrder = ["Ward 19", "Ward 20", "Ward 21", "Ward 5", "Ward 10", "ICU", "ER", "Unassigned"];
        const sortedKeys = Object.keys(groups).sort((a,b) => {
          const ia = customOrder.indexOf(a);
          const ib = customOrder.indexOf(b);
          if(ia !== -1 && ib !== -1) return ia - ib;
          if(ia !== -1) return -1;
          if(ib !== -1) return 1;
          return a.localeCompare(b);
        });

        return { groups, sortedKeys };
      }, [patients, search]);

      return (
        <div className="wrap">
          
          <div className="topbar">
            <div className="title">
              <h1>Unit E Ward Rounds</h1>
              <div className="subtitle"><div className="dot"></div> Online • {patients.length} Pts</div>
            </div>
            <div className="actions">
              <input type="file" ref={fileRef} hidden onChange={handleFile} accept=".xlsx,.xls" />
              <button className="btn btn-ghost" onClick={()=>fileRef.current.click()}>📂 Import Excel</button>
              <button className="btn btn-ghost" onClick={exportExcel}>📥 Export</button>
              <button className="btn btn-red" onClick={resetDB}>Reset</button>
              <button className="btn btn-white" onClick={()=>setAddModal(true)}>+ Add Patient</button>
            </div>
          </div>

          <div style={{marginTop:10}}>
            <input className="search-bar" placeholder="Search name, bed, diagnosis..." value={search} onChange={e=>setSearch(e.target.value)} />
          </div>

          <div className="app">
            {loading && <div style={{padding:40, textAlign:'center'}}>Loading...</div>}
            
            {!loading && groupedPatients.sortedKeys.map(ward => (
              <div key={ward} className="ward-section">
                <div className="ward-header">
                  <span>{ward}</span>
                  <span className="ward-count">{groupedPatients.groups[ward].length}</span>
                </div>
                
                {groupedPatients.groups[ward].map(p => (
                  <div className="p-card" key={p.id}>
                    {/* Desktop Layout Helper: 3 Columns */}
                    <div className="p-row p-row-main" style={{flexWrap:'wrap'}}>
                      
                      {/* Left: Bed & Doctor */}
                      <div style={{display:'flex', flexDirection:'column', gap:5, minWidth:'80px'}}>
                        <input className="inp inp-bed" value={p.bed} placeholder="Bed" onChange={e=>update(p.id,'bed',e.target.value)} />
                        <input className="inp inp-doc" value={p.doctor} placeholder="Dr..." onChange={e=>update(p.id,'doctor',e.target.value)} />
                      </div>

                      {/* Middle: Name & Diagnosis */}
                      <div style={{flex:1, minWidth:'200px', display:'flex', flexDirection:'column', gap:5}}>
                        <div style={{display:'flex', gap:5}}>
                           <input className="inp inp-name" value={p.name} placeholder="Patient Name" onChange={e=>update(p.id,'name',e.target.value)} />
                           <input className="inp" style={{width:'80px', fontSize:12}} value={p.mrn} placeholder="MRN" onChange={e=>update(p.id,'mrn',e.target.value)} />
                        </div>
                        <input className="inp" style={{fontWeight:'bold', color:'#334155'}} value={p.diagnosis} placeholder="Diagnosis" onChange={e=>update(p.id,'diagnosis',e.target.value)} />
                      </div>

                      {/* Right: Plan & Delete */}
                      <div style={{width:'100%', maxWidth:'100%', flexBasis:'100%', display:'flex', gap:10, alignItems:'center'}}>
                        <textarea className="inp inp-area" value={p.plan} placeholder="Plan / Notes..." onChange={e=>update(p.id,'plan',e.target.value)} />
                        <button className="btn-del" onClick={()=>del(p.id)}>×</button>
                      </div>
                      
                    </div>
                  </div>
                ))}
              </div>
            ))}

            {!loading && patients.length === 0 && (
              <div style={{padding:50, textAlign:'center', color:'#94a3b8'}}>
                No patients. Click <b>+ Add Patient</b> to start.
              </div>
            )}
          </div>

          {/* ADD PATIENT MODAL */}
          {addModal && (
            <div className="modalOverlay">
              <div className="modal">
                <div className="modal-head">Add New Patient</div>
                <div className="modal-body">
                  <div className="form-group">
                    <label>Ward / Location</label>
                    <select value={newP.ward} onChange={e=>setNewP({...newP, ward:e.target.value})}>
                      <option>Ward 19</option>
                      <option>Ward 20</option>
                      <option>Ward 21</option>
                      <option>Ward 5</option>
                      <option>Ward 10</option>
                      <option>ICU</option>
                      <option>ER</option>
                      <option>Other</option>
                    </select>
                  </div>
                  <div style={{display:'flex', gap:10}}>
                    <div className="form-group" style={{flex:1}}>
                      <label>Bed / Room</label>
                      <input value={newP.bed} onChange={e=>setNewP({...newP, bed:e.target.value})} placeholder="e.g. 19-1" />
                    </div>
                    <div className="form-group" style={{flex:1}}>
                      <label>Assigned Doctor</label>
                      <input value={newP.doctor} onChange={e=>setNewP({...newP, doctor:e.target.value})} placeholder="Dr. Name" />
                    </div>
                  </div>
                  <div className="form-group">
                    <label>Patient Name</label>
                    <input value={newP.name} onChange={e=>setNewP({...newP, name:e.target.value})} placeholder="Full Name" />
                  </div>
                  <div className="form-group">
                    <label>Diagnosis</label>
                    <input value={newP.diagnosis} onChange={e=>setNewP({...newP, diagnosis:e.target.value})} placeholder="Primary Diagnosis" />
                  </div>
                   <div className="form-group">
                    <label>Initial Plan</label>
                    <input value={newP.plan} onChange={e=>setNewP({...newP, plan:e.target.value})} placeholder="..." />
                  </div>
                </div>
                <div className="modal-foot">
                  <button className="btn btn-ghost" style={{color:'#333'}} onClick={()=>setAddModal(false)}>Cancel</button>
                  <button className="btn btn-white" style={{background:'var(--green)', color:'white'}} onClick={saveNewPatient}>Save Patient</button>
                </div>
              </div>
            </div>
          )}

          {/* IMPORT MODAL */}
          {importModal && (
            <div className="modalOverlay">
              <div className="modal">
                 <div className="modal-head">Import Preview ({importData.length})</div>
                 <div className="modal-body">
                   <table style={{width:'100%', fontSize:12, borderCollapse:'collapse'}}>
                     <thead>
                       <tr style={{background:'#eee', textAlign:'left'}}><th style={{padding:5}}>Ward</th><th style={{padding:5}}>Bed</th><th style={{padding:5}}>Name</th></tr>
                     </thead>
                     <tbody>
                       {importData.map((d,i) => (
                         <tr key={i} style={{borderBottom:'1px solid #eee'}}>
                           <td style={{padding:5}}>{d.ward}</td>
                           <td style={{padding:5}}>{d.bed}</td>
                           <td style={{padding:5}}>{d.name}</td>
                         </tr>
                       ))}
                     </tbody>
                   </table>
                 </div>
                 <div className="modal-foot">
                   <button className="btn btn-ghost" style={{color:'#333'}} onClick={()=>setImportModal(false)}>Cancel</button>
                   <button className="btn btn-white" style={{background:'var(--green)', color:'white'}} onClick={confirmImport}>Confirm Import</button>
                 </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

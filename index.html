      .col-1{ width:130px; display:flex; flex-direction:column; gap:6px; }
      .col-2{ flex:1; display:flex; flex-direction:column; gap:6px; }

    @media(max-width: 767px){ .mobile-row{ display:flex; gap:8px; } .p-card{ padding-right: 50px; } .lab-grid { grid-template-columns: repeat(3, 1fr); } }

      cbc: {

        fields: [
          { key: "wbc", label: "WBC", unit: "K/µL", low: 4, high: 11 },

          { key: "alb", label: "Alb", unit: "g/dL", low: 3.5, high: 5.0 },
        ]
      },
      coag: {
        title: "Coag & Other",
        fields: [
          { key: "pt", label: "PT", unit: "sec", low: 11, high: 13.5 },
          { key: "inr", label: "INR", unit: "", low: 0.8, high: 1.1 },
          { key: "ptt", label: "PTT", unit: "sec", low: 25, high: 35 },
          { key: "trop", label: "Trop", unit: "ng/mL", low: 0, high: 0.04 },
          { key: "crp", label: "CRP", unit: "mg/L", low: 0, high: 10 },
          { key: "lactate", label: "Lact", unit: "mmol/L", low: 0.5, high: 2.0 },
        ]
      },
      drugs: {
        title: "Drug Levels",
        fields: [
          { key: "vanco_trough", label: "Vanc Tr", unit: "µg/mL", low: 10, high: 20 },
          { key: "vanco_peak", label: "Vanc Pk", unit: "µg/mL", low: 25, high: 40 },
          { key: "digoxin", label: "Dig", unit: "ng/mL", low: 0.8, high: 2.0 },
        ]
      },
    };

    // Comprehensive lab aliases for text parsing
    const LAB_ALIASES = {
      // CBC
      wbc: ["wbc", "white blood cell", "white cell", "leucocyte", "leukocyte", "wcc", "white count"],
      hgb: ["hgb", "hb", "hemoglobin", "haemoglobin", "hgb/hb"],
      hct: ["hct", "hematocrit", "haematocrit", "pcv", "packed cell"],
      plt: ["plt", "platelet", "platelets", "thrombocyte", "plat"],
      mcv: ["mcv", "mean corpuscular volume", "mean cell volume"],
      neut: ["neut", "neutrophil", "neutrophils", "seg", "segmented", "pmn"],
      lymph: ["lymph", "lymphocyte", "lymphocytes"],
      // Chemistry
      na: ["na", "sodium", "na+", "s.na", "serum sodium"],
      k: ["k", "potassium", "k+", "s.k", "serum potassium"],
      cl: ["cl", "chloride", "cl-", "s.cl"],
      co2: ["co2", "bicarbonate", "hco3", "bicarb", "tco2", "total co2"],
      bun: ["bun", "urea", "blood urea", "urea nitrogen", "s.urea"],
      cr: ["cr", "creatinine", "creat", "crea", "s.cr", "serum creatinine", "s.creatinine"],
      glu: ["glu", "glucose", "blood sugar", "bs", "rbs", "fbs", "fbg", "rbg", "sugar", "blood glucose"],
      ca: ["ca", "calcium", "ca++", "s.ca", "serum calcium", "total calcium"],
      mg: ["mg", "magnesium", "s.mg", "serum magnesium"],
      phos: ["phos", "phosphorus", "phosphate", "po4", "s.phos"],
      // LFTs
      ast: ["ast", "sgot", "aspartate"],
      alt: ["alt", "sgpt", "alanine"],
      alp: ["alp", "alkaline phos", "alk phos", "alkaline phosphatase"],
      tbili: ["tbili", "bilirubin", "total bilirubin", "t bili", "t.bili", "bil", "total bili"],
      alb: ["alb", "albumin", "s.alb", "serum albumin"],
      // Coag
      pt: ["pt", "prothrombin time", "prothrombin"],
      inr: ["inr", "international normalized"],
      ptt: ["ptt", "aptt", "partial thromboplastin"],
      // Cardiac/Inflammatory
      trop: ["trop", "troponin", "tni", "tnt", "hs-trop", "hstrop", "hs trop"],
      crp: ["crp", "c-reactive", "c reactive"],
      lactate: ["lactate", "lactic acid", "lact"],
      // Drug levels
      vanco_trough: ["vancomycin trough", "vanco trough", "vanc trough", "vancomycin tr"],
      vanco_peak: ["vancomycin peak", "vanco peak", "vanc peak"],
      digoxin: ["digoxin", "dig level"],
    };

    // Parse text for lab values - improved version
    const parseLabsFromText = (text) => {
      const results = {};
      const lines = text.split(/[\n\r]+/);
      
      // Process each line
      lines.forEach(line => {
        const lineLower = line.toLowerCase().trim();
        if (!lineLower) return;
        
        // Try to match each lab
        Object.entries(LAB_ALIASES).forEach(([labKey, aliases]) => {
          if (results[labKey]) return; // Already found
          
          for (const alias of aliases) {
            // Check if this alias is in the line
            const aliasIdx = lineLower.indexOf(alias);
            if (aliasIdx === -1) continue;
            
            // Look for numbers after the alias
            const afterAlias = line.slice(aliasIdx + alias.length);
            
            // Various patterns to find the value
            const patterns = [
              /[:\s]+([<>]?\s*\d+\.?\d*)/,
              /\s+(\d+\.?\d*)\s*/,
              /[:\s]*(\d+\.?\d*)/,
            ];
            
            for (const pattern of patterns) {
              const match = afterAlias.match(pattern);
              if (match) {
                const numStr = match[1].replace(/[<>]/g, '').trim();
                const num = parseFloat(numStr);
                if (!isNaN(num) && num > 0) {
                  results[labKey] = num;
                  return;
                }
              }
            }
          }
        });
      });
      
      return results;
    };

    const isTimestamp = (val) => String(val || "").match(/^\d{4}-\d{2}-\d{2}|^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s|\d{13,}|T\d{2}:\d{2}/);
    const cleanBed = (val) => isTimestamp(val) ? "" : String(val || "").trim();
    const makeKey = (ward, name) => `${(ward || "").toLowerCase().trim()}|${(name || "").toLowerCase().trim()}`;
    const formatTime = (ts) => ts ? new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : "";

    // Lab Modal Component
    const LabModal = ({ patient, onClose, onSave }) => {
      const [labs, setLabs] = useState(patient.labs || {});
      const [customLabs, setCustomLabs] = useState(patient.labs?.custom || []);
      const [scanning, setScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState("");
      const [extracted, setExtracted] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);
      const [dragOver, setDragOver] = useState(false);
      const [activeTab, setActiveTab] = useState("scan"); // scan, quick, manual
      const [quickText, setQuickText] = useState("");
      const fileInputRef = useRef(null);
      const cameraInputRef = useRef(null);

      const updateLab = (key, value) => setLabs(prev => ({ ...prev, [key]: value }));

      const getFieldClass = (field, value) => {
        if (!value || value === "") return "";
        const num = parseFloat(value);
        if (isNaN(num)) return "";
        if (num < field.low) return "abnormal-low";
        if (num > field.high) return "abnormal-high";
        return "";
      };

      // Preprocess image for better OCR
      const preprocessImage = (imageData) => {
        return new Promise((resolve) => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const img = new Image();
          
          img.onload = () => {
            // Scale up small images
            const scale = Math.max(1, 1500 / Math.max(img.width, img.height));
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            
            // Draw and apply filters for better contrast
            ctx.filter = 'contrast(1.3) brightness(1.1)';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // Convert to grayscale for better OCR
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
              const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
              // Increase contrast
              const newVal = avg > 128 ? 255 : (avg > 80 ? avg * 1.5 : avg * 0.5);
              data[i] = data[i + 1] = data[i + 2] = Math.min(255, newVal);
            }
            ctx.putImageData(imgData, 0, 0);
            
            resolve(canvas.toDataURL('image/png'));
          };
          
          img.src = imageData;
        });
      };

      const processImage = async (file) => {
        setScanning(true);
        setScanProgress("Preparing image...");
        setExtracted(null);
        
        const reader = new FileReader();
        reader.onload = async (e) => {
          const originalImage = e.target.result;
          setImagePreview(originalImage);
          
          try {
            setScanProgress("Enhancing image...");
            const processedImage = await preprocessImage(originalImage);
            
            setScanProgress("Starting OCR...");
            const worker = await Tesseract.createWorker('eng', 1, {
              logger: m => {
                if (m.status === 'recognizing text') {
                  setScanProgress(`Reading: ${Math.round(m.progress * 100)}%`);
                }
              }
            });

            const { data: { text } } = await worker.recognize(processedImage);
            await worker.terminate();

            setScanProgress("Extracting values...");
            console.log("OCR Text:", text); // Debug
            
            const extractedLabs = parseLabsFromText(text);
            
            if (Object.keys(extractedLabs).length > 0) {
              setExtracted(extractedLabs);
              setLabs(prev => ({ ...prev, ...extractedLabs }));
              setScanProgress(`✓ Found ${Object.keys(extractedLabs).length} values!`);
            } else {
              setScanProgress("No values found. Try Quick Entry or Manual.");
              // Show the raw text so user can see what was read
              setQuickText(text);
              setActiveTab("quick");
            }
          } catch (err) {
            console.error("OCR Error:", err);
            setScanProgress("Error reading image. Try Quick Entry.");
          }
          
          setScanning(false);
        };
        reader.readAsDataURL(file);
      };

      const handleFileSelect = (e) => {
        const file = e.target.files?.[0];
        if (file) processImage(file);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setDragOver(false);
        const file = e.dataTransfer.files?.[0];
        if (file?.type.startsWith('image/')) processImage(file);
      };

      const handlePaste = useCallback((e) => {
        const items = e.clipboardData?.items;
        if (items) {
          for (const item of items) {
            if (item.type.startsWith('image/')) {
              const file = item.getAsFile();
              if (file) processImage(file);
              break;
            }
          }
        }
      }, []);

      useEffect(() => {
        document.addEventListener('paste', handlePaste);
        return () => document.removeEventListener('paste', handlePaste);
      }, [handlePaste]);

      const parseQuickText = () => {
        const extractedLabs = parseLabsFromText(quickText);
        if (Object.keys(extractedLabs).length > 0) {
          setExtracted(extractedLabs);
          setLabs(prev => ({ ...prev, ...extractedLabs }));
          setScanProgress(`✓ Found ${Object.keys(extractedLabs).length} values!`);
        } else {
          setScanProgress("No values found. Check format.");
        }
      };

      const handleSave = () => {
        const labsToSave = { ...labs, custom: customLabs.filter(c => c.name && c.value), updatedAt: Date.now() };
        onSave(patient.id, labsToSave);
        onClose();
      };

      const clearLabs = () => {
        if (confirm("Clear all?")) {
          setLabs({});
          setCustomLabs([]);
          setExtracted(null);
          setImagePreview(null);
          setQuickText("");
        }
      };

      const addCustomLab = () => setCustomLabs([...customLabs, { name: "", value: "" }]);
      const updateCustomLab = (idx, field, value) => {
        const updated = [...customLabs];
        updated[idx][field] = value;
        setCustomLabs(updated);
      };
      const removeCustomLab = (idx) => setCustomLabs(customLabs.filter((_, i) => i !== idx));

      return (
        <div className="modalOverlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: '550px' }}>
            <div className="modal-head purple">
              <span>🧪 Labs - {patient.name}</span>
              <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'white', fontSize: '18px', cursor: 'pointer' }}>×</button>
            </div>
            <div className="modal-body">
              {/* Tab Selection */}
              <div className="tab-row">
                <button className={`tab-btn ${activeTab === 'scan' ? 'active' : ''}`} onClick={() => setActiveTab('scan')}>📷 Scan</button>
                <button className={`tab-btn ${activeTab === 'quick' ? 'active' : ''}`} onClick={() => setActiveTab('quick')}>⚡ Quick</button>
                <button className={`tab-btn ${activeTab === 'manual' ? 'active' : ''}`} onClick={() => setActiveTab('manual')}>✏️ Manual</button>
              </div>

              {/* Scan Tab */}
              {activeTab === 'scan' && (
                <div 
                  className={`scan-area ${dragOver ? 'dragover' : ''}`}
                  onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                  onDragLeave={() => setDragOver(false)}
                  onDrop={handleDrop}
                >
                  <div style={{ marginBottom: '8px', fontSize: '24px' }}>📷</div>
                  <div style={{ fontWeight: '600', marginBottom: '4px' }}>Scan Lab Screenshot</div>
                  <div style={{ fontSize: '12px', color: '#64748b', marginBottom: '12px' }}>
                    Take a screenshot of the labs, then upload or paste here
                  </div>
                  <div>
                    <button className="scan-btn" onClick={() => cameraInputRef.current?.click()} disabled={scanning}>
                      📸 Camera
                    </button>
                    <button className="scan-btn secondary" onClick={() => fileInputRef.current?.click()} disabled={scanning}>
                      📁 Upload
                    </button>
                  </div>
                  <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileSelect} style={{ display: 'none' }} />
                  <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" onChange={handleFileSelect} style={{ display: 'none' }} />
                  
                  {imagePreview && <img src={imagePreview} alt="Preview" className="image-preview" />}
                  
                  {scanProgress && (
                    <div className="scan-progress">
                      {scanning && <span className="spinner"></span>}
                      {scanProgress}
                    </div>
                  )}
                </div>
              )}

              {/* Quick Entry Tab */}
              {activeTab === 'quick' && (
                <div className="quick-entry">
                  <div className="quick-entry-title">⚡ Quick Text Entry</div>
                  <textarea
                    value={quickText}
                    onChange={e => setQuickText(e.target.value)}
                    placeholder={`Paste or type lab values here, e.g.:\n\nWBC: 8.5\nHgb: 12.3\nNa: 140\nK: 4.2\nCreatinine: 1.1\nVancomycin Trough: 14.7`}
                  />
                  <button className="scan-btn" onClick={parseQuickText} style={{ width: '100%', marginTop: '8px' }}>
                    Parse Values
                  </button>
                  <div className="quick-entry-hint">
                    Tip: Copy text from EMR or type "Lab: Value" format
                  </div>
                </div>
              )}

              {/* Extracted Preview */}
              {extracted && Object.keys(extracted).length > 0 && (
                <div className="extracted-preview">
                  <h4>✓ Extracted Values</h4>
                  {Object.entries(extracted).map(([key, val]) => (
                    <div key={key} className="extracted-item">
                      <span style={{ textTransform: 'uppercase' }}>{key.replace(/_/g, ' ')}</span>
                      <span style={{ fontWeight: '600' }}>{val}</span>
                    </div>
                  ))}
                </div>
              )}

              {/* Manual Entry - Lab Sections (always visible) */}
              {(activeTab === 'manual' || extracted) && Object.entries(LAB_CONFIG).map(([sectionKey, section]) => (
                <div key={sectionKey} className="lab-section">
                  <div className="lab-section-title">{section.title}</div>
                  <div className="lab-grid">
                    {section.fields.map(field => (
                      <div key={field.key} className="lab-field">
                        <label>{field.label} <span style={{ opacity: 0.5 }}>({field.unit})</span></label>
                        <input
                          type="text"
                          inputMode="decimal"
                          value={labs[field.key] || ""}
                          onChange={e => updateLab(field.key, e.target.value)}
                          className={getFieldClass(field, labs[field.key])}
                          placeholder={`${field.low}-${field.high}`}
                        />
                      </div>
                    ))}
                  </div>
                </div>
              ))}

              {/* Custom Labs */}
              {activeTab === 'manual' && (
                <div className="lab-section">
                  <div className="lab-section-title">Other / Custom Labs</div>
                  <div className="custom-labs">
                    {customLabs.map((lab, idx) => (
                      <div key={idx} className="custom-lab-item">
                        <input className="inp" placeholder="Name" value={lab.name} onChange={e => updateCustomLab(idx, 'name', e.target.value)} />
                        <input className="inp" placeholder="Value" value={lab.value} onChange={e => updateCustomLab(idx, 'value', e.target.value)} />
                        <button className="btn-del" onClick={() => removeCustomLab(idx)}>×</button>
                      </div>
                    ))}
                    <button className="add-custom-btn" onClick={addCustomLab}>+ Add Custom Lab</button>
                  </div>
                </div>
              )}

              {labs.updatedAt && <div className="lab-timestamp">Last updated: {formatTime(labs.updatedAt)}</div>}
            </div>
            <div className="modal-foot">
              <button className="btn btn-red" onClick={clearLabs}>Clear</button>
              <button className="btn btn-white" onClick={onClose}>Cancel</button>
              <button className="btn btn-purple" onClick={handleSave} style={{ background: 'var(--purple)', color: 'white' }}>Save Labs</button>
            </div>
          </div>
        </div>
      );
    };

    // Notice Banner Component
    const NoticeBanner = ({ notice, onSave }) => {
      const [isEditing, setIsEditing] = useState(false);
      const [isCollapsed, setIsCollapsed] = useState(false);
      const [editText, setEditText] = useState(notice?.text || "");
      useEffect(() => { setEditText(notice?.text || ""); }, [notice?.text]);

      if (isCollapsed && !isEditing) {
        return (
          <div className="notice-banner notice-collapsed" onClick={() => setIsCollapsed(false)}>
            <div className="notice-header">
              <span className="notice-title">📢 Notice</span>
              <span className="notice-expand-hint">▼</span>
            </div>
          </div>
        );
      }

      return (
        <div className="notice-banner">
          <div className="notice-header">
            <span className="notice-title">📢 Notice Board</span>
            <div className="notice-actions">
              {isEditing ? (
                <>
                  <button className="notice-btn cancel" onClick={() => { setEditText(notice?.text || ""); setIsEditing(false); }}>Cancel</button>
                  <button className="notice-btn save" onClick={() => { onSave(editText); setIsEditing(false); }}>Save</button>
                </>
              ) : (
                <>
                  <button className="notice-btn" onClick={() => setIsCollapsed(true)}>▲</button>
                  <button className="notice-btn" onClick={() => setIsEditing(true)}>✏️</button>
                  {notice?.text && <button className="notice-btn" onClick={() => { if(confirm("Clear?")) onSave(""); }}>Clear</button>}
                </>
              )}
            </div>
          </div>
          {isEditing ? (
            <textarea className="notice-textarea" value={editText} onChange={e => setEditText(e.target.value)} placeholder="Enter notices..." autoFocus />
          ) : (
            <div className={`notice-content ${!notice?.text ? 'empty' : ''}`}>{notice?.text || "No notices."}</div>
          )}
        </div>
      );
    };

    const App = () => {
      const [patients, setPatients] = useState([]);
      const [notice, setNotice] = useState({ text: "", updatedAt: null });
      const [search, setSearch] = useState("");
      const [viewFilter, setViewFilter] = useState("All");
      const [addModal, setAddModal] = useState(false);
      const [labModal, setLabModal] = useState(null);
      const [newP, setNewP] = useState({ ward: "Ward 19", bed: "", name: "", diagnosis: "", doctor: "", plan: "", status: "New", mrn: "" });
      const [collapsedWards, setCollapsedWards] = useState({});
      const [syncing, setSyncing] = useState(false);
      const [toast, setToast] = useState(null);
      const syncTimer = useRef(null);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };
      const scheduleSheetSync = useCallback(() => {
        setSyncing(true);
        if (syncTimer.current) clearTimeout(syncTimer.current);
        syncTimer.current = setTimeout(() => { pingSheets(); setTimeout(() => setSyncing(false), 1000); }, 500);
      }, []);

      useEffect(() => {
        db.ref('notice').on('value', snap => setNotice(snap.val() || { text: "", updatedAt: null }));
        db.ref('patients').on('value', snap => {
          const val = snap.val();
          let list = val ? Object.keys(val).map(k => ({ id: k, ...val[k] })) : [];
          list = list.map(p => ({ ...p, bed: cleanBed(p.bed) }));
          setPatients(list);
        });
        return () => { db.ref('notice').off(); db.ref('patients').off(); };
      }, []);

      const saveNotice = (text) => db.ref('notice').set({ text: text.trim(), updatedAt: Date.now() }).then(() => showToast("✓ Notice updated"));
      const saveLabs = (patientId, labs) => db.ref(`patients/${patientId}/labs`).set(labs).then(() => { showToast("✓ Labs saved"); scheduleSheetSync(); });
      const isDuplicate = (ward, name, excludeId = null) => patients.some(p => (excludeId && p.id === excludeId) ? false : makeKey(p.ward, p.name) === makeKey(ward, name));

      const update = useCallback((id, field, value) => {
        if (field === 'name' && isDuplicate(patients.find(p => p.id === id)?.ward, value, id)) { showToast("⚠️ Duplicate name"); return; }
        if (field === 'ward' && isDuplicate(value, patients.find(p => p.id === id)?.name, id)) { showToast("⚠️ Duplicate in ward"); return; }
        if (field === 'bed') value = cleanBed(value);
        db.ref(`patients/${id}`).update({ [field]: value, timestamp: Date.now() }).then(() => scheduleSheetSync());
      }, [patients, scheduleSheetSync]);

      const del = (id) => { if (confirm("Delete?")) db.ref(`patients/${id}`).remove().then(() => { showToast("✓ Deleted"); pingSheets(); }); };
      const toggleWard = (ward) => setCollapsedWards(prev => ({ ...prev, [ward]: !prev[ward] }));

      const saveNew = () => {
        const cleaned = { ward: (newP.ward || "Unassigned").trim(), bed: cleanBed(newP.bed), name: (newP.name || "").trim(), diagnosis: (newP.diagnosis || "").trim(), doctor: (newP.doctor || "").trim(), status: (newP.status || "New").trim(), plan: (newP.plan || "").trim(), mrn: (newP.mrn || "").trim(), timestamp: Date.now() };
        if (!cleaned.name) { alert("Enter name"); return; }
        if (isDuplicate(cleaned.ward, cleaned.name)) { alert("Duplicate exists"); return; }
        db.ref("patients").push(cleaned).then(() => { setAddModal(false); setNewP({ ward: "Ward 19", bed: "", name: "", diagnosis: "", doctor: "", plan: "", status: "New", mrn: "" }); showToast("✓ Added"); pingSheets(); });
      };

      const cleanupDuplicates = async () => {
        if (!confirm("Remove duplicates?")) return;
        setSyncing(true);
        const byKey = {}, toDelete = [];
        patients.forEach(p => {
          const key = makeKey(p.ward, p.name);
          if (!byKey[key]) byKey[key] = p;
          else { if (Number(p.timestamp || 0) > Number(byKey[key].timestamp || 0)) { toDelete.push(byKey[key].id); byKey[key] = p; } else toDelete.push(p.id); }
        });
        for (const id of toDelete) await db.ref(`patients/${id}`).remove();
        showToast(`✓ Removed ${toDelete.length}`);
        pingSheets();
        setSyncing(false);
      };

      const groups = useMemo(() => {
        const g = {};
        let filtered = viewFilter === 'All' ? patients : patients.filter(p => p.status === viewFilter);
        filtered.filter(p => `${p.name}${p.bed}${p.ward}${p.diagnosis}`.toLowerCase().includes(search.toLowerCase())).forEach(p => {
          const w = p.ward || "Unassigned";
          if (!g[w]) g[w] = [];
          g[w].push(p);
        });
        return { g, sortedKeys: Object.keys(g).sort((a, b) => WARD_ORDER.indexOf(a) - WARD_ORDER.indexOf(b)) };
      }, [patients, search, viewFilter]);

      const hasLabs = (p) => p.labs && Object.keys(p.labs).some(k => !['updatedAt', 'custom'].includes(k) && p.labs[k]);

      return (
        <div className="wrap">
          <div className="topbar">
            <div className="title">
              <div className="title-row">
                <h1>Unit E</h1>
                <span className={`sync-badge ${syncing ? 'syncing' : 'idle'}`}>{syncing ? '⏳' : '✓'} {patients.length}</span>
              </div>
            </div>
            <div className="actions">
              <button className="btn btn-white" onClick={() => setAddModal(true)}>+ Add</button>
              <button className="btn btn-green" onClick={() => window.open(SHEET_URL, '_blank')}>📊</button>
              <button className="btn btn-blue" onClick={() => { setSyncing(true); pingSheets(); showToast("🔄 Syncing..."); setTimeout(() => setSyncing(false), 2000); }}>🔄</button>
              <button className="btn btn-red" onClick={cleanupDuplicates}>🧹</button>
            </div>
          </div>

          <NoticeBanner notice={notice} onSave={saveNotice} />

          <div className="controls-container">
            <div className="filter-row">
              {['All', 'New', 'Chronic', 'Non-Chronic'].map(f => (
                <button key={f} className={`filter-btn ${viewFilter === f ? 'active' : ''}`} onClick={() => setViewFilter(f)}>{f}</button>
              ))}
            </div>
            <input className="search-bar" placeholder="Search..." value={search} onChange={e => setSearch(e.target.value)} />
          </div>

          {groups.sortedKeys.map(ward => (
            <div key={ward} className="ward-section">
              <div className="ward-header" onClick={() => toggleWard(ward)}>
                <div><span className={`arrow ${collapsedWards[ward] ? 'collapsed' : ''}`}>▼</span> {ward}</div>
                <span className="ward-count">{groups.g[ward].length}</span>
              </div>
              <div className={`ward-body ${collapsedWards[ward] ? 'is-hidden' : ''}`}>
                {groups.g[ward].map(p => (
                  <div className="p-card" key={p.id}>
                    <div className="mobile-row col-1">
                      <input className="inp inp-bed" value={cleanBed(p.bed)} placeholder="Bed" onChange={e => update(p.id, 'bed', e.target.value)} />
                      <input className="inp inp-doc" value={p.doctor || ''} placeholder="Dr." onChange={e => update(p.id, 'doctor', e.target.value)} />
                    </div>
                    <div className="col-2">
                      <div style={{ display: 'flex', gap: 8 }}>
                        <input className="inp inp-name" value={p.name || ''} placeholder="Name" onChange={e => update(p.id, 'name', e.target.value)} />
                        <input className="inp" style={{ width: '90px' }} value={p.mrn || ''} placeholder="MRN" onChange={e => update(p.id, 'mrn', e.target.value)} />
                      </div>
                      <input className="inp" value={p.diagnosis || ''} placeholder="Diagnosis" onChange={e => update(p.id, 'diagnosis', e.target.value)} />
                    </div>
                    <div className="col-3">
                      <textarea className="inp inp-area" value={p.plan || ''} placeholder="Plan..." onChange={e => update(p.id, 'plan', e.target.value)} />
                    </div>
                    <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                      <button className={`btn-lab ${hasLabs(p) ? 'has-labs' : ''}`} onClick={() => setLabModal(p)}>🧪 {hasLabs(p) ? 'Labs' : 'Labs'}</button>
                      <select className={`status-select status-${(p.status || "").toLowerCase().split('-')[0]}`} value={p.status || ""} onChange={e => update(p.id, 'status', e.target.value)}>
                        <option value="">-</option>
                        {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                      <button className="btn-del" onClick={() => del(p.id)}>×</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}

          {addModal && (
            <div className="modalOverlay">
              <div className="modal">
                <div className="modal-head">Add Patient</div>
                <div className="modal-body">
                  <div className="form-group"><label>Ward</label><select className="inp" value={newP.ward} onChange={e => setNewP({ ...newP, ward: e.target.value })}>{WARD_ORDER.map(w => <option key={w}>{w}</option>)}</select></div>
                  <div style={{ display: 'flex', gap: 10 }}>
                    <div className="form-group" style={{ flex: 1 }}><label>Bed</label><input className="inp" value={newP.bed} onChange={e => setNewP({ ...newP, bed: e.target.value })} /></div>
                    <div className="form-group" style={{ flex: 1 }}><label>Doctor</label><input className="inp" value={newP.doctor} onChange={e => setNewP({ ...newP, doctor: e.target.value })} /></div>
                  </div>
                  <div className="form-group"><label>Name</label><input className="inp" value={newP.name} onChange={e => setNewP({ ...newP, name: e.target.value })} /></div>
                  <div style={{ display: 'flex', gap: 10 }}>
                    <div className="form-group" style={{ flex: 1 }}><label>MRN</label><input className="inp" value={newP.mrn} onChange={e => setNewP({ ...newP, mrn: e.target.value })} /></div>
                    <div className="form-group" style={{ flex: 1 }}><label>Status</label><select className="inp" value={newP.status} onChange={e => setNewP({ ...newP, status: e.target.value })}>{STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                  </div>
                  <div className="form-group"><label>Diagnosis</label><input className="inp" value={newP.diagnosis} onChange={e => setNewP({ ...newP, diagnosis: e.target.value })} /></div>
                  <div className="form-group"><label>Plan</label><textarea className="inp inp-area" value={newP.plan} onChange={e => setNewP({ ...newP, plan: e.target.value })} /></div>
                </div>
                <div className="modal-foot">
                  <button className="btn btn-white" onClick={() => setAddModal(false)}>Cancel</button>
                  <button className="btn btn-blue" onClick={saveNew}>Save</button>
                </div>
              </div>
            </div>
          )}

          {labModal && <LabModal patient={labModal} onClose={() => setLabModal(null)} onSave={saveLabs} />}
          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

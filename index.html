<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Unit E Ward Rounds</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script crossorigin src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script crossorigin src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    :root{ --green:#15803d; --blue:#1e40af; --bg:#f1f5f9; --text:#0f172a; --border:#cbd5e1; --orange:#c2410c; --purple:#7e22ce; }
    body{ margin:0; font-family:sans-serif; background:var(--bg); color:var(--text); padding-bottom:100px; }
    .wrap{ max-width:1200px; margin:0 auto; padding:10px; }
    .topbar{ background:var(--green); color:white; padding:12px 16px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
    .actions{ display:flex; gap:8px; flex-wrap:wrap; }
    .btn{ border:none; border-radius:6px; padding:8px 12px; font-weight:600; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:0.1s; }
    .btn-white{ background:white; color:var(--green); }
    .btn-sync{ background:#fef3c7; color:#92400e; border: 1px solid #fcd34d; }
    .controls-container { background: white; padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
    .filter-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); background: #f8fafc; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .filter-btn.active { background: var(--green); color: white; }
    .search-bar{ width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; outline:none; }
    .ward-section{ background:white; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:20px; }
    .ward-header{ background:var(--blue); color:white; padding:10px 16px; font-weight:700; font-size:13px; display:flex; justify-content:space-between; cursor: pointer; }
    .ward-body.is-hidden { display: none; }
    .p-card{ padding:12px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:10px; position: relative; }
    .inp{ width:100%; padding:6px 8px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px; background:#f8fafc; }
    .inp-bed{ width:70px; font-weight:800; text-align:center; color:var(--blue); }
    .inp-name{ font-weight:700; font-size:15px; }
    .inp-area{ min-height:45px; resize:vertical; }
    .status-select { padding: 4px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .btn-del{ width:28px; height:28px; border-radius:6px; background:#fef2f2; color:#ef4444; border:1px solid #fee2e2; cursor:pointer; }
    @media(min-width: 768px){
      .p-card{ flex-direction:row; align-items:flex-start; gap:14px; }
      .col-1{ width:130px; display:flex; flex-direction:column; gap:6px; }
      .col-2{ flex:1; display:flex; flex-direction:column; gap:6px; }
      .col-3{ width:280px; display:flex; flex-direction:column; gap:6px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCTUw2zpoz_lgMrDCt00CsudqvZgGu4xko",
      authDomain: "unit-e-1d07b.firebaseapp.com",
      databaseURL: "https://unit-e-1d07b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "unit-e-1d07b",
      storageBucket: "unit-e-1d07b.firebasestorage.app",
      messagingSenderId: "465930916258",
      appId: "1:465930916258:web:0ec4d478bb3d6d7bd262fb"
    };

    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwH18Yk5D6Ko7c2jiOn721jJ4v-dQFSoLI10FOp6DnDY27L1BFOD-jzSLxwUactSTDw/exec"; 

    const WARD_ORDER = ["Ward 19", "Ward 20", "Ward 21", "Ward 22", "Ward 27", "Ward 5", "Ward 10", "ICU", "ER", "Unassigned"];
    const STATUS_OPTIONS = ["New", "Chronic", "Non-Chronic"];

    const App = () => {
      const [patients, setPatients] = useState([]);
      const [search, setSearch] = useState("");
      const [viewFilter, setViewFilter] = useState("All"); 
      const [collapsedWards, setCollapsedWards] = useState({});

      useEffect(() => {
        db.ref('patients').on('value', snap => {
          const val = snap.val();
          setPatients(val ? Object.keys(val).map(k => ({id:k, ...val[k]})) : []);
        });
      }, []);

      const syncFromGoogle = async () => {
        try {
          const response = await fetch(GOOGLE_SCRIPT_URL);
          const sheetData = await response.json();
          sheetData.forEach(newP => {
            const existing = patients.find(p => p.name === newP.name);
            if(existing) {
              db.ref(`patients/${existing.id}`).update({
                ward: newP.ward, bed: newP.bed, mrn: newP.mrn, doctor: newP.doctor, status: newP.status
              });
            } else {
              db.ref('patients').push({ ...newP, plan: "", timestamp: Date.now() });
            }
          });
          alert("Sync Complete!");
        } catch (e) { alert("Sync Error: " + e.message); }
      };

      const pushToGoogle = async (patientName, field, value) => {
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ name: patientName, field: field, value: value })
          });
        } catch (e) { console.error("Google Push Failed", e); }
      };

      const handleUpdate = (id, patientName, field, value) => {
        db.ref(`patients/${id}`).update({[field]: value});
        // Only push identity fields to Google, not clinical plans
        if(['ward', 'bed', 'doctor', 'status'].includes(field)) {
          pushToGoogle(patientName, field, value);
        }
      };

      const del = (id) => confirm("Delete?") && db.ref(`patients/${id}`).remove();

      const groups = useMemo(() => {
        const g = {};
        const s = search.toLowerCase();
        let filtered = patients;
        if(viewFilter !== 'All') filtered = patients.filter(p => p.status === viewFilter);
        filtered.filter(p => (p.name+p.bed+p.ward+p.diagnosis).toLowerCase().includes(s)).forEach(p => {
          let w = p.ward || "Unassigned";
          if(!g[w]) g[w] = []; g[w].push(p);
        });
        const sortedKeys = Object.keys(g).sort((a,b) => WARD_ORDER.indexOf(a) - WARD_ORDER.indexOf(b));
        return { g, sortedKeys, totalCount: filtered.length };
      }, [patients, search, viewFilter]);

      return (
        <div className="wrap">
          <div className="topbar">
            <div className="title"><h1>Unit E Ward Rounds</h1></div>
            <div className="actions">
              <button className="btn btn-sync" onClick={syncFromGoogle}>🔄 Sync from Google</button>
            </div>
          </div>

          <div className="controls-container">
            <div className="filter-row">
                {['All', 'New', 'Chronic', 'Non-Chronic'].map(f => (
                    <button key={f} className={`filter-btn ${viewFilter === f ? 'active' : ''}`} onClick={()=>setViewFilter(f)}>{f}</button>
                ))}
            </div>
            <input className="search-bar" placeholder="Search patients..." value={search} onChange={e=>setSearch(e.target.value)} />
          </div>

          {groups.sortedKeys.map(ward => (
            <div key={ward} className="ward-section">
              <div className="ward-header" onClick={() => setCollapsedWards(prev => ({...prev, [ward]: !prev[ward]}))}>
                  <div>{ward}</div>
                  <span>{groups.g[ward].length} Pts</span>
              </div>
              <div className={`ward-body ${collapsedWards[ward] ? 'is-hidden' : ''}`}>
                  {groups.g[ward].map(p => (
                    <div className="p-card" key={p.id}>
                      <div className="mobile-row col-1">
                        <input className="inp inp-bed" value={p.bed} placeholder="Bed" onChange={e=>handleUpdate(p.id, p.name, 'bed', e.target.value)} />
                        <input className="inp inp-doc" value={p.doctor} placeholder="Dr." onChange={e=>handleUpdate(p.id, p.name, 'doctor', e.target.value)} />
                      </div>
                      <div className="col-2">
                        <input className="inp inp-name" value={p.name} placeholder="Name" readOnly />
                        <input className="inp" value={p.diagnosis} placeholder="Diagnosis" onChange={e=>handleUpdate(p.id, p.name, 'diagnosis', e.target.value)} />
                      </div>
                      <div className="col-3"><textarea className="inp inp-area" value={p.plan} placeholder="Plan..." onChange={e=>db.ref(`patients/${p.id}`).update({plan: e.target.value})} /></div>
                      <div style={{display:'flex', gap:6, alignItems:'center'}}><select className="status-select" value={p.status || ""} onChange={e=>handleUpdate(p.id, p.name, 'status', e.target.value)}><option value="">- Status -</option>{STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}</select><button className="btn-del" onClick={()=>del(p.id)}>×</button></div>
                    </div>
                  ))}
              </div>
            </div>
          ))}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

    .notice-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .notice-title { font-weight: 800; color: #92400e; font-size: 13px; text-transform: uppercase; }
    .notice-actions { display: flex; gap: 6px; }
    .notice-btn { background: white; border: 1px solid #f59e0b; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: #92400e; cursor: pointer; }
    .notice-btn.save { background: #15803d; color: white; border-color: #15803d; }
    .notice-content { color: #78350f; font-size: 14px; white-space: pre-wrap; }
    .notice-content.empty { color: #a16207; font-style: italic; }
    .notice-textarea { width: 100%; min-height: 60px; padding: 10px; border: 1px solid #f59e0b; border-radius: 8px; font-size: 14px; font-family: inherit; background: white; box-sizing: border-box; }

    .filter-btn.active { background: var(--green); color: white; border-color: var(--green); }
    .search-bar{ width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:14px; outline:none; box-sizing: border-box; }

    .ward-section{ background:white; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:20px; }
    .ward-header{ background:var(--blue); color:white; padding:10px 16px; font-weight:700; font-size:13px; display:flex; justify-content:space-between; align-items:center; cursor: pointer; }

    .scan-area.dragover { border-color: var(--purple); background: #faf5ff; }

    .scan-progress { margin-top: 12px; font-size: 13px; color: #64748b; }

    .sync-badge { font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: 600; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 200; }

    .image-preview { max-width: 100%; max-height: 120px; border-radius: 8px; margin-top: 8px; border: 1px solid var(--border); }

    .ocr-result { background: #1e293b; color: #e2e8f0; border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 11px; max-height: 150px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; }
    .ocr-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .ocr-title { color: #94a3b8; font-size: 10px; text-transform: uppercase; }
    .ocr-toggle { background: #334155; border: none; color: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; }

    .extracted-list { background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px; padding: 12px; margin-top: 12px; }
    .extracted-title { font-size: 12px; font-weight: 700; color: var(--green); margin-bottom: 8px; }
    .extracted-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
    .extracted-item { display: flex; justify-content: space-between; background: white; padding: 6px 10px; border-radius: 4px; font-size: 12px; }
    .extracted-item .lab-name { color: #64748b; }
    .extracted-item .lab-value { font-weight: 700; color: var(--green); }

    .custom-lab-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .custom-lab-row input { flex: 1; }

    .add-custom-btn { background: #f8fafc; border: 1px dashed var(--border); border-radius: 6px; padding: 8px; width: 100%; cursor: pointer; color: #64748b; font-size: 12px; }

    }
    @media(max-width: 767px){ .mobile-row{ display:flex; gap:8px; } .p-card{ padding-right: 50px; } }

    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    };

    const WARD_ORDER = ["Ward 19", "Ward 20", "Ward 21", "Ward 22", "Ward 27", "Ward 5", "Ward 10", "ICU", "ER", "Unassigned"];
    const STATUS_OPTIONS = ["New", "Chronic", "Non-Chronic"];

    // Lab configuration
    const LAB_CONFIG = {
      cbc: {
        title: "CBC",
        fields: [
          { key: "wbc", label: "WBC", low: 4, high: 11 },
          { key: "hgb", label: "Hgb", low: 12, high: 17 },
          { key: "hct", label: "Hct", low: 36, high: 50 },
          { key: "plt", label: "Plt", low: 150, high: 400 },
          { key: "mcv", label: "MCV", low: 80, high: 100 },
        ]
      },
      chem: {
        title: "Chemistry",
        fields: [
          { key: "na", label: "Na", low: 136, high: 145 },
          { key: "k", label: "K", low: 3.5, high: 5.0 },
          { key: "cl", label: "Cl", low: 98, high: 106 },
          { key: "co2", label: "CO2", low: 23, high: 29 },
          { key: "bun", label: "BUN", low: 7, high: 20 },
          { key: "cr", label: "Cr", low: 0.6, high: 1.2 },
          { key: "glu", label: "Glu", low: 70, high: 100 },
          { key: "ca", label: "Ca", low: 8.5, high: 10.5 },
          { key: "mg", label: "Mg", low: 1.7, high: 2.2 },
        ]
      },
      lft: {
        title: "LFT / Other",
        fields: [
          { key: "ast", label: "AST", low: 10, high: 40 },
          { key: "alt", label: "ALT", low: 7, high: 56 },
          { key: "alp", label: "ALP", low: 44, high: 147 },
          { key: "tbili", label: "Bili", low: 0.1, high: 1.2 },
          { key: "alb", label: "Alb", low: 3.5, high: 5.0 },
          { key: "inr", label: "INR", low: 0.8, high: 1.1 },
          { key: "crp", label: "CRP", low: 0, high: 10 },
          { key: "pct", label: "PCT", low: 0, high: 0.5 },
          { key: "lactate", label: "Lact", low: 0.5, high: 2.0 },
        ]
      },
      drugs: {
        title: "Drug Levels",
        fields: [
          { key: "vanco", label: "Vanc", low: 10, high: 20 },
          { key: "gent", label: "Gent", low: 0, high: 2 },
          { key: "dig", label: "Dig", low: 0.8, high: 2.0 },
        ]
      },
    };

    // Comprehensive lab aliases for parsing - very extensive matching
    const LAB_MATCHERS = [
      // CBC
      { key: "wbc", patterns: [/wbc/i, /white\s*blood/i, /leucocyte/i, /leukocyte/i, /w\.?b\.?c/i], range: [0.1, 100] },
      { key: "hgb", patterns: [/\bhgb\b/i, /\bhb\b/i, /hemoglobin/i, /haemoglobin/i], range: [3, 25] },
      { key: "hct", patterns: [/\bhct\b/i, /hematocrit/i, /haematocrit/i, /\bpcv\b/i], range: [10, 70] },
      { key: "plt", patterns: [/\bplt\b/i, /platelet/i, /thrombocyte/i], range: [5, 1000] },
      { key: "mcv", patterns: [/\bmcv\b/i, /mean\s*corp/i, /mean\s*cell\s*vol/i], range: [50, 150] },
      // Chemistry
      { key: "na", patterns: [/\bna\b/i, /\bna\+/i, /sodium/i, /\bs\.?\s*na\b/i], range: [100, 180] },
      { key: "k", patterns: [/\bk\b(?![a-z])/i, /\bk\+/i, /potassium/i, /\bs\.?\s*k\b/i], range: [1.5, 9] },
      { key: "cl", patterns: [/\bcl\b/i, /\bcl-/i, /chloride/i], range: [70, 130] },
      { key: "co2", patterns: [/\bco2\b/i, /\btco2\b/i, /bicarb/i, /\bhco3\b/i], range: [5, 50] },
      { key: "bun", patterns: [/\bbun\b/i, /\burea\b/i, /blood\s*urea/i], range: [1, 200] },
      { key: "cr", patterns: [/\bcr\b/i, /creatinine/i, /\bcreat\b/i, /s\.?\s*creat/i], range: [0.1, 30] },
      { key: "glu", patterns: [/\bglu\b/i, /glucose/i, /blood\s*sugar/i, /\brbs\b/i, /\bfbs\b/i], range: [20, 800] },
      { key: "ca", patterns: [/\bca\b(?!\s*rbon)/i, /calcium/i, /\bca\+\+/i], range: [4, 15] },
      { key: "mg", patterns: [/\bmg\b(?!\s*\/)/i, /magnesium/i], range: [0.5, 5] },
      // LFT
      { key: "ast", patterns: [/\bast\b/i, /\bsgot\b/i, /aspartate/i], range: [1, 5000] },
      { key: "alt", patterns: [/\balt\b/i, /\bsgpt\b/i, /alanine/i], range: [1, 5000] },
      { key: "alp", patterns: [/\balp\b/i, /alk.*phos/i, /alkaline/i], range: [10, 2000] },
      { key: "tbili", patterns: [/bili/i, /\bbil\b/i], range: [0.01, 50] },
      { key: "alb", patterns: [/\balb\b/i, /albumin/i], range: [1, 6] },
      // Coag/Other
      { key: "inr", patterns: [/\binr\b/i], range: [0.5, 15] },
      { key: "crp", patterns: [/\bcrp\b/i, /c-?\s*reactive/i], range: [0, 500] },
      { key: "pct", patterns: [/\bpct\b/i, /procalcitonin/i], range: [0, 200] },
      { key: "lactate", patterns: [/lactate/i, /lactic/i], range: [0.1, 30] },
      // Drug levels
      { key: "vanco", patterns: [/vancomycin/i, /vanco/i, /vanc/i], range: [0, 100] },
      { key: "gent", patterns: [/gent/i, /gentamicin/i], range: [0, 20] },
      { key: "dig", patterns: [/digoxin/i, /\bdig\b/i], range: [0, 5] },
    ];

    // Smart lab value parser
    const parseLabsFromText = (text) => {
      const results = {};
      const lines = text.split(/[\r\n]+/);
      const allText = text.toLowerCase();
      
      // Process line by line
      for (const line of lines) {
        const lineLower = line.toLowerCase();
        
        for (const matcher of LAB_MATCHERS) {
          if (results[matcher.key]) continue; // Already found
          
          for (const pattern of matcher.patterns) {
            const match = lineLower.match(pattern);
            if (!match) continue;
            
            // Find position of match
            const matchIdx = match.index;
            const afterMatch = line.substring(matchIdx + match[0].length);
            const beforeMatch = line.substring(0, matchIdx);
            
            // Look for number AFTER the lab name (most common format)
            // Match formats: "WBC: 8.5", "WBC 8.5", "WBC  8.5", "WBC:8.5", "WBC = 8.5"
            const afterPatterns = [
              /^[\s:=]+([<>]?\s*\d+\.?\d*)/,
              /^[^\d]*?(\d+\.?\d*)/,
            ];
            
            for (const ap of afterPatterns) {
              const numMatch = afterMatch.match(ap);
              if (numMatch) {
                const val = parseFloat(numMatch[1].replace(/[<>]/g, ''));
                if (!isNaN(val) && val >= matcher.range[0] && val <= matcher.range[1]) {
                  results[matcher.key] = val;
                  break;
                }
              }
            }
            
            if (results[matcher.key]) break;
            
            // Also check for number BEFORE (format: "8.5 WBC")
            const beforeMatch2 = beforeMatch.match(/(\d+\.?\d*)\s*$/);
            if (beforeMatch2) {
              const val = parseFloat(beforeMatch2[1]);
              if (!isNaN(val) && val >= matcher.range[0] && val <= matcher.range[1]) {
                results[matcher.key] = val;
                break;
              }
            }
          }
        }
      }
      
      // Second pass: look for tabular data patterns
      // Format: numbers with specific ranges even without labels
      const numbers = text.match(/\d+\.?\d*/g) || [];
      
      return results;
    };

    // Cloud OCR using OCR.space API
    const cloudOCR = async (imageBase64) => {
      const formData = new FormData();
      formData.append('base64Image', imageBase64);
      formData.append('apikey', OCR_API_KEY);
      formData.append('language', 'eng');
      formData.append('isOverlayRequired', 'false');
      formData.append('scale', 'true');
      formData.append('isTable', 'true');
      formData.append('OCREngine', '2'); // Engine 2 is better for tables
      
      try {
        const response = await fetch(OCR_API_URL, {
          method: 'POST',
          body: formData
        });
        
        const data = await response.json();
        
        if (data.ParsedResults && data.ParsedResults[0]) {
          return data.ParsedResults[0].ParsedText || "";
        }
        return "";
      } catch (err) {
        console.error("OCR API error:", err);
        return "";
      }
    };

    const isTimestamp = (val) => String(val || "").match(/^\d{4}-\d{2}-\d{2}|^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s|\d{13,}|T\d{2}:\d{2}/);
    const cleanBed = (val) => isTimestamp(val) ? "" : String(val || "").trim();
    const makeKey = (ward, name) => `${(ward || "").toLowerCase().trim()}|${(name || "").toLowerCase().trim()}`;
    const formatTime = (ts) => ts ? new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : "";

    // Lab Modal
    const LabModal = ({ patient, onClose, onSave }) => {
      const [labs, setLabs] = useState(patient.labs || {});
      const [customLabs, setCustomLabs] = useState(patient.labs?.custom || []);
      const [scanning, setScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState("");
      const [extracted, setExtracted] = useState(null);
      const [rawText, setRawText] = useState("");
      const [showRaw, setShowRaw] = useState(false);
      const [imagePreview, setImagePreview] = useState(null);
      const [dragOver, setDragOver] = useState(false);
      const fileRef = useRef(null);
      const cameraRef = useRef(null);

      const updateLab = (key, value) => setLabs(prev => ({ ...prev, [key]: value }));

      const getFieldClass = (field, value) => {
        if (!value || value === "") return "";
        const num = parseFloat(value);
        if (isNaN(num)) return "";
        if (num < field.low) return "abnormal-low";
        if (num > field.high) return "abnormal-high";
        return "filled";
      };

      const processImage = async (file) => {
        setScanning(true);
        setScanProgress("Uploading to OCR service...");
        setExtracted(null);
        setRawText("");
        
        const reader = new FileReader();
        reader.onload = async (e) => {
          const base64 = e.target.result;
          setImagePreview(base64);
          
          try {
            setScanProgress("Reading text (Cloud OCR)...");
            const text = await cloudOCR(base64);
            
            if (text) {
              setRawText(text);
              setShowRaw(true);
              
              setScanProgress("Extracting lab values...");
              const extractedLabs = parseLabsFromText(text);
              
              const count = Object.keys(extractedLabs).length;
              if (count > 0) {
                setExtracted(extractedLabs);
                setLabs(prev => ({ ...prev, ...extractedLabs }));
                setScanProgress(`✓ Found ${count} lab values!`);
              } else {
                setScanProgress("Text read but no labs found. Check raw text below.");
              }
            } else {
              setScanProgress("Could not read image. Try a clearer screenshot.");
            }
          } catch (err) {
            console.error("OCR error:", err);
            setScanProgress("Error processing image.");
          }
          
          setScanning(false);
        };
        reader.readAsDataURL(file);
      };

      const handleFile = (e) => {
        const file = e.target.files?.[0];
        if (file) processImage(file);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setDragOver(false);
        const file = e.dataTransfer.files?.[0];
        if (file?.type.startsWith('image/')) processImage(file);
      };

      const handlePaste = useCallback((e) => {
        const items = e.clipboardData?.items;
        if (items) {
          for (const item of items) {
            if (item.type.startsWith('image/')) {
              processImage(item.getAsFile());
              break;
            }
          }
        }
      }, []);

      useEffect(() => {
        document.addEventListener('paste', handlePaste);
        return () => document.removeEventListener('paste', handlePaste);
      }, [handlePaste]);

      const handleSave = () => {
        onSave(patient.id, { ...labs, custom: customLabs.filter(c => c.name && c.value), updatedAt: Date.now() });
        onClose();
      };

      const clearAll = () => {
        if (confirm("Clear all?")) {
          setLabs({});
          setCustomLabs([]);
          setExtracted(null);
          setRawText("");
          setImagePreview(null);
        }
      };

      return (
        <div className="modalOverlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-head purple">
              <span>🧪 Labs - {patient.name}</span>
              <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'white', fontSize: '18px', cursor: 'pointer' }}>×</button>
            </div>
            <div className="modal-body">
              {/* Scan Area */}
              <div 
                className={`scan-area ${dragOver ? 'dragover' : ''}`}
                onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                onDragLeave={() => setDragOver(false)}
                onDrop={handleDrop}
              >
                <div style={{ fontSize: '24px', marginBottom: '8px' }}>📷</div>
                <div style={{ fontWeight: '600', marginBottom: '4px' }}>Scan Lab Report</div>
                <div style={{ fontSize: '12px', color: '#64748b', marginBottom: '12px' }}>
                  Screenshot works best! Photo of screen also works.
                </div>
                <div>
                  <button className="scan-btn" onClick={() => cameraRef.current?.click()} disabled={scanning}>📸 Camera</button>
                  <button className="scan-btn secondary" onClick={() => fileRef.current?.click()} disabled={scanning}>📁 Upload</button>
                </div>
                <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{ display: 'none' }} />
                <input ref={cameraRef} type="file" accept="image/*" capture="environment" onChange={handleFile} style={{ display: 'none' }} />
                
                {imagePreview && <img src={imagePreview} alt="Preview" className="image-preview" />}
                
                {scanProgress && (
                  <div className="scan-progress">
                    {scanning && <span className="spinner"></span>}
                    {scanProgress}
                  </div>
                )}
              </div>

              {/* Extracted Preview */}
              {extracted && Object.keys(extracted).length > 0 && (
                <div className="extracted-list">
                  <div className="extracted-title">✓ Extracted Values</div>
                  <div className="extracted-grid">
                    {Object.entries(extracted).map(([key, val]) => (
                      <div key={key} className="extracted-item">
                        <span className="lab-name">{key.toUpperCase()}</span>
                        <span className="lab-value">{val}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Raw OCR Text */}
              {rawText && (
                <div className="ocr-result">
                  <div className="ocr-header">
                    <span className="ocr-title">Raw OCR Text</span>
                    <button className="ocr-toggle" onClick={() => setShowRaw(!showRaw)}>
                      {showRaw ? 'Hide' : 'Show'}
                    </button>
                  </div>
                  {showRaw && <div>{rawText}</div>}
                </div>
              )}

              {/* Lab Entry Fields */}
              {Object.entries(LAB_CONFIG).map(([sectionKey, section]) => (
                <div key={sectionKey} className="lab-section">
                  <div className="lab-section-title">{section.title}</div>
                  <div className="lab-grid">
                    {section.fields.map(field => (
                      <div key={field.key} className="lab-field">
                        <label>{field.label}</label>
                        <input
                          type="text"
                          inputMode="decimal"
                          value={labs[field.key] || ""}
                          onChange={e => updateLab(field.key, e.target.value)}
                          className={getFieldClass(field, labs[field.key])}
                          placeholder={`${field.low}-${field.high}`}
                        />
                      </div>
                    ))}
                  </div>
                </div>
              ))}

              {/* Custom Labs */}
              <div className="lab-section">
                <div className="lab-section-title">Custom Labs</div>
                {customLabs.map((lab, idx) => (
                  <div key={idx} className="custom-lab-row">
                    <input className="inp" placeholder="Name" value={lab.name} onChange={e => {
                      const updated = [...customLabs];
                      updated[idx].name = e.target.value;
                      setCustomLabs(updated);
                    }} />
                    <input className="inp" placeholder="Value" value={lab.value} onChange={e => {
                      const updated = [...customLabs];
                      updated[idx].value = e.target.value;
                      setCustomLabs(updated);
                    }} />
                    <button className="btn-del" onClick={() => setCustomLabs(customLabs.filter((_, i) => i !== idx))}>×</button>
                  </div>
                ))}
                <button className="add-custom-btn" onClick={() => setCustomLabs([...customLabs, { name: "", value: "" }])}>+ Add Custom Lab</button>
              </div>

              {labs.updatedAt && <div style={{ fontSize: '11px', color: '#94a3b8', textAlign: 'right' }}>Updated: {formatTime(labs.updatedAt)}</div>}
            </div>
            <div className="modal-foot">
              <button className="btn btn-red" onClick={clearAll}>Clear</button>
              <button className="btn btn-white" onClick={onClose}>Cancel</button>
              <button className="btn" style={{ background: 'var(--purple)', color: 'white' }} onClick={handleSave}>Save Labs</button>
            </div>
          </div>
        </div>
      );
    };

    // Notice Banner
    const NoticeBanner = ({ notice, onSave }) => {
      const [editing, setEditing] = useState(false);
      const [collapsed, setCollapsed] = useState(false);
      const [text, setText] = useState(notice?.text || "");
      useEffect(() => setText(notice?.text || ""), [notice?.text]);

      if (collapsed) {
        return (
          <div className="notice-banner notice-collapsed" onClick={() => setCollapsed(false)}>
            <div className="notice-header">
              <span className="notice-title">📢 Notice</span>
              <span style={{ fontSize: '11px', color: '#a16207' }}>▼</span>
            </div>
          </div>
        );
      }

      return (
        <div className="notice-banner">
          <div className="notice-header">
            <span className="notice-title">📢 Notice</span>
            <div className="notice-actions">
              {editing ? (
                <>
                  <button className="notice-btn" onClick={() => { setText(notice?.text || ""); setEditing(false); }}>Cancel</button>
                  <button className="notice-btn save" onClick={() => { onSave(text); setEditing(false); }}>Save</button>
                </>
              ) : (
                <>
                  <button className="notice-btn" onClick={() => setCollapsed(true)}>▲</button>
                  <button className="notice-btn" onClick={() => setEditing(true)}>Edit</button>
                </>
              )}
            </div>
          </div>
          {editing ? (
            <textarea className="notice-textarea" value={text} onChange={e => setText(e.target.value)} autoFocus />
          ) : (
            <div className={`notice-content ${!notice?.text ? 'empty' : ''}`}>{notice?.text || "No notices"}</div>
          )}
        </div>
      );
    };

    // Main App
    const App = () => {
      const [patients, setPatients] = useState([]);
      const [notice, setNotice] = useState({ text: "", updatedAt: null });
      const [search, setSearch] = useState("");
      const [viewFilter, setViewFilter] = useState("All");
      const [addModal, setAddModal] = useState(false);
      const [labModal, setLabModal] = useState(null);
      const [newP, setNewP] = useState({ ward: "Ward 19", bed: "", name: "", diagnosis: "", doctor: "", plan: "", status: "New", mrn: "" });
      const [collapsedWards, setCollapsedWards] = useState({});
      const [syncing, setSyncing] = useState(false);
      const [toast, setToast] = useState(null);
      const syncTimer = useRef(null);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };
      
      const scheduleSync = useCallback(() => {
        setSyncing(true);
        if (syncTimer.current) clearTimeout(syncTimer.current);
        syncTimer.current = setTimeout(() => { pingSheets(); setTimeout(() => setSyncing(false), 1000); }, 500);
      }, []);

      useEffect(() => {
        db.ref('notice').on('value', snap => setNotice(snap.val() || { text: "" }));
        db.ref('patients').on('value', snap => {
          const val = snap.val();
          setPatients(val ? Object.keys(val).map(k => ({ id: k, ...val[k], bed: cleanBed(val[k].bed) })) : []);
        });
        return () => { db.ref('notice').off(); db.ref('patients').off(); };
      }, []);

      const saveNotice = (text) => db.ref('notice').set({ text: text.trim(), updatedAt: Date.now() }).then(() => showToast("✓ Saved"));
      const saveLabs = (id, labs) => db.ref(`patients/${id}/labs`).set(labs).then(() => { showToast("✓ Labs saved"); scheduleSync(); });
      
      const isDup = (ward, name, excludeId) => patients.some(p => p.id !== excludeId && makeKey(p.ward, p.name) === makeKey(ward, name));

      const update = useCallback((id, field, value) => {
        const p = patients.find(x => x.id === id);
        if (field === 'name' && isDup(p?.ward, value, id)) { showToast("⚠️ Duplicate"); return; }
        if (field === 'ward' && isDup(value, p?.name, id)) { showToast("⚠️ Duplicate"); return; }
        db.ref(`patients/${id}`).update({ [field]: field === 'bed' ? cleanBed(value) : value, timestamp: Date.now() }).then(scheduleSync);
      }, [patients, scheduleSync]);

      const del = (id) => confirm("Delete?") && db.ref(`patients/${id}`).remove().then(() => { showToast("✓ Deleted"); pingSheets(); });

      const saveNew = () => {
        const c = { ward: newP.ward || "Unassigned", bed: cleanBed(newP.bed), name: newP.name.trim(), diagnosis: newP.diagnosis, doctor: newP.doctor, status: newP.status || "New", plan: newP.plan, mrn: newP.mrn, timestamp: Date.now() };
        if (!c.name) { alert("Enter name"); return; }
        if (isDup(c.ward, c.name)) { alert("Duplicate"); return; }
        db.ref("patients").push(c).then(() => { setAddModal(false); setNewP({ ward: "Ward 19", bed: "", name: "", diagnosis: "", doctor: "", plan: "", status: "New", mrn: "" }); showToast("✓ Added"); pingSheets(); });
      };

      const groups = useMemo(() => {
        const g = {};
        (viewFilter === 'All' ? patients : patients.filter(p => p.status === viewFilter))
          .filter(p => `${p.name}${p.bed}${p.ward}${p.diagnosis}`.toLowerCase().includes(search.toLowerCase()))
          .forEach(p => { const w = p.ward || "Unassigned"; (g[w] = g[w] || []).push(p); });
        return { g, keys: Object.keys(g).sort((a, b) => WARD_ORDER.indexOf(a) - WARD_ORDER.indexOf(b)) };
      }, [patients, search, viewFilter]);

      const hasLabs = (p) => p.labs && Object.keys(p.labs).some(k => !['updatedAt', 'custom'].includes(k) && p.labs[k]);

      return (
        <div className="wrap">
          <div className="topbar">
            <div className="title">
              <div className="title-row">
                <h1>Unit E</h1>
                <span className={`sync-badge ${syncing ? 'syncing' : 'idle'}`}>{syncing ? '⏳' : '✓'} {patients.length}</span>
              </div>
            </div>
            <div className="actions">
              <button className="btn btn-white" onClick={() => setAddModal(true)}>+ Add</button>
              <button className="btn btn-green" onClick={() => window.open(SHEET_URL, '_blank')}>📊</button>
              <button className="btn btn-blue" onClick={() => { setSyncing(true); pingSheets(); showToast("🔄 Syncing..."); setTimeout(() => setSyncing(false), 2000); }}>🔄</button>
            </div>
          </div>

          <NoticeBanner notice={notice} onSave={saveNotice} />

          <div className="controls-container">
            <div className="filter-row">
              {['All', 'New', 'Chronic', 'Non-Chronic'].map(f => (
                <button key={f} className={`filter-btn ${viewFilter === f ? 'active' : ''}`} onClick={() => setViewFilter(f)}>{f}</button>
              ))}
            </div>
            <input className="search-bar" placeholder="Search..." value={search} onChange={e => setSearch(e.target.value)} />
          </div>

          {groups.keys.map(ward => (
            <div key={ward} className="ward-section">
              <div className="ward-header" onClick={() => setCollapsedWards(p => ({ ...p, [ward]: !p[ward] }))}>
                <div><span className={`arrow ${collapsedWards[ward] ? 'collapsed' : ''}`}>▼</span> {ward}</div>
                <span className="ward-count">{groups.g[ward].length}</span>
              </div>
              <div className={`ward-body ${collapsedWards[ward] ? 'is-hidden' : ''}`}>
                {groups.g[ward].map(p => (
                  <div className="p-card" key={p.id}>
                    <div className="mobile-row col-1">
                      <input className="inp inp-bed" value={p.bed || ''} placeholder="Bed" onChange={e => update(p.id, 'bed', e.target.value)} />
                      <input className="inp inp-doc" value={p.doctor || ''} placeholder="Dr." onChange={e => update(p.id, 'doctor', e.target.value)} />
                    </div>
                    <div className="col-2">
                      <div style={{ display: 'flex', gap: 8 }}>
                        <input className="inp inp-name" value={p.name || ''} placeholder="Name" onChange={e => update(p.id, 'name', e.target.value)} />
                        <input className="inp" style={{ width: '90px' }} value={p.mrn || ''} placeholder="MRN" onChange={e => update(p.id, 'mrn', e.target.value)} />
                      </div>
                      <input className="inp" value={p.diagnosis || ''} placeholder="Diagnosis" onChange={e => update(p.id, 'diagnosis', e.target.value)} />
                    </div>
                    <div className="col-3">
                      <textarea className="inp inp-area" value={p.plan || ''} placeholder="Plan..." onChange={e => update(p.id, 'plan', e.target.value)} />
                    </div>
                    <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                      <button className={`btn-lab ${hasLabs(p) ? 'has-labs' : ''}`} onClick={() => setLabModal(p)}>🧪 Labs</button>
                      <select className={`status-select status-${(p.status || "").toLowerCase().split('-')[0]}`} value={p.status || ""} onChange={e => update(p.id, 'status', e.target.value)}>
                        <option value="">-</option>
                        {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                      <button className="btn-del" onClick={() => del(p.id)}>×</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}

          {addModal && (
            <div className="modalOverlay">
              <div className="modal">
                <div className="modal-head">Add Patient</div>
                <div className="modal-body">
                  <div className="form-group"><label>Ward</label><select className="inp" value={newP.ward} onChange={e => setNewP({ ...newP, ward: e.target.value })}>{WARD_ORDER.map(w => <option key={w}>{w}</option>)}</select></div>
                  <div style={{ display: 'flex', gap: 10 }}>
                    <div className="form-group" style={{ flex: 1 }}><label>Bed</label><input className="inp" value={newP.bed} onChange={e => setNewP({ ...newP, bed: e.target.value })} /></div>
                    <div className="form-group" style={{ flex: 1 }}><label>Doctor</label><input className="inp" value={newP.doctor} onChange={e => setNewP({ ...newP, doctor: e.target.value })} /></div>
                  </div>
                  <div className="form-group"><label>Name</label><input className="inp" value={newP.name} onChange={e => setNewP({ ...newP, name: e.target.value })} /></div>
                  <div style={{ display: 'flex', gap: 10 }}>
                    <div className="form-group" style={{ flex: 1 }}><label>MRN</label><input className="inp" value={newP.mrn} onChange={e => setNewP({ ...newP, mrn: e.target.value })} /></div>
                    <div className="form-group" style={{ flex: 1 }}><label>Status</label><select className="inp" value={newP.status} onChange={e => setNewP({ ...newP, status: e.target.value })}>{STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                  </div>
                  <div className="form-group"><label>Diagnosis</label><input className="inp" value={newP.diagnosis} onChange={e => setNewP({ ...newP, diagnosis: e.target.value })} /></div>
                  <div className="form-group"><label>Plan</label><textarea className="inp inp-area" value={newP.plan} onChange={e => setNewP({ ...newP, plan: e.target.value })} /></div>
                </div>
                <div className="modal-foot">
                  <button className="btn btn-white" onClick={() => setAddModal(false)}>Cancel</button>
                  <button className="btn btn-blue" onClick={saveNew}>Save</button>
                </div>
              </div>
            </div>
          )}

          {labModal && <LabModal patient={labModal} onClose={() => setLabModal(null)} onSave={saveLabs} />}
          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

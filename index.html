        'procalcitonin': 'PCT', 'pct': 'PCT'
    };
    
    // Words to skip (metadata, headers, units)
    const SKIP_PATTERNS = /^(age|sex|gender|patient|name|mrn|id|date|time|page|ref|collected|reported|sample|specimen|hospital|lab|report|doctor|technician|result|value|unit|investigation|normal|range|method|thanks|copyright|generated|drlogy|pathology|primary|serum|plasma|blood|urine|csf|male|female|years?|old|collection|mmol|mg|dl|fl|pg|ul|ml|cells|mm3|10\^|iu|umol|nmol|pmol)/i;
    
    // Find test name in mappings
    const findTest = (name) => {
        const normalized = name.toLowerCase()
            .replace(/[^a-z0-9\s]/g, '')
            .replace(/\s+/g, ' ')
            .trim();
        
        // Direct match
        if (TEST_MAPPINGS[normalized]) return TEST_MAPPINGS[normalized];
        
        // Try without trailing numbers/spaces
        const cleaned = normalized.replace(/\s*\d+$/, '').trim();
        if (TEST_MAPPINGS[cleaned]) return TEST_MAPPINGS[cleaned];
        
        // Try each word
        const words = normalized.split(' ');
        for (const word of words) {
            if (word.length >= 2 && TEST_MAPPINGS[word]) return TEST_MAPPINGS[word];
        }
        
        // Try first two words combined
        if (words.length >= 2) {
            const twoWords = words.slice(0, 2).join(' ');
            if (TEST_MAPPINGS[twoWords]) return TEST_MAPPINGS[twoWords];
        }
        
        // Partial match
        for (const [pattern, mapped] of Object.entries(TEST_MAPPINGS)) {
            if (pattern.length >= 3 && (normalized.includes(pattern) || pattern.includes(normalized))) {
                return mapped;
            }
        }
        
        return null;
    };
    
    // Process each line with multiple patterns
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        
        // Skip metadata lines
        if (SKIP_PATTERNS.test(line)) continue;
        if (/^\d{1,2}[\-\/\.]\d{1,2}[\-\/\.]\d{2,4}/.test(line)) continue; // Date
        if (line.length < 3 || line.length > 80) continue;
        
        // Multiple regex patterns to catch different formats
        const patterns = [
            // Standard table: "Sodium    139    136-145"
            /^([A-Za-z][A-Za-z\s\.\-\(\),]{1,40}?)\s{2,}(\d+\.?\d*)\s*/,
            // With colon: "Sodium: 139"
            /^([A-Za-z][A-Za-z\s\.\-\(\),]{1,35}?)\s*:\s*(\d+\.?\d*)/,
            // Simple: "Na 139"
            /^([A-Za-z][A-Za-z0-9\.\-]{1,15})\s+(\d+\.?\d*)\s*$/,
            // Value first (some reports): "139 Sodium"
            /^(\d+\.?\d*)\s+([A-Za-z][A-Za-z\s]{2,20})$/,
            // Equals: "Sodium = 139"
            /^([A-Za-z][A-Za-z\s\.\-]{1,30}?)\s*=\s*(\d+\.?\d*)/,
            // Tab separated
            /^([A-Za-z][A-Za-z\s\.\-\(\)]{1,35})\t+(\d+\.?\d*)/
        ];
        
        for (const regex of patterns) {
            const match = line.match(regex);
            if (match) {
                let testName, value;
                // Handle value-first pattern
                if (/^\d/.test(match[1])) {
                    value = match[1];
                    testName = match[2];
                } else {
                    testName = match[1];
                    value = match[2];
                }
                
                testName = testName.trim();
                value = value.trim();
                
                // Skip if test name is just numbers or too short
                if (/^\d+$/.test(testName) || testName.length < 2) continue;
                
                const mapped = findTest(testName);
                if (mapped && !seen.has(mapped)) {
                    seen.add(mapped);
                    const numVal = parseFloat(value);
                    if (!isNaN(numVal) && numVal >= 0 && numVal < 100000) {
                        items.push({ test: mapped, value: value, originalName: testName });
                        console.log(`[Parser] ✓ "${testName}" → ${mapped} = ${value}`);
                    }
                }
                break; // Found a match, move to next line
            }
        }
    }
    
    // Aggressive fallback: scan full text for known patterns
    if (items.length < 3) {
        console.log('[Parser] Few items found, running fallback scan...');
        const fullText = text.toLowerCase();
        
        for (const [pattern, mapped] of Object.entries(TEST_MAPPINGS)) {
            if (seen.has(mapped)) continue;
            if (pattern.length < 2) continue;
            
            // Create regex to find test name followed by number
            const escaped = pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(escaped + '[:\\s]+([\\d\\.]+)', 'i');
            const match = text.match(regex);
            
            if (match) {
                const value = match[1];
                const numVal = parseFloat(value);
                if (!isNaN(numVal) && numVal >= 0 && numVal < 100000) {
                    seen.add(mapped);
                    items.push({ test: mapped, value: value, originalName: pattern });
                    console.log(`[Parser] ✓ Fallback: "${pattern}" → ${mapped} = ${value}`);
                }
            }
        }
    }
    
    console.log(`[Parser] Total extracted: ${items.length} values`);
    return items;
};

// ============ IMAGE PREPROCESSING ============
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const luminanceGray = (r, g, b) => (0.2126 * r + 0.7152 * g + 0.0722 * b) | 0;

const boxBlurGray = (gray, w, h) => {
    const out = new Uint8ClampedArray(gray.length);
    const idx = (x, y) => y * w + x;
    for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
            let sum = 0;
            for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) sum += gray[idx(x+dx, y+dy)];
            out[idx(x, y)] = (sum / 9) | 0;
        }
    }
    return out;
};

const otsuThreshold = (gray) => {
    const hist = new Array(256).fill(0);
    for (let i = 0; i < gray.length; i++) hist[gray[i]]++;
    const total = gray.length;
    let sum = 0;
    for (let t = 0; t < 256; t++) sum += t * hist[t];
    let sumB = 0, wB = 0, varMax = 0, threshold = 128;
    for (let t = 0; t < 256; t++) {
        wB += hist[t];
        if (wB === 0) continue;
        const wF = total - wB;
        if (wF === 0) break;
        sumB += t * hist[t];
        const mB = sumB / wB, mF = (sum - sumB) / wF;
        const between = wB * wF * (mB - mF) * (mB - mF);
        if (between > varMax) { varMax = between; threshold = t; }
    }
    return threshold;
};

const applyCropToCanvas = (img, crop) => {
    const c = { top: clamp01(crop?.top ?? 0), bottom: clamp01(crop?.bottom ?? 0), left: clamp01(crop?.left ?? 0), right: clamp01(crop?.right ?? 0) };
    const sx = Math.floor(img.width * c.left), sy = Math.floor(img.height * c.top);
    const sw = Math.floor(img.width * (1 - c.left - c.right)), sh = Math.floor(img.height * (1 - c.top - c.bottom));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, sw); canvas.height = Math.max(1, sh);
    canvas.getContext("2d", { willReadFrequently: true }).drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    return canvas;
};

const preprocessForOCR = async (dataUrl, options = {}) => {
    const { smartCrop = true, manualCrop = null } = options;
    const img = new Image();
    img.src = dataUrl;
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("Failed to load image")); });
    const crop = manualCrop || (smartCrop ? DEFAULT_CROP : { top: 0, bottom: 0, left: 0, right: 0 });
    const croppedCanvas = applyCropToCanvas(img, crop);
    const scale = (croppedCanvas.width < 900 ? 2.2 : 1.8);
    const upCanvas = document.createElement("canvas");
    upCanvas.width = Math.floor(croppedCanvas.width * scale);
    upCanvas.height = Math.floor(croppedCanvas.height * scale);
    const upCtx = upCanvas.getContext("2d", { willReadFrequently: true });
    upCtx.imageSmoothingEnabled = false;
    upCtx.drawImage(croppedCanvas, 0, 0, upCanvas.width, upCanvas.height);
    return { processed: upCanvas.toDataURL("image/png"), cropUsed: crop, skewAngle: 0, threshold: 128 };
};

// ============ TESSERACT OCR ============
let _ocrWorker = null;
let _ocrWorkerReady = false;

const getOcrWorker = async (loggerFn) => {
    if (_ocrWorker && _ocrWorkerReady) return _ocrWorker;
    if (_ocrWorker) { try { await _ocrWorker.terminate(); } catch (e) {} _ocrWorker = null; _ocrWorkerReady = false; }
    try {
        _ocrWorker = await Tesseract.createWorker('eng', 1, { logger: (m) => loggerFn && loggerFn(m) });
        _ocrWorkerReady = true;
        return _ocrWorker;
    } catch (err) { throw err; }
};

// ============ GOOGLE VISION API (FAST) ============
const callVisionAPI = async (dataUrl, options = {}, setProgress, setStage, debugLog) => {
    debugLog && debugLog('info', 'Starting Vision API...');
    setStage && setStage("Analyzing image...");
    setProgress && setProgress(20);
    
    // Extract base64 directly - minimal preprocessing for speed
    let imageData = dataUrl;
    if (imageData.includes(',')) imageData = imageData.split(',')[1];
    
    try {
        setProgress && setProgress(30);
        const response = await fetch(VISION_API_PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'ocr', image: imageData, mode: 'DOCUMENT_TEXT_DETECTION' }),
            redirect: 'follow'
        });
        setProgress && setProgress(80);
        const responseText = await response.text();
        if (!response.ok) throw new Error(`Vision API HTTP ${response.status}`);
        let result;
        try { result = JSON.parse(responseText); } catch { throw new Error(`Failed to parse response`); }
        if (result.error) throw new Error(result.error);
        setProgress && setProgress(95);
        debugLog && debugLog('success', `Vision API returned ${result.text?.length || 0} chars`);
        return { text: result.text || "", confidence: result.confidence || 85, lines: result.lines || [], source: 'google_vision' };
    } catch (err) {
        debugLog && debugLog('error', `Vision API failed: ${err.message}`);
        throw err;
    }
};

// ============ TESSERACT OCR ============
const runTesseractOCR = async (dataUrl, options = {}, setProgress, setStage, debugLog) => {
    debugLog && debugLog('info', 'Starting Tesseract OCR...');
    try {
        setStage && setStage("Preprocessing...");
        setProgress && setProgress(5);
        const pre = await preprocessForOCR(dataUrl, options);
        setStage && setStage("Initializing Tesseract...");
        setProgress && setProgress(10);
        const worker = await getOcrWorker((m) => {
            if (m?.status === "recognizing text" && typeof m.progress === "number") setProgress && setProgress(10 + Math.round(m.progress * 80));
        });
        setStage && setStage("Recognizing text...");
        const result = await worker.recognize(pre.processed);
        setProgress && setProgress(95);
        return { text: result?.data?.text || "", confidence: Number(result?.data?.confidence || 0), lines: [], source: 'tesseract', cropUsed: pre.cropUsed };
    } catch (err) {
        debugLog && debugLog('error', `Tesseract error: ${err.message}`);
        throw err;
    }
};

// ============ SIMPLIFIED OCR (Vision only) ============
const runHybridOCR = async (dataUrl, options = {}, setProgress, setStage, ocrEngine = 'vision', debugLog) => {
    return await callVisionAPI(dataUrl, options, setProgress, setStage, debugLog);
};

const parseLabsFromTextFallback = (text) => {
    const lines = String(text || "").split(/\r?\n/).map(l => l.trim()).filter(l => l);
    const values = [];
    const seen = new Set();
    for (const raw of lines) {
        if (/^(date|time|patient|name|id|mrn)/i.test(raw)) continue;
        const m = raw.match(/^([A-Za-z][A-Za-z0-9%\/\-\s]{1,15}?)\s*[:\.]?\s*([<>-]?\d{1,4}(?:\.\d{1,3})?)/);
        if (!m) continue;
        const testRaw = m[1].trim();
        const valRaw = m[2];
        const key = `${testRaw}|${valRaw}`;
        if (seen.has(key)) continue;
        seen.add(key);
        values.push({ test: testRaw, value: valRaw, flag: 'N', unit: '', confidence: 40, validation: { status: 'unknown' } });
    }
    return values;
};

const redactPHI = (text) => String(text || "").replace(/\b\d{3}-\d{2}-\d{4}\b/g, "███-██-████");

const compressImage = (file, maxWidth = 1600) => {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                
                // Scale down if needed but preserve quality
                if (width > maxWidth) { 
                    height = Math.round((height * maxWidth) / width); 
                    width = maxWidth; 
                }
                
                canvas.width = width; 
                canvas.height = height;
                
                const ctx = canvas.getContext('2d', { alpha: false });
                // White background for consistency
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, width, height);
                // Use better interpolation
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, width, height);
                
                // Use PNG for better text clarity, JPEG for file size
                // PNG is better for OCR but larger
                resolve(canvas.toDataURL('image/jpeg', 0.92));
            };
            img.onerror = () => reject(new Error("Failed to load image"));
            img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error("Failed to read file"));
        reader.readAsDataURL(file);
    });
};

        try {
            const result = await runHybridOCR(
                imgObj.image,
                { smartCrop: true },
                setOcrProgress,
                setOcrStage,
                ocrEngine,
                addDebugLog
            );

            addDebugLog('info', `OCR returned ${result.text?.length || 0} chars, confidence: ${result.confidence}%`);
            console.log('[OCR RAW TEXT]:', result.text?.substring(0, 500));

            let processedValues = [];
            let labType = 'AUTO';
            
            // Use Neural v5 auto-detect
            if (window.LabOCR && window.LabOCR.isReady) {
                addDebugLog('info', 'Processing with Neural v5 (auto-detect)...');
                const rawNeuralInput = parseVisionToNeuralInput(result.text);
                addDebugLog('info', `Parsed ${rawNeuralInput.length} items: ${rawNeuralInput.map(i => i.test + '=' + i.value).join(', ')}`);
                console.log('[PARSER OUTPUT]:', rawNeuralInput);
                
                if (rawNeuralInput.length === 0) {
                    addDebugLog('warn', 'Parser found 0 values! Check raw text format.');
                }
                
                const { results: neuralResults, labType: detected } = window.LabOCR.process(rawNeuralInput);
                labType = detected;
                setDetectedLabType(detected);
                addDebugLog('success', `Auto-detected: ${detected} panel, ${neuralResults.length} processed values`);
                console.log('[NEURAL OUTPUT]:', neuralResults);
                
                processedValues = neuralResults.map(item => ({
                    test: item.test,
                    value: item.value,
                    unit: item.unit || '',
                    flag: item.flag || 'N',
                    confidence: item.confidence || 50,
                    status: item.status,
                    validation: { status: ['OK', 'AUTO_FIX', 'LEARNED'].includes(item.status) ? 'normal' : 'invalid' },
                    rawOcr: item.rawOcr,
                    lowConfidence: item.confidence < 60,
                    corrected: item.corrected,
                    reason: item.reason,
                    refLow: item.refLow,
                    refHigh: item.refHigh,
                    category: item.category
                }));
                
                addDebugLog('success', `Final: ${processedValues.length} values ready for display`);
            } else {
                addDebugLog('warn', 'Neural v5 offline. Using fallback.');
                processedValues = parseLabsFromTextFallback(result.text);
            }

            const avgConfidence = processedValues.length > 0
                ? processedValues.reduce((sum, v) => sum + (v.confidence || 0), 0) / processedValues.length
                : result.confidence;

            updateLabImages(prev => prev.map(x => x.id === imgObj.id ? {
                ...x,
                labType: labType,
                ocr: {
                    text: redactPHI(result.text),
                    values: processedValues,
                    confidence: result.confidence,
                    avgValueConfidence: avgConfidence,
                    updatedAt: Date.now(),
                    source: result.source || 'unknown',
                    labType: labType
                }
            } : x));

            if (processedValues.length === 0) {
                setOcrError("No lab values detected. Try different image or check Debug tab.");
            }

        } catch (e) {
            console.error("OCR ERROR:", e);
            addDebugLog('error', `OCR failed: ${e.message}`);
            setOcrError(e?.message || "OCR failed");
        }
        setOcrBusyId(null);
        setOcrProgress(0);
        setOcrStage("");
    };

    const handleFile = async (file) => {
        if (!file || !file.type.startsWith('image/')) return;
        setUploading(true);
        setOcrError(null);
        addDebugLog('info', `Processing file: ${file.name}`);
        try {
            const compressed = await compressImage(file);
            const newImage = {
                id: Date.now().toString(),
                image: compressed,
                timestamp: Date.now(),
                note: "",
                ocr: { text: "", values: [], confidence: 0, avgValueConfidence: 0, updatedAt: null, source: null, labType: null }
            };
            updateLabImages(prev => [newImage, ...prev]);
            setUploading(false);
            setTimeout(() => runOcrOnImage(newImage), 300);
        } catch (err) {
            addDebugLog('error', `File processing failed: ${err.message}`);
            setOcrError("Failed to process image");
            setUploading(false);
        }
    };

    const handleDrop = (e) => { e.preventDefault(); setDragging(false); const file = e.dataTransfer.files?.[0]; if (file) handleFile(file); };
    const handleFileInput = (e) => { const file = e.target.files?.[0]; if (file) handleFile(file); e.target.value = ''; };
    const updateNote = (id, note) => updateLabImages(prev => prev.map(img => img.id === id ? { ...img, note } : img));
    const deleteImage = (id) => { if (confirm("Delete this lab?")) updateLabImages(prev => prev.filter(img => img.id !== id)); };

    const updateOcrValue = (imgId, test, field, newVal) => {
        updateLabImages(prev => prev.map(img => {
            if (img.id !== imgId) return img;
            const vals = (img.ocr?.values || []).map(v => {
                if (v.test !== test) return v;
                // Learn from correction if value changed
                if (field === 'value' && v.rawOcr && newVal !== v.value && window.LabOCR?.learnCorrection) {
                    window.LabOCR.learnCorrection(test, v.rawOcr, newVal);
                    addDebugLog('info', `Learned: ${test} "${v.rawOcr}" → "${newVal}"`);
                }
                return { ...v, [field]: newVal };
            });
            return { ...img, ocr: { ...img.ocr, values: vals, updatedAt: Date.now() } };
        }));
    };

    const valuesFeed = useMemo(() => {
        return (labImages || []).slice().sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)).map(img => ({
            id: img.id,
            timestamp: img.timestamp,
            note: img.note,
            labType: img.ocr?.labType || img.labType,
            confidence: img.ocr?.confidence || 0,
            avgValueConfidence: img.ocr?.avgValueConfidence || 0,
            values: img.ocr?.values || [],
            rawText: img.ocr?.text || "",
            source: img.ocr?.source || null
        }));
    }, [labImages]);

    const handleSave = () => { 
        console.log('[LabModal] Saving labs for patient:', patient.id, patient.name);
        console.log('[LabModal] Lab images:', labImages.length);
        onSave(patient.id, labImages);
        setHasUnsavedChanges(false);
        onClose(); 
    };
    const getConfidenceClass = (conf) => conf >= 80 ? 'high' : conf >= 60 ? 'med' : 'low';

    return (
        <div className="modalOverlay" onClick={onClose}>
            <div className="modal" onClick={e => e.stopPropagation()}>
                <div className="modal-head">
                    <span>🧪 Labs - {patient.name}</span>
                    <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'white', fontSize: '18px', cursor: 'pointer' }}>×</button>
                </div>
                <div className="modal-body">
                    <div className="tabs">
                        <button className={`tab ${tab === "Values" ? "active" : ""}`} onClick={() => setTab("Values")}>📋 Values</button>
                        <button className={`tab ${tab === "Images" ? "active" : ""}`} onClick={() => setTab("Images")}>🖼 Images</button>
                        <button className={`tab ${tab === "Debug" ? "active" : ""}`} onClick={() => setTab("Debug")}>🔧 Debug</button>
                    </div>

                    <div className="ocr-engine-toggle">

                    </div>

                    {tab === "Debug" && (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                            <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', fontSize: 12, color: '#64748b' }}>
                                <span>Neural v4: <strong style={{ color: window.LabOCR?.isReady ? '#22c55e' : '#ef4444' }}>{window.LabOCR?.isReady ? 'ONLINE' : 'OFFLINE'}</strong></span>
                                <span>Patterns: <strong style={{ color: '#0ff' }}>{window.LabOCR?.getStats?.()?.patterns || 0}</strong></span>
                            </div>
                            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                                <button className="btn btn-white" onClick={() => setDebugLogs([])}>🗑 Clear Logs</button>
                                <button className="btn btn-blue" onClick={() => {
                                    if (window.LabOCR?.clearLearning) {
                                        if (confirm('Clear all learned patterns?')) {
                                            window.LabOCR.clearLearning();
                                            addDebugLog('info', 'Learning cleared');
                                        }
                                    }
                                }}>🧹 Clear Learning</button>
                                <button className="btn btn-green" onClick={() => {
                                    window.testOCR && window.testOCR();
                                    addDebugLog('info', 'Test run - check console');
                                }}>🧪 Test OCR</button>
                            </div>
                            <div style={{ fontSize: 11, color: '#64748b', background: '#f0f9ff', padding: 10, borderRadius: 8 }}>
                                💡 <strong>Learning:</strong> Edit any value manually and the system learns the correction for next time.
                            </div>
                            <div className="debug-panel" style={{ minHeight: 200, maxHeight: 400, overflow: 'auto' }}>
                                {debugLogs.length === 0 ? (
                                    <pre style={{ color: '#64748b' }}>No logs yet.</pre>
                                ) : (
                                    debugLogs.map((log, i) => (
                                        <pre key={i} className={log.type}>[{log.time}] [{log.type.toUpperCase()}] {log.msg}</pre>
                                    ))
                                )}
                            </div>
                        </div>
                    )}

                    {tab !== "Debug" && (
                        <>
                            <div style={{ fontSize: 12, color: '#64748b', background: '#f0f9ff', padding: 10, borderRadius: 8, marginBottom: 8 }}>
                                🧠 <strong>Auto-Detect:</strong> Just upload any lab image - the system automatically identifies tests and corrects values.
                                {detectedLabType && <span style={{ marginLeft: 8, color: '#0d9488', fontWeight: 700 }}>Last: {detectedLabType}</span>}
                            </div>

                            <div className={`add-lab-area ${dragging ? 'dragging' : ''}`} onClick={() => fileRef.current?.click()} onDragOver={e => { e.preventDefault(); setDragging(true); }} onDragLeave={() => setDragging(false)} onDrop={handleDrop}>
                                {uploading ? (<><div className="add-lab-icon">⏳</div><div className="add-lab-text">Processing...</div></>) : (<><div className="add-lab-icon">📷</div><div className="add-lab-text">Add Lab Image</div><div className="add-lab-hint">Tap to scan</div></>)}
                            </div>
                            <div style={{ display: 'flex', gap: 8, justifyContent: 'center' }}>
                                <button className="btn btn-blue" onClick={() => cameraRef.current?.click()}>📸 Camera</button>
                                <button className="btn btn-white" onClick={() => fileRef.current?.click()}>📁 Gallery</button>
                            </div>
                            <input ref={fileRef} type="file" accept="image/*" onChange={handleFileInput} style={{ display: 'none' }} />
                            <input ref={cameraRef} type="file" accept="image/*" capture="environment" onChange={handleFileInput} style={{ display: 'none' }} />

                            {ocrError && <div className="ocr-error">⚠ {ocrError}</div>}
                            {ocrBusyId && (
                                <div className="ocr-progress vision">
                                    <div className="ocr-progress-bar"><div className="ocr-progress-fill" style={{ width: `${ocrProgress}%` }}></div></div>
                                    <div className="ocr-progress-text"><span>🔎 {ocrStage}</span><span>{ocrProgress}%</span></div>
                                </div>
                            )}
                        </>
                    )}

                    {tab === "Values" && (valuesFeed.length === 0 ? (
                        <div className="empty-labs"><div className="empty-labs-icon">🔬</div><div>No labs yet. Add a photo.</div></div>
                    ) : (
                        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                            {valuesFeed.map(item => {
                                const { date, time } = formatDateTime(item.timestamp);
                                const hasVals = (item.values || []).length > 0;
                                const confClass = getConfidenceClass(item.avgValueConfidence || item.confidence);
                                const isVision = item.source === 'google_vision';
                                return (
                                    <div key={item.id} className="lab-values-card">
                                        <div className={`lab-values-head ${isVision ? 'vision' : ''}`}>
                                            <div>
                                                <div className="lab-values-title">{date} • {time}</div>
                                                <div className="lab-values-sub">
                                                    {item.labType && <span style={{ background: 'rgba(255,255,255,0.2)', padding: '2px 6px', borderRadius: 4, marginRight: 6 }}>{item.labType}</span>}
                                                    {item.note || ''}
                                                </div>
                                            </div>
                                            <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                                                <span className={`pill ${isVision ? 'vision' : 'tesseract'}`}>{isVision ? '🌐 Vision' : '📱 Tesseract'}</span>
                                                <span className={`pill ${confClass}-conf`}>{Math.round(item.avgValueConfidence || item.confidence)}%</span>
                                                <span className="pill">{hasVals ? `${item.values.length} values` : "—"}</span>
                                                <button className="lab-image-btn" onClick={() => setShowRawText(showRawText === item.id ? null : item.id)}>{showRawText === item.id ? '🔼' : '🔽'} Raw</button>
                                                <button className="lab-image-btn" onClick={() => { const img = labImages.find(x => x.id === item.id); if (img) runOcrOnImage(img); }}>🔁</button>
                                            </div>
                                        </div>
                                        {showRawText === item.id && <div className="raw-text-panel"><pre>{item.rawText || "(empty)"}</pre></div>}
                                        <div className="lab-values-body">
                                            {!hasVals ? <div style={{ color: "#94a3b8", fontWeight: 600 }}>No values detected.</div> : (
                                                <div className="kv-grid">
                                                    {item.values.map(v => (
                                                        <div key={v.test} className={`kv ${v.validation?.status === 'invalid' ? 'invalid' : ''}`}>
                                                            <div className="k">
                                                                {v.test}
                                                                {v.category && <span style={{ fontSize: 8, background: '#e2e8f0', color: '#475569', padding: '1px 4px', borderRadius: 3, marginLeft: 4 }}>{v.category}</span>}
                                                                <span className={`confidence-dot ${getConfidenceClass(v.confidence)}`} title={`${Math.round(v.confidence)}%`}></span>
                                                                {v.status === 'LEARNED' && <span style={{ background: '#0ff', color: '#000', fontWeight: 900, fontSize: 9, padding: '1px 4px', borderRadius: 4 }}>LEARNED</span>}
                                                                {v.status === 'AUTO_FIX' && <span style={{ color: "#f59e0b", fontWeight: 900, fontSize: 10 }}>FIXED {v.reason}</span>}
                                                                {v.lowConfidence && <span style={{ color: "#b45309", fontWeight: 900, fontSize: 11 }}>⚠</span>}
                                                            </div>
                                                            <div className="v">
                                                                <input value={v.value || ""} onChange={e => updateOcrValue(item.id, v.test, 'value', e.target.value)} />
                                                                <span className="u">{v.unit || ""}</span>
                                                                <span className={`flag ${v.flag || "N"}`}>{v.flag || "N"}</span>
                                                            </div>
                                                            {(v.refLow || v.refHigh) && <div style={{ marginTop: 6, fontSize: 11, color: "#64748b", fontWeight: 600 }}>Ref: {v.refLow} – {v.refHigh}</div>}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                        <div className="ocr-stats">
                                            <div className="ocr-stat">Source: <span className={isVision ? 'vision' : ''}>{item.source || "—"}</span></div>
                                            <div className="ocr-stat">Confidence: <span>{Math.round(item.confidence)}%</span></div>
                                        </div>
                                        
                                        {/* Interpret Button */}
                                        {hasVals && (
                                            <button 
                                                onClick={() => interpretLab(item.id, item.values)}
                                                style={{
                                                    width: '100%',
                                                    padding: '10px',
                                                    marginTop: '8px',
                                                    background: showInterpretation[item.id] ? '#6366f1' : 'linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%)',
                                                    color: 'white',
                                                    border: 'none',
                                                    borderRadius: '8px',
                                                    fontWeight: 700,
                                                    cursor: 'pointer',
                                                    display: 'flex',
                                                    alignItems: 'center',
                                                    justifyContent: 'center',
                                                    gap: '8px'
                                                }}
                                            >
                                                🏥 {showInterpretation[item.id] ? 'Hide Interpretation' : 'Interpret Results'}
                                            </button>
                                        )}

                                        {/* Interpretation Panel */}
                                        {showInterpretation[item.id] && (
                                            <div style={{ marginTop: 12, background: '#f0f9ff', border: '2px solid #0ea5e9', borderRadius: 12, overflow: 'hidden' }}>
                                                {/* Header */}
                                                <div style={{ background: 'linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%)', padding: 12, color: 'white' }}>
                                                    <div style={{ fontWeight: 800, fontSize: 14 }}>📋 PRELIMINARY CLINICAL INTERPRETATION</div>
                                                    <div style={{ fontSize: 10, opacity: 0.9, marginTop: 4 }}>⚠️ Requires clinical correlation by qualified healthcare provider</div>
                                                </div>
                                                
                                                {/* Summary Stats */}
                                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 6, padding: 10 }}>
                                                    <div style={{ background: '#fee2e2', padding: 8, borderRadius: 6, textAlign: 'center' }}>
                                                        <div style={{ fontSize: 18, fontWeight: 800, color: '#dc2626' }}>{showInterpretation[item.id].summary.critical}</div>
                                                        <div style={{ fontSize: 9, color: '#991b1b', fontWeight: 700 }}>CRITICAL</div>
                                                    </div>
                                                    <div style={{ background: '#fef3c7', padding: 8, borderRadius: 6, textAlign: 'center' }}>
                                                        <div style={{ fontSize: 18, fontWeight: 800, color: '#d97706' }}>{showInterpretation[item.id].summary.abnormal}</div>
                                                        <div style={{ fontSize: 9, color: '#92400e', fontWeight: 700 }}>ABNORMAL</div>
                                                    </div>
                                                    <div style={{ background: '#d1fae5', padding: 8, borderRadius: 6, textAlign: 'center' }}>
                                                        <div style={{ fontSize: 18, fontWeight: 800, color: '#059669' }}>{showInterpretation[item.id].summary.normal}</div>
                                                        <div style={{ fontSize: 9, color: '#065f46', fontWeight: 700 }}>NORMAL</div>
                                                    </div>
                                                    <div style={{ background: '#e0e7ff', padding: 8, borderRadius: 6, textAlign: 'center' }}>
                                                        <div style={{ fontSize: 18, fontWeight: 800, color: '#4f46e5' }}>{showInterpretation[item.id].summary.total}</div>
                                                        <div style={{ fontSize: 9, color: '#3730a3', fontWeight: 700 }}>TOTAL</div>
                                                    </div>
                                                </div>

                                                {/* Clinical Patterns */}
                                                {showInterpretation[item.id].patterns?.length > 0 && (
                                                    <div style={{ padding: '0 10px 10px' }}>
                                                        <div style={{ fontWeight: 700, color: '#92400e', fontSize: 11, marginBottom: 6 }}>⚡ CLINICAL PATTERNS</div>
                                                        {showInterpretation[item.id].patterns.map((p, i) => (
                                                            <div key={i} style={{ background: p.priority === 'CRITICAL' ? '#fee2e2' : '#fff', padding: 8, borderRadius: 6, marginBottom: 6, border: '1px solid #e2e8f0' }}>
                                                                <div style={{ fontWeight: 700, fontSize: 12, color: p.priority === 'CRITICAL' ? '#dc2626' : '#1e40af' }}>
                                                                    {p.priority === 'CRITICAL' ? '🔴 ' : '🔵 '}{p.name}
                                                                </div>
                                                                <div style={{ fontSize: 11, color: '#475569', marginTop: 2 }}>{p.interpretation}</div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}

                                                {/* Abnormal Values Detail */}
                                                {Object.values(showInterpretation[item.id].processed).filter(v => v.flag !== 'N' && v.flag !== '?').length > 0 && (
                                                    <div style={{ padding: '0 10px 10px' }}>
                                                        <div style={{ fontWeight: 700, color: '#1e40af', fontSize: 11, marginBottom: 6 }}>📊 ABNORMAL VALUES</div>
                                                        {Object.values(showInterpretation[item.id].processed).filter(v => v.flag !== 'N' && v.flag !== '?').map((v, i) => (
                                                            <div key={i} style={{ background: v.flag.includes('H') ? '#fef3c7' : '#dbeafe', padding: 8, borderRadius: 6, marginBottom: 6 }}>
                                                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                                                    <span style={{ fontWeight: 700, fontSize: 12 }}>{v.name}</span>
                                                                    <span style={{ fontWeight: 800, color: v.status.includes('CRITICAL') ? '#dc2626' : v.flag.includes('H') ? '#d97706' : '#2563eb' }}>
                                                                        {v.value} {v.unit} {v.flag.includes('H') ? '↑' : '↓'}
                                                                    </span>
                                                                </div>
                                                                <div style={{ fontSize: 10, color: '#64748b' }}>Ref: {v.reference} {v.unit}</div>
                                                                <div style={{ fontSize: 11, color: '#334155', marginTop: 4, fontStyle: 'italic' }}>{v.interpretation}</div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}

                                                {/* Disclaimer */}
                                                <div style={{ background: '#fef3c7', padding: 10, fontSize: 10, color: '#92400e', borderTop: '1px solid #f59e0b' }}>
                                                    <strong>⚕️ DISCLAIMER:</strong> This is a PRELIMINARY interpretation. All findings require clinical correlation. Reference: Harrison's Principles of Internal Medicine, WHO Guidelines.
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    ))}

                    {tab === "Images" && (labImages.length === 0 ? (
                        <div className="empty-labs"><div className="empty-labs-icon">🔬</div><div>No lab images yet.</div></div>
                    ) : (
                        <div className="lab-images-grid">
                            {labImages.map((lab, idx) => {
                                const { date, time } = formatDateTime(lab.timestamp);
                                const count = (lab.ocr?.values || []).length;
                                const isVision = lab.ocr?.source === 'google_vision';
                                return (
                                    <div key={lab.id} className="lab-image-card">
                                        <div className="lab-image-header" style={isVision ? { background: 'linear-gradient(135deg, #4285f4 0%, #34a853 100%)' } : {}}>
                                            <div><div className="lab-image-date">{date}</div><div className="lab-image-time">{time} {count ? `• ${count} values` : ""}</div></div>
                                            <div className="lab-image-actions">
                                                <button className="lab-image-btn" onClick={() => runOcrOnImage(lab)}>🔎</button>
                                                <button className="lab-image-btn delete" onClick={() => deleteImage(lab.id)}>🗑</button>
                                            </div>
                                        </div>
                                        <div className="lab-image-container" onClick={() => setViewerIndex(idx)}><img src={lab.image} alt="Lab" /></div>
                                        <div className="lab-image-note"><input type="text" placeholder="Add note..." value={lab.note || ""} onChange={e => updateNote(lab.id, e.target.value)} /></div>
                                    </div>
                                );
                            })}
                        </div>
                    ))}
                </div>
                <div className="modal-foot">
                    <button className="btn btn-white" onClick={onClose}>Cancel</button>
                    <button className="btn" style={{ background: 'var(--purple)', color: 'white' }} onClick={handleSave}>Save ({labImages.length})</button>
                </div>
            </div>
            {viewerIndex !== null && <ImageViewer images={labImages} currentIndex={viewerIndex} onClose={() => setViewerIndex(null)} />}
        </div>
    );
};

const NoticeBanner = ({ notice, onSave }) => {
    const [editing, setEditing] = useState(false);
    const [collapsed, setCollapsed] = useState(false);
    const [text, setText] = useState(notice?.text || "");
    useEffect(() => setText(notice?.text || ""), [notice?.text]);
    if (collapsed) return (<div className="notice-banner notice-collapsed" onClick={() => setCollapsed(false)}><div className="notice-header"><span className="notice-title">📢 Notice</span><span style={{ fontSize: '11px', color: '#a16207' }}>▼</span></div></div>);
    return (
        <div className="notice-banner">
            <div className="notice-header">
                <span className="notice-title">📢 Notice</span>
                <div className="notice-actions">
                    {editing ? (<><button className="notice-btn" onClick={() => { setText(notice?.text || ""); setEditing(false); }}>Cancel</button><button className="notice-btn save" onClick={() => { onSave(text); setEditing(false); }}>Save</button></>) : (<><button className="notice-btn" onClick={() => setCollapsed(true)}>▲</button><button className="notice-btn" onClick={() => setEditing(true)}>Edit</button></>)}
                </div>
            </div>
            {editing ? <textarea className="notice-textarea" value={text} onChange={e => setText(e.target.value)} autoFocus /> : <div className={`notice-content ${!notice?.text ? 'empty' : ''}`}>{notice?.text || "No notices"}</div>}
        </div>
    );
};

const App = () => {
    const [patients, setPatients] = useState([]);
    const [notice, setNotice] = useState({ text: "", updatedAt: null });
    const [search, setSearch] = useState("");
    const [viewFilter, setViewFilter] = useState("All");
    const [addModal, setAddModal] = useState(false);
    const [labModal, setLabModal] = useState(null);
    const [newP, setNewP] = useState({ ward: "Ward 19", bed: "", name: "", diagnosis: "", doctor: "", plan: "", status: "New", mrn: "" });
    const [collapsedWards, setCollapsedWards] = useState({});
    const [syncing, setSyncing] = useState(false);
    const [toast, setToast] = useState(null);
    const syncTimer = useRef(null);

    const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };
    const scheduleSync = useCallback(() => { setSyncing(true); if (syncTimer.current) clearTimeout(syncTimer.current); syncTimer.current = setTimeout(() => { pingSheets(); setTimeout(() => setSyncing(false), 1000); }, 500); }, []);

    useEffect(() => {
        db.ref('notice').on('value', snap => setNotice(snap.val() || { text: "" }));
        db.ref('patients').on('value', snap => { const val = snap.val(); setPatients(val ? Object.keys(val).map(k => ({ id: k, ...val[k], bed: cleanBed(val[k].bed) })) : []); });
        return () => { db.ref('notice').off(); db.ref('patients').off(); };
    }, []);

    const saveNotice = (text) => db.ref('notice').set({ text: text.trim(), updatedAt: Date.now() }).then(() => showToast("✓ Saved")).catch(e => { console.error('Save notice error:', e); showToast("❌ Save failed"); });
    const saveLabImages = (patientId, labImages) => {
        console.log('[Save] ═══════════════════════════════════════');
        console.log('[Save] Patient ID:', patientId);
        console.log('[Save] Total images:', labImages.length);
        
        if (!patientId) {
            console.error('[Save] ERROR: No patient ID!');
            showToast("❌ Save failed: No patient ID");
            return Promise.reject(new Error('No patient ID'));
        }
        
        // Clean up labImages before saving
        const cleanImages = labImages.map((img, idx) => {
            const clean = {
                id: img.id || Date.now().toString() + idx,
                image: img.image,
                timestamp: img.timestamp || Date.now(),
                note: img.note || '',
                labType: img.labType || img.ocr?.labType || 'AUTO',
                ocr: img.ocr ? {
                    text: (img.ocr.text || '').substring(0, 5000), // Limit text size
                    values: (img.ocr.values || []).slice(0, 50).map(v => ({
                        test: v.test,
                        value: v.value,
                        unit: v.unit || '',
                        flag: v.flag || 'N',
                        refLow: v.refLow,
                        refHigh: v.refHigh,
                        category: v.category,
                        confidence: v.confidence
                    })),
                    confidence: img.ocr.confidence || 0,
                    avgValueConfidence: img.ocr.avgValueConfidence || 0,
                    source: img.ocr.source || 'unknown',
                    labType: img.ocr.labType || 'AUTO'
                } : null
            };
            console.log(`[Save] Image ${idx + 1}: ${clean.ocr?.values?.length || 0} values`);
            return clean;
        });
        
        console.log('[Save] Cleaned images ready, writing to Firebase...');
        
        return db.ref(`patients/${patientId}/labImages`).set(cleanImages)
            .then(() => { 
                console.log('[Save] ✓ SUCCESS - Labs saved to Firebase'); 
                showToast("✓ Labs saved"); 
                // Don't schedule sync immediately to avoid race conditions
                setTimeout(scheduleSync, 1000);
            })
            .catch(e => { 
                console.error('[Save] ✗ FAILED:', e); 
                showToast("❌ Save failed: " + e.message);
                throw e;
            });
    };
    const isDup = (ward, name, excludeId) => patients.some(p => p.id !== excludeId && makeKey(p.ward, p.name) === makeKey(ward, name));
    const update = useCallback((id, field, value) => { const p = patients.find(x => x.id === id); if (field === 'name' && isDup(p?.ward, value, id)) { showToast("⚠ Duplicate"); return; } if (field === 'ward' && isDup(value, p?.name, id)) { showToast("⚠ Duplicate"); return; } db.ref(`patients/${id}`).update({ [field]: field === 'bed' ? cleanBed(value) : value, timestamp: Date.now() }).then(scheduleSync); }, [patients, scheduleSync]);
    const del = (id) => confirm("Delete?") && db.ref(`patients/${id}`).remove().then(() => { showToast("✓ Deleted"); pingSheets(); });
    const saveNew = () => { const c = { ward: newP.ward || "Unassigned", bed: cleanBed(newP.bed), name: newP.name.trim(), diagnosis: newP.diagnosis, doctor: newP.doctor, status: newP.status || "New", plan: newP.plan, mrn: newP.mrn, timestamp: Date.now(), labImages: [] }; if (!c.name) { alert("Enter name"); return; } if (isDup(c.ward, c.name)) { alert("Duplicate"); return; } db.ref("patients").push(c).then(() => { setAddModal(false); setNewP({ ward: "Ward 19", bed: "", name: "", diagnosis: "", doctor: "", plan: "", status: "New", mrn: "" }); showToast("✓ Added"); pingSheets(); }); };
    const groups = useMemo(() => { const g = {}; (viewFilter === 'All' ? patients : patients.filter(p => p.status === viewFilter)).filter(p => `${p.name}${p.bed}${p.ward}${p.diagnosis}`.toLowerCase().includes(search.toLowerCase())).forEach(p => { const w = p.ward || "Unassigned"; (g[w] = g[w] || []).push(p); }); return { g, keys: Object.keys(g).sort((a, b) => WARD_ORDER.indexOf(a) - WARD_ORDER.indexOf(b)) }; }, [patients, search, viewFilter]);
    const getLabCount = (p) => (p.labImages || []).length;

    return (
        <div className="wrap">
            <div className="topbar">
                <div className="title"><div className="title-row"><h1>Unit E</h1><span className={`sync-badge ${syncing ? 'syncing' : 'idle'}`}>{syncing ? '⏳' : '✓'} {patients.length}</span></div></div>
                <div className="actions">
                    <button className="btn btn-white" onClick={() => setAddModal(true)}>+ Add</button>
                    <button className="btn btn-green" onClick={() => window.open(SHEET_URL, '_blank')}>📊</button>
                    <button className="btn btn-blue" onClick={() => { setSyncing(true); pingSheets(); showToast("🔄 Syncing..."); setTimeout(() => setSyncing(false), 2000); }}>🔄</button>
                </div>
            </div>
            <NoticeBanner notice={notice} onSave={saveNotice} />
            <div className="controls-container">
                <div className="filter-row">{['All', 'New', 'Chronic', 'Non-Chronic'].map(f => (<button key={f} className={`filter-btn ${viewFilter === f ? 'active' : ''}`} onClick={() => setViewFilter(f)}>{f}</button>))}</div>
                <input className="search-bar" placeholder="Search patients..." value={search} onChange={e => setSearch(e.target.value)} />
            </div>
            {groups.keys.map(ward => (
                <div key={ward} className="ward-section">
                    <div className="ward-header" onClick={() => setCollapsedWards(p => ({ ...p, [ward]: !p[ward] }))}><div><span className={`arrow ${collapsedWards[ward] ? 'collapsed' : ''}`}>▼</span> {ward}</div><span className="ward-count">{groups.g[ward].length}</span></div>
                    <div className={`ward-body ${collapsedWards[ward] ? 'is-hidden' : ''}`}>
                        {groups.g[ward].map(p => (
                            <div className="p-card" key={p.id}>
                                <div className="mobile-row col-1"><input className="inp inp-bed" value={p.bed || ''} placeholder="Bed" onChange={e => update(p.id, 'bed', e.target.value)} /><input className="inp inp-doc" value={p.doctor || ''} placeholder="Dr." onChange={e => update(p.id, 'doctor', e.target.value)} /></div>
                                <div className="col-2"><div style={{ display: 'flex', gap: 8 }}><input className="inp inp-name" value={p.name || ''} placeholder="Name" onChange={e => update(p.id, 'name', e.target.value)} /><input className="inp" style={{ width: '90px' }} value={p.mrn || ''} placeholder="MRN" onChange={e => update(p.id, 'mrn', e.target.value)} /></div><input className="inp" value={p.diagnosis || ''} placeholder="Diagnosis" onChange={e => update(p.id, 'diagnosis', e.target.value)} /></div>
                                <div className="col-3"><textarea className="inp inp-area" value={p.plan || ''} placeholder="Plan..." onChange={e => update(p.id, 'plan', e.target.value)} /></div>
                                <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                                    <button className={`btn-lab ${getLabCount(p) > 0 ? 'has-labs' : ''}`} onClick={() => setLabModal(p)}>🧪 Labs {getLabCount(p) > 0 && <span className="lab-count">{getLabCount(p)}</span>}</button>
                                    <select className={`status-select status-${(p.status || "").toLowerCase().split('-')[0]}`} value={p.status || ""} onChange={e => update(p.id, 'status', e.target.value)}><option value="">-</option>{STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}</select>
                                    <button className="btn-del" onClick={() => del(p.id)}>×</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            ))}
            {addModal && (
                <div className="modalOverlay">
                    <div className="modal" style={{ maxWidth: '450px' }}>
                        <div className="modal-head" style={{ background: 'var(--green)' }}>Add Patient</div>
                        <div className="modal-body">
                            <div><label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>Ward</label><select className="inp" value={newP.ward} onChange={e => setNewP({ ...newP, ward: e.target.value })}>{WARD_ORDER.map(w => <option key={w}>{w}</option>)}</select></div>
                            <div style={{ display: 'flex', gap: 10 }}><div style={{ flex: 1 }}><label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>Bed</label><input className="inp" value={newP.bed} onChange={e => setNewP({ ...newP, bed: e.target.value })} /></div><div style={{ flex: 1 }}><label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>Doctor</label><input className="inp" value={newP.doctor} onChange={e => setNewP({ ...newP, doctor: e.target.value })} /></div></div>
                            <div><label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>Name</label><input className="inp" value={newP.name} onChange={e => setNewP({ ...newP, name: e.target.value })} /></div>
                            <div style={{ display: 'flex', gap: 10 }}><div style={{ flex: 1 }}><label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>MRN</label><input className="inp" value={newP.mrn} onChange={e => setNewP({ ...newP, mrn: e.target.value })} /></div><div style={{ flex: 1 }}><label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>Status</label><select className="inp" value={newP.status} onChange={e => setNewP({ ...newP, status: e.target.value })}>{STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}</select></div></div>
                            <div><label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>Diagnosis</label><input className="inp" value={newP.diagnosis} onChange={e => setNewP({ ...newP, diagnosis: e.target.value })} /></div>
                            <div><label style={{ fontSize: 11, fontWeight: 800, color: "#64748b", textTransform: "uppercase" }}>Plan</label><textarea className="inp inp-area" value={newP.plan} onChange={e => setNewP({ ...newP, plan: e.target.value })} /></div>
                        </div>
                        <div className="modal-foot"><button className="btn btn-white" onClick={() => setAddModal(false)}>Cancel</button><button className="btn btn-blue" onClick={saveNew}>Save</button></div>
                    </div>
                </div>
            )}
            {labModal && <LabModal patient={labModal} onClose={() => setLabModal(null)} onSave={saveLabImages} />}
            {toast && <div className="toast">{toast}</div>}
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Unit E Ward Rounds</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script crossorigin src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  
  <script crossorigin src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script crossorigin src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    :root{ --green:#15803d; --blue:#1e40af; --bg:#f1f5f9; --text:#0f172a; --border:#cbd5e1; }
    body{ margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); padding-bottom:80px; }
    .wrap{ max-width:1200px; margin:0 auto; padding:10px; }
    
    /* ERROR BOX */
    #error-log { display:none; background:#fee2e2; color:#b91c1c; padding:15px; border-radius:8px; border:1px solid #fca5a5; margin:20px; font-family:monospace; white-space:pre-wrap; }

    /* UI ELEMENTS */
    .topbar{ background:var(--green); color:white; padding:12px 16px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); }
    .title h1{ margin:0; font-size:18px; font-weight:800; }
    
    .actions{ display:flex; gap:8px; flex-wrap:wrap; }
    .btn{ border:none; border-radius:6px; padding:8px 12px; font-weight:600; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:0.1s; box-shadow:0 1px 2px rgba(0,0,0,0.05); }
    .btn:active{ transform:translateY(1px); }
    .btn-white{ background:white; color:var(--green); }
    .btn-ghost{ background:rgba(255,255,255,0.2); color:white; border:1px solid rgba(255,255,255,0.3); }
    .btn-red{ background:#fee2e2; color:#b91c1c; }
    .btn-blue{ background:#dbeafe; color:var(--blue); }

    .search-bar{ width:100%; padding:12px; border:1px solid var(--border); border-radius:8px; font-size:15px; margin-bottom:16px; outline:none; }
    .search-bar:focus{ border-color:var(--green); ring:2px solid var(--green); }

    /* WARD & CARDS */
    .ward-section{ background:white; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:20px; }
    .ward-header{ background:var(--blue); color:white; padding:10px 16px; font-weight:700; font-size:14px; display:flex; justify-content:space-between; }
    
    .p-card{ padding:12px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:10px; }
    .p-card:last-child{ border-bottom:none; }
    
    /* INPUTS */
    .inp{ width:100%; padding:8px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px; background:#f8fafc; font-family:inherit; }
    .inp:focus{ background:white; border-color:var(--green); outline:none; }
    .inp-bed{ width:70px; font-weight:800; text-align:center; color:var(--blue); background:#eff6ff; }
    .inp-name{ font-weight:700; font-size:15px; }
    .inp-doc{ width:120px; font-size:12px; font-weight:600; color:#64748b; }
    .inp-area{ min-height:50px; resize:vertical; }

    .btn-del{ width:30px; height:30px; border-radius:6px; background:#fef2f2; color:#ef4444; border:1px solid #fee2e2; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; }

    /* MODAL */
    .modalOverlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100; padding:15px; }
    .modal{ background:white; width:100%; max-width:500px; border-radius:12px; display:flex; flex-direction:column; max-height:80vh; overflow:hidden; }
    .modal-head{ background:var(--green); padding:16px; color:white; font-weight:bold; }
    .modal-body{ padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
    .form-row{ display:flex; gap:10px; }
    .form-group{ flex:1; }
    .form-group label{ font-size:11px; font-weight:700; color:#64748b; text-transform:uppercase; margin-bottom:4px; display:block; }
    .modal-foot{ padding:16px; background:#f8fafc; border-top:1px solid #eee; display:flex; justify-content:flex-end; gap:10px; }

    /* RESPONSIVE */
    @media(min-width: 768px){
      .p-card{ flex-direction:row; align-items:flex-start; gap:16px; }
      .col-1{ width:140px; display:flex; flex-direction:column; gap:8px; }
      .col-2{ flex:1; display:flex; flex-direction:column; gap:8px; }
      .col-3{ width:280px; display:flex; flex-direction:column; gap:8px; }
    }
    @media(max-width: 767px){
      .mobile-row{ display:flex; gap:10px; }
    }
  </style>
</head>
<body>

  <div id="error-log"></div>

  <div id="root"></div>

  <script>
    // Global Error Handler
    window.onerror = function(msg, url, line, col, error) {
      const log = document.getElementById('error-log');
      log.style.display = 'block';
      log.textContent += `Error: ${msg}\nLine: ${line}\n\n`;
      return false; 
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- YOUR MASTER DATA (From JSON) ---
    const MASTER_DATA = [
      { ward:"Ward 19", bed:"12-2", name:"Shady", diagnosis:"CAP", doctor:"Noura", plan:"" },
      { ward:"Ward 19", bed:"17-1", name:"Wael", diagnosis:"Post arrest", doctor:"Lwtwa", plan:"" },
      { ward:"Ward 20", bed:"17-1", name:"Nawaf", diagnosis:"Chest infection", doctor:"Bader", plan:"" },
      { ward:"Ward 20", bed:"11-1", name:"Iskander", diagnosis:"Infective endocarditis", doctor:"Ahmad", plan:"" },
      { ward:"Ward 20", bed:"20-1", name:"Hameed", diagnosis:"Symptomatic anemia", doctor:"Aziz", plan:"" },
      { ward:"Ward 20", bed:"12-1", name:"Dynamete", diagnosis:"AKI", doctor:"Aziz", plan:"" },
      { ward:"Ward 21", bed:"13-1", name:"Mohammad", diagnosis:"CAP/AKI", doctor:"Mohammed", plan:"" },
      { ward:"Ward 21", bed:"14-1", name:"Oiuutlah", diagnosis:"ICH", doctor:"Lutwa", plan:"" },
      { ward:"Ward 21", bed:"14-2", name:"Raju", diagnosis:"Ischemic stroke", doctor:"Zahra", plan:"" },
      { ward:"Ward 21", bed:"20-1", name:"Mohammed", diagnosis:"CVA within window", doctor:"Mohammed", plan:"" },
      { ward:"Ward 27", bed:"", name:"Jassim Mohd", diagnosis:"CVA out of window", doctor:"Noura", plan:"" },
      { ward:"Ward 5", bed:"16", name:"Mohammed Haji", diagnosis:"Sepsis Aki", doctor:"Bader", plan:"" },
      { ward:"Ward 5", bed:"7", name:"Yousef", diagnosis:"Dizziness", doctor:"Ahmed", plan:"" },
      { ward:"ER", bed:"", name:"Mohammed", diagnosis:"TIA", doctor:"Shrouq", plan:"" },
      { ward:"ER", bed:"", name:"Lawla", diagnosis:"Angioedema", doctor:"Lulwa", plan:"" },
      { ward:"Ward 19", bed:"1", name:"Abdullatif", diagnosis:"CVA", doctor:"Lutwa", plan:"" },
      { ward:"Ward 19", bed:"15-1", name:"Abdulla", diagnosis:"Urosepsis, hyperNa", doctor:"Bader", plan:"" },
      { ward:"Ward 20", bed:"5", name:"Anwar", diagnosis:"Quadriplegia", doctor:"Zahra", plan:"" },
      { ward:"Ward 20", bed:"14-2", name:"Hasan", diagnosis:"LVF", doctor:"Mohammed", plan:"" },
      { ward:"Ward 20", bed:"14-1", name:"Mohamed", diagnosis:"UTI, weight loss", doctor:"Noura", plan:"" },
      { ward:"Ward 21", bed:"8", name:"Abdulmohsen", diagnosis:"Drug overdose", doctor:"Mohammed", plan:"" },
      { ward:"Ward 22", bed:"5", name:"Haidar", diagnosis:"CVA", doctor:"Ahmad", plan:"" },
      { ward:"Ward 22", bed:"13-2", name:"Haraka Man", diagnosis:"ICH", doctor:"Bader", plan:"" },
      { ward:"Ward 27", bed:"6", name:"Ishaq", diagnosis:"AP, urosepsis", doctor:"Aziz", plan:"" }
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyCTUw2zpoz_lgMrDCt00CsudqvZgGu4xko",
      authDomain: "unit-e-1d07b.firebaseapp.com",
      databaseURL: "https://unit-e-1d07b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "unit-e-1d07b",
      storageBucket: "unit-e-1d07b.firebasestorage.app",
      messagingSenderId: "465930916258",
      appId: "1:465930916258:web:0ec4d478bb3d6d7bd262fb"
    };

    let db;
    try {
      if(window.firebase && !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      }
    } catch(e) { console.error("Firebase Error", e); }

    const clean = v => (v||"").toString().trim();
    const WARD_ORDER = ["Ward 19", "Ward 20", "Ward 21", "Ward 22", "Ward 27", "Ward 5", "Ward 10", "ICU", "ER", "Unassigned"];

    const sortPatients = (a, b) => {
      const na = parseInt(a.bed), nb = parseInt(b.bed);
      if(!isNaN(na) && !isNaN(nb)) return na - nb;
      return clean(a.bed).localeCompare(clean(b.bed));
    };

    const App = () => {
      const [patients, setPatients] = useState([]);
      const [search, setSearch] = useState("");
      const [addModal, setAddModal] = useState(false);
      const [newP, setNewP] = useState({ward:"Ward 19", bed:"", name:"", diagnosis:"", doctor:"", plan:""});
      
      useEffect(() => {
        if(!db) return;
        const ref = db.ref('patients');
        ref.on('value', snap => {
          const val = snap.val();
          const list = val ? Object.keys(val).map(k => ({id:k, ...val[k]})) : [];
          setPatients(list);
        });
        return () => ref.off();
      }, []);

      const update = (id, f, v) => db && db.ref(`patients/${id}`).update({[f]:v});
      const del = (id) => confirm("Delete?") && db && db.ref(`patients/${id}`).remove();
      const resetDB = () => confirm("Reset DB?") && db && db.ref('patients').remove();
      
      const loadMaster = () => {
        if(confirm("Load Master List (25 patients)?")) {
          MASTER_DATA.forEach(p => db && db.ref('patients').push({...p, timestamp:Date.now()}));
        }
      };

      const saveNew = () => {
        if(newP.name) {
          if(db) db.ref('patients').push({...newP, timestamp:Date.now()});
          setAddModal(false);
          setNewP({ward:"Ward 19", bed:"", name:"", diagnosis:"", doctor:"", plan:""});
        }
      };

      const groups = useMemo(() => {
        const g = {};
        const s = search.toLowerCase();
        patients.filter(p => (p.name+p.bed+p.ward+p.diagnosis).toLowerCase().includes(s))
        .forEach(p => {
          let w = p.ward || "Unassigned";
          if(w.toLowerCase().includes("ward 19")) w = "Ward 19";
          else if(w.toLowerCase().includes("ward 20")) w = "Ward 20";
          else if(w.toLowerCase().includes("ward 21")) w = "Ward 21";
          else if(w.toLowerCase().includes("ward 22")) w = "Ward 22";
          else if(w.toLowerCase().includes("ward 27")) w = "Ward 27";
          else if(w.toLowerCase().includes("ward 5")) w = "Ward 5";
          else if(w.toLowerCase().includes("er")) w = "ER";
          
          if(!g[w]) g[w] = [];
          g[w].push(p);
        });
        
        Object.keys(g).forEach(k => g[k].sort(sortPatients));
        const sortedKeys = Object.keys(g).sort((a,b) => {
          const ia = WARD_ORDER.indexOf(a), ib = WARD_ORDER.indexOf(b);
          return (ia!==-1 && ib!==-1) ? ia-ib : (ia!==-1 ? -1 : (ib!==-1 ? 1 : a.localeCompare(b)));
        });
        return { g, sortedKeys };
      }, [patients, search]);

      return (
        <div className="wrap">
          <div className="topbar">
            <div className="title">
              <h1>Unit E Ward Rounds</h1>
              <div className="subtitle">{patients.length} Patients • {db ? "Connected" : "Local Mode"}</div>
            </div>
            <div className="actions">
              <button className="btn btn-blue" onClick={loadMaster}>📥 Load Master List</button>
              <button className="btn btn-red" onClick={resetDB}>⚠️ Reset DB</button>
              <button className="btn btn-white" onClick={()=>setAddModal(true)}>+ Add Patient</button>
            </div>
          </div>

          <input className="search-bar" placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} />

          {groups.sortedKeys.map(ward => (
            <div key={ward} className="ward-section">
              <div className="ward-header"><span>{ward}</span><span className="ward-count">{groups.g[ward].length}</span></div>
              {groups.g[ward].map(p => (
                <div className="p-card" key={p.id}>
                  {/* Row 1 Mobile / Col 1 Desktop */}
                  <div className="mobile-row col-1">
                    <input className="inp inp-bed" value={p.bed} placeholder="Bed" onChange={e=>update(p.id,'bed',e.target.value)} />
                    <input className="inp inp-doc" value={p.doctor} placeholder="Dr." onChange={e=>update(p.id,'doctor',e.target.value)} />
                  </div>
                  {/* Row 2 Mobile / Col 2 Desktop */}
                  <div className="col-2">
                    <input className="inp inp-name" value={p.name} placeholder="Name" onChange={e=>update(p.id,'name',e.target.value)} />
                    <input className="inp" style={{color:'#64748b'}} value={p.diagnosis} placeholder="Diagnosis" onChange={e=>update(p.id,'diagnosis',e.target.value)} />
                  </div>
                  {/* Row 3 Mobile / Col 3 Desktop */}
                  <div className="col-3">
                    <div style={{display:'flex', gap:10, alignItems:'flex-start'}}>
                       <textarea className="inp inp-area" value={p.plan} placeholder="Plan..." onChange={e=>update(p.id,'plan',e.target.value)} />
                       <button className="btn-del" onClick={()=>del(p.id)}>×</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          ))}

          {patients.length === 0 && (
            <div style={{textAlign:'center', padding:40, color:'#94a3b8'}}>
              No patients found.<br/><br/>
              <button className="btn btn-blue" onClick={loadMaster}>Load Master List Now</button>
            </div>
          )}

          {addModal && (
            <div className="modalOverlay">
              <div className="modal">
                <div className="modal-head">Add Patient</div>
                <div className="modal-body">
                  <div className="form-group">
                    <label>Ward</label>
                    <select className="inp" value={newP.ward} onChange={e=>setNewP({...newP, ward:e.target.value})}>
                      {WARD_ORDER.map(w => <option key={w}>{w}</option>)}
                    </select>
                  </div>
                  <div className="form-row">
                    <div className="form-group">
                      <label>Bed</label>
                      <input className="inp" value={newP.bed} onChange={e=>setNewP({...newP, bed:e.target.value})} />
                    </div>
                    <div className="form-group">
                      <label>Doctor</label>
                      <input className="inp" value={newP.doctor} onChange={e=>setNewP({...newP, doctor:e.target.value})} />
                    </div>
                  </div>
                  <div className="form-group">
                    <label>Name</label>
                    <input className="inp" value={newP.name} onChange={e=>setNewP({...newP, name:e.target.value})} />
                  </div>
                  <div className="form-group">
                    <label>Diagnosis</label>
                    <input className="inp" value={newP.diagnosis} onChange={e=>setNewP({...newP, diagnosis:e.target.value})} />
                  </div>
                </div>
                <div className="modal-foot">
                  <button className="btn btn-ghost" style={{color:'#333'}} onClick={()=>setAddModal(false)}>Cancel</button>
                  <button className="btn btn-white" style={{background: 'var(--green)', color:'white'}} onClick={saveNew}>Save</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

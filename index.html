<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Unit E Ward Rounds</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script crossorigin src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <script crossorigin src="https://unpkg.com/tesseract.js@5.0.2/dist/tesseract.min.js"></script>
  <script crossorigin src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script crossorigin src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script crossorigin src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    /* --- CSS STYLING --- */
    :root{ --green:#2e7d32; --green2:#1b5e20; --bg:#f0f2f5; --card:#fff; --border:#e5e7eb; --red:#d32f2f; --blue:#1976d2; }
    body{ margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:#111827; padding-bottom:60px; }
    .wrap{ max-width:1200px; margin:0 auto; padding:12px; }
    .app{ background:var(--card); border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.05); overflow:hidden; min-height:85vh; display:flex; flex-direction:column; }

    /* Topbar */
    .topbar{ background:linear-gradient(135deg, var(--green), var(--green2)); color:#fff; padding:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
    .title h1{ margin:0; font-size:20px; font-weight:700; }
    .subtitle{ font-size:12px; opacity:0.9; display:flex; align-items:center; gap:6px; }
    .dot{ width:8px; height:8px; border-radius:50%; background:#ffb300; border:2px solid rgba(255,255,255,0.8); }
    .dot.online{ background:#22c55e; }

    /* Controls */
    .actions{ display:flex; gap:8px; }
    .btn{ border:none; border-radius:8px; padding:8px 12px; font-weight:600; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
    .btn-primary{ background:#fff; color:var(--green); }
    .btn-ghost{ background:rgba(255,255,255,0.2); color:#fff; }
    .btn-danger{ background:var(--red); color:#fff; width:28px; height:28px; padding:0; justify-content:center; border-radius:50%; }

    .controls{ padding:12px; background:#fafafa; border-bottom:1px solid var(--border); display:flex; gap:10px; flex-wrap:wrap; }
    .search-box{ flex:1; min-width:180px; padding:8px 12px; border:1px solid var(--border); border-radius:8px; outline:none; }
    .pillRow{ display:flex; gap:6px; overflow-x:auto; }
    .pill{ border:1px solid var(--border); background:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; color:#666; }
    .pill.active{ background:var(--green); color:#fff; border-color:var(--green); }

    /* Content & Table */
    .content-area{ flex:1; overflow-x:auto; padding:10px; }
    .section{ margin-bottom:16px; border:1px solid var(--border); border-radius:10px; background:#fff; overflow:hidden; }
    .section-header{ background:#f8fafc; padding:10px; font-weight:700; font-size:13px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }

    table{ width:100%; border-collapse:collapse; font-size:14px; }
    th{ text-align:left; padding:10px; background:#fff; border-bottom:2px solid var(--border); color:#64748b; font-size:11px; text-transform:uppercase; }
    td{ padding:10px; border-bottom:1px solid var(--border); vertical-align:top; }

    /* Inputs */
    .inp { width:100%; border:1px solid transparent; padding:4px; border-radius:4px; background:transparent; font-family:inherit; resize:none; font-size:14px; }
    .inp:focus { border-color:var(--green); background:#f0fdf4; outline:none; }
    .inp-bold { font-weight:700; color:#000; font-size: 15px; }
    .inp-small { font-size:12px; color:#666; }
    .inp-blue { font-size:11px; color:var(--blue); font-weight: 600; }

    /* Modal */
    .modalOverlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:99; padding:10px; }
    .modal{ background:#fff; width:100%; max-width:900px; max-height:90vh; border-radius:12px; display:flex; flex-direction:column; overflow:hidden; }
    .modalHeader{ padding:12px; background:#1e293b; color:#fff; display:flex; justify-content:space-between; align-items:center; }
    .modalBody{ padding:10px; overflow-y:auto; flex:1; }
    .modalFooter{ padding:12px; background:#f8fafc; display:flex; gap:8px; justify-content:flex-end; border-top:1px solid var(--border); }
    .loading-text { padding: 20px; text-align: center; font-weight: bold; color: var(--green); }

    /* --- COMPACT MOBILE LAYOUT --- */
    @media(max-width:768px){
      table, tbody, th, td, tr { display:block; }
      thead { display: none; } /* Hide Header */

      tr {
        display: flex;
        flex-wrap: wrap;
        padding: 10px;
        margin-bottom: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        gap: 8px;
        position: relative;
      }

      /* Bed Column (Top Left) */
      td:nth-child(1) { width: 25%; padding: 0; border: none; }
      
      /* Name Column (Top Middle) */
      td:nth-child(2) { width: 60%; padding: 0; border: none; }

      /* Diagnosis Column (Middle Row - Full Width) */
      td:nth-child(3) { width: 100%; padding: 0; border: none; margin-top: 4px; }
      
      /* Plan Column (Bottom Row - Full Width) */
      td:nth-child(4) { width: 100%; padding: 0; border: none; }
      
      /* Delete Button (Top Right) */
      td:nth-child(5) { 
        width: 15%; padding: 0; border: none; 
        position: absolute; top: 10px; right: 10px;
        display: flex; justify-content: flex-end;
      }

      /* Style Adjustments for Inputs on Mobile */
      .inp { border: 1px solid #eee; background: #fafafa; padding: 6px; }
      .inp:focus { background: #fff; border-color: var(--green); }
      .inp-bold { border: none; background: transparent; font-size: 16px; padding: 0; margin-bottom: 2px; }
    }
  </style>
</head>

<body>
  <div id="root">
    <div style="padding:40px; text-align:center; color:#666; font-family:sans-serif;">
      <h2>Loading...</h2>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCTUw2zpoz_lgMrDCt00CsudqvZgGu4xko",
      authDomain: "unit-e-1d07b.firebaseapp.com",
      databaseURL: "https://unit-e-1d07b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "unit-e-1d07b",
      storageBucket: "unit-e-1d07b.firebasestorage.app",
      messagingSenderId: "465930916258",
      appId: "1:465930916258:web:0ec4d478bb3d6d7bd262fb"
    };

    // Safe Firebase Init
    let db;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch(e) { console.error(e); }

    const clean = v => (v ?? "").toString().trim();
    
    const sortBed = (a, b) => {
      const na = parseInt(a.bed), nb = parseInt(b.bed);
      return (!isNaN(na) && !isNaN(nb)) ? na - nb : clean(a.bed).localeCompare(clean(b.bed));
    };

    const App = () => {
      const [patients, setPatients] = useState([]);
      const [loading, setLoading] = useState(true);
      const [online, setOnline] = useState(true);
      const [search, setSearch] = useState("");
      const [filter, setFilter] = useState("All");
      
      const [modalOpen, setModalOpen] = useState(false);
      const [importData, setImportData] = useState([]);
      const [ocrProgress, setOcrProgress] = useState(null);
      const fileRef = useRef(null);

      useEffect(() => {
        setOnline(navigator.onLine);
        window.addEventListener('online', () => setOnline(true));
        window.addEventListener('offline', () => setOnline(false));

        if (db) {
          const ref = db.ref('patients');
          ref.on('value', snap => {
            const val = snap.val();
            const list = val ? Object.keys(val).map(k => ({id:k, ...val[k]})) : [];
            setPatients(list);
            setLoading(false);
          });
        } else {
          setLoading(false); 
        }
      }, []);

      const update = (id, field, val) => db && db.ref(`patients/${id}`).update({[field]:val});
      const add = (loc) => db && db.ref('patients').push({ location:clean(loc), bed:"", name:"", mrn:"", diagnosis:"", plan:"", timestamp:Date.now() });
      const del = (id) => confirm("Delete?") && db && db.ref(`patients/${id}`).remove();
      
      const exportExcel = () => {
        const data = patients.map(({id, timestamp, ...rest}) => rest);
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Rounds");
        XLSX.writeFile(wb, "Rounds.xlsx");
      };

      // --- IMPORT LOGIC ---
      const handleFile = async (e) => {
        const file = e.target.files?.[0];
        if(!file) return;
        const name = file.name.toLowerCase();
        
        try {
          // 1. EXCEL (.xlsx, .xls)
          if(name.endsWith('.xlsx') || name.endsWith('.xls')) {
            const reader = new FileReader();
            reader.onload = (evt) => {
              const wb = XLSX.read(evt.target.result, {type:'binary'});
              const ws = wb.Sheets[wb.SheetNames[0]];
              const json = XLSX.utils.sheet_to_json(ws);
              processImportData(json);
            };
            reader.readAsBinaryString(file);
          } 
          // 2. TEXT / CSV (.txt, .csv)
          else if(name.endsWith('.txt') || name.endsWith('.csv')) {
             const reader = new FileReader();
             reader.onload = (evt) => {
               const text = evt.target.result;
               const lines = text.split('\n');
               // Simple parser: Split by comma or tab
               const json = lines.map(line => {
                  const parts = line.split(/,|\t/); 
                  if(parts.length < 2) return null; // Skip empty lines
                  return {
                    bed: parts[0] || "",
                    name: parts[1] || "",
                    diagnosis: parts[2] || "",
                    plan: parts[3] || ""
                  };
               }).filter(Boolean);
               processImportData(json);
             };
             reader.readAsText(file);
          }
          // 3. IMAGE OCR (.jpg, .png, etc)
          else if(name.match(/\.(jpg|jpeg|png|webp)$/)) {
            setModalOpen(true);
            setOcrProgress(0);
            setImportData([]);
            const res = await Tesseract.recognize(file, 'eng', {
              logger: m => m.status === 'recognizing text' && setOcrProgress(m.progress)
            });
            const lines = res.data.text.split('\n').filter(l => l.trim().length > 4);
            setImportData(lines.map(l => ({ name:l, bed:"?", diagnosis:"", plan:"", timestamp:Date.now() })));
            setOcrProgress(null);
          }
        } catch(err) { alert("Import Error: " + err.message); }
        e.target.value = null; 
      };

      const processImportData = (rawList) => {
         const mapped = rawList.map(r => {
            // Loose key matching for Excel/JSON objects
            const k = Object.keys(r).reduce((acc, key) => ({...acc, [key.toLowerCase()]: r[key]}), {});
            return {
              bed: clean(k.bed || k['bed no'] || k.bedno),
              name: clean(k.name || k['patient name'] || k.patient),
              mrn: clean(k.mrn || k['file no'] || k.id),
              diagnosis: clean(k.diagnosis || k.dx || k.problem),
              plan: clean(k.plan || k.notes || k.mx),
              location: clean(k.location || k.ward || ""),
              timestamp: Date.now()
            };
         }).filter(p => p.name || p.bed);
         setImportData(mapped);
         setModalOpen(true);
         setOcrProgress(null);
      };

      const groups = useMemo(() => {
        const g = {};
        const safeSearch = (search || "").toLowerCase();
        const filtered = patients.filter(p => {
            const rowText = (clean(p.name) + clean(p.mrn) + clean(p.bed) + clean(p.diagnosis)).toLowerCase();
            return rowText.includes(safeSearch);
        });

        filtered.forEach(p => {
          const loc = p.location || "Unassigned";
          if(!g[loc]) g[loc] = [];
          g[loc].push(p);
        });
        
        Object.keys(g).forEach(k => g[k].sort(sortBed));
        return g;
      }, [patients, search, filter]);

      return (
        <div className="wrap">
          <div className="app">
            
            <div className="topbar">
              <div className="title">
                <h1>Unit E Ward Rounds</h1>
                <div className="subtitle">
                  <span className={`dot ${online?'online':''}`}></span> {online?'Online':'Offline'}
                </div>
              </div>
              <div className="actions">
                <input type="file" ref={fileRef} hidden onChange={handleFile} accept=".xlsx,.xls,.csv,.txt,.jpg,.png" />
                <button className="btn btn-ghost" onClick={() => fileRef.current.click()}>📷 / 📂 Import</button>
                <button className="btn btn-ghost" onClick={exportExcel}>📥 Export</button>
                <button className="btn btn-primary" onClick={() => add("")}>+ Add</button>
              </div>
            </div>

            <div className="controls">
              <input className="search-box" placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} />
              <div className="pillRow">
                {['All'].map(f => (
                  <div key={f} className={`pill ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>{f}</div>
                ))}
              </div>
            </div>

            <div className="content-area">
              {loading && <div style={{padding:20}}>Loading Data...</div>}
              
              {!loading && Object.keys(groups).sort().map(loc => (
                <div key={loc} className="section">
                  <div className="section-header">
                    <span>{loc} ({groups[loc].length})</span>
                    <button className="btn btn-ghost" style={{color:'#000', padding:'4px 8px'}} onClick={()=>add(loc==='Unassigned'?'':loc)}>+ Add</button>
                  </div>
                  <table>
                    <thead><tr><th width="80">Bed</th><th>Patient</th><th>Diagnosis</th><th>Plan</th><th width="30"></th></tr></thead>
                    <tbody>
                      {groups[loc].map(p => (
                        <tr key={p.id}>
                          <td>
                            <input className="inp" value={p.bed || ""} placeholder="-" onChange={e=>update(p.id, 'bed', e.target.value)} />
                            {loc==='Unassigned' && (
                              <input className="inp inp-blue" value={p.location || ""} placeholder="Loc?" onChange={e=>update(p.id, 'location', e.target.value)} />
                            )}
                          </td>
                          <td>
                            <input className="inp inp-bold" value={p.name || ""} placeholder="Name" onChange={e=>update(p.id, 'name', e.target.value)} />
                            <input className="inp inp-small" value={p.mrn || ""} placeholder="MRN" onChange={e=>update(p.id, 'mrn', e.target.value)} />
                          </td>
                          <td>
                            <textarea className="inp" rows={2} value={p.diagnosis || ""} placeholder="Diagnosis..." onChange={e=>update(p.id, 'diagnosis', e.target.value)} />
                          </td>
                          <td>
                            <textarea className="inp" rows={2} value={p.plan || ""} placeholder="Plan..." onChange={e=>update(p.id, 'plan', e.target.value)} />
                          </td>
                          <td>
                            <button className="btn btn-danger" onClick={()=>del(p.id)}>×</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              ))}
              
              {!loading && patients.length === 0 && <div style={{padding:20, color:'#999', textAlign:'center'}}>No patients found. Click + Add</div>}
            </div>

            {modalOpen && (
              <div className="modalOverlay">
                <div className="modal">
                  <div className="modalHeader">
                    <span>Import Preview</span>
                    <button className="btn btn-danger" onClick={()=>{setModalOpen(false); setOcrProgress(null);}}>×</button>
                  </div>
                  <div className="modalBody">
                    {ocrProgress !== null ? (
                      <div className="loading-text">Reading Image... {Math.round(ocrProgress*100)}%</div>
                    ) : (
                      <table>
                        <thead><tr><th>Bed</th><th>Name</th><th>Diagnosis</th></tr></thead>
                        <tbody>
                          {importData.map((r,i) => (
                            <tr key={i}><td>{r.bed}</td><td>{r.name}</td><td>{r.diagnosis}</td></tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                  <div className="modalFooter">
                     <button className="btn btn-primary" onClick={() => { importData.forEach(p => db && db.ref('patients').push(p)); setModalOpen(false); }}>Confirm</button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

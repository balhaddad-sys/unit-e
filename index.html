<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit E Ward Rounds</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 16px;
    }
    .container { max-width: 1100px; margin: auto; background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; font-size: 22px; }
    .btn { border: none; border-radius: 5px; padding: 8px 14px; margin: 2px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #2e7d32; color: white; }
    .btn-danger { background: #d32f2f; color: white; }
    .btn-secondary { background: #1976d2; color: white; }
    .controls { padding: 16px; background: #fafafa; border-bottom: 1px solid #e0e0e0; }
    input, select { padding: 8px; border: 1px solid #ddd; border-radius: 5px; margin-right: 8px; }
    .content { padding: 16px; }
    .ward-section { margin-bottom: 24px; }
    .ward-header { background: #1976d2; color: white; padding: 12px; border-radius: 5px; }
    .er-header { background: #c62828 !important; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
    tr:hover { background: #f9f9f9; }
    .status { font-weight: bold; border-radius: 8px; padding: 3px 8px; color: white; }
    .status.New { background: #7b1fa2; }
    .status.Stable { background: #388e3c; }
    .status.Critical { background: #f57c00; }
    .status.Discharged { background: #0288d1; }
    .modal-bg { position: fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; }
    .modal { background:white; padding:20px; border-radius:8px; width:90%; max-width:400px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyCTUw2zpoz_lgMrDCt00CsudqvZgGu4xko",
      authDomain: "unit-e-1d07b.firebaseapp.com",
      databaseURL: "https://unit-e-1d07b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "unit-e-1d07b",
      storageBucket: "unit-e-1d07b.firebasestorage.app",
      messagingSenderId: "465930916258",
      appId: "1:465930916258:web:0ec4d478bb3d6d7bd262fb",
      measurementId: "G-6W2X2BBJLQ"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const { useState, useEffect } = React;

    function WardRoundsApp() {
      const [patients, setPatients] = useState([]);
      const [showModal, setShowModal] = useState(false);
      const [editing, setEditing] = useState(null);
      const [filterStatus, setFilterStatus] = useState('New admission');
      const [search, setSearch] = useState('');
      const [form, setForm] = useState({ name: '', diagnosis: '', location: '', doctor: '', status: 'New admission' });

      useEffect(() => {
        const ref = db.ref('patients');
        ref.on('value', snap => {
          const data = snap.val() || {};
          setPatients(Object.entries(data).map(([id, v]) => ({ id, ...v })));
        });
        return () => ref.off();
      }, []);

      const savePatient = () => {
        const ref = db.ref('patients');
        if (editing) ref.child(editing.id).set(form);
        else ref.push(form);
        setShowModal(false);
        setEditing(null);
        setForm({ name: '', diagnosis: '', location: '', doctor: '', status: 'New admission' });
      };

      const del = id => db.ref('patients').child(id).remove();

      const exportExcel = () => {
        const ws = XLSX.utils.json_to_sheet(patients);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Patients');
        XLSX.writeFile(wb, 'UnitE_Patients.xlsx');
      };

      const importFile = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = evt => {
          const data = JSON.parse(evt.target.result);
          db.ref('patients').set(data);
        };
        reader.readAsText(file);
      };

      const filtered = patients.filter(p =>
        (!filterStatus || p.status === filterStatus) &&
        (p.name || '').toLowerCase().includes(search.toLowerCase())
      );

      const er = filtered.filter(p => p.location === 'ER');
      const wards = filtered.filter(p => p.location !== 'ER');

      return (
        <div className="container">
          <div className="header">
            <h1>Unit E Ward Rounds</h1>
            <div>
              <button className="btn btn-primary" onClick={() => setShowModal(true)}>+ Add</button>
              <button className="btn btn-secondary" onClick={exportExcel}>Export</button>
              <label className="btn btn-secondary" style={{cursor:'pointer'}}>
                Import<input type="file" accept=".json" style={{display:'none'}} onChange={importFile}/>
              </label>
            </div>
          </div>

          <div className="controls">
            <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
              <option value="">All</option>
              <option value="New admission">New admission</option>
              <option value="Stable">Stable</option>
              <option value="Critical">Critical</option>
              <option value="Discharged">Discharged</option>
            </select>
            <input placeholder="Search..." value={search} onChange={e => setSearch(e.target.value)} />
          </div>

          <div className="content">
            {er.length > 0 && (
              <div className="ward-section">
                <div className="ward-header er-header">Emergency Room (ER)</div>
                <table>
                  <thead><tr><th>Name</th><th>Diagnosis</th><th>Doctor</th><th>Status</th><th></th></tr></thead>
                  <tbody>
                    {er.map(p => (
                      <tr key={p.id}>
                        <td>{p.name}</td><td>{p.diagnosis}</td><td>{p.doctor}</td>
                        <td><span className={`status ${p.status.split(' ')[0]}`}>{p.status}</span></td>
                        <td>
                          <button className="btn btn-secondary" onClick={()=>{setEditing(p);setForm(p);setShowModal(true);}}>✎</button>
                          <button className="btn btn-danger" onClick={()=>del(p.id)}>✕</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            <div className="ward-section">
              <div className="ward-header">Wards</div>
              <table>
                <thead><tr><th>Name</th><th>Diagnosis</th><th>Location</th><th>Doctor</th><th>Status</th><th></th></tr></thead>
                <tbody>
                  {wards.map(p => (
                    <tr key={p.id}>
                      <td>{p.name}</td><td>{p.diagnosis}</td><td>{p.location}</td><td>{p.doctor}</td>
                      <td><span className={`status ${p.status.split(' ')[0]}`}>{p.status}</span></td>
                      <td>
                        <button className="btn btn-secondary" onClick={()=>{setEditing(p);setForm(p);setShowModal(true);}}>✎</button>
                        <button className="btn btn-danger" onClick={()=>del(p.id)}>✕</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {showModal && (
            <div className="modal-bg">
              <div className="modal">
                <h3>{editing ? 'Edit Patient' : 'Add New Patient'}</h3>
                <input placeholder="Name" value={form.name} onChange={e=>setForm({...form, name:e.target.value})} />
                <input placeholder="Diagnosis" value={form.diagnosis} onChange={e=>setForm({...form, diagnosis:e.target.value})} />
                <input placeholder="Location" value={form.location} onChange={e=>setForm({...form, location:e.target.value})} />
                <input placeholder="Doctor" value={form.doctor} onChange={e=>setForm({...form, doctor:e.target.value})} />
                <select value={form.status} onChange={e=>setForm({...form, status:e.target.value})}>
                  <option>New admission</option>
                  <option>Stable</option>
                  <option>Critical</option>
                  <option>Discharged</option>
                </select>
                <div style={{marginTop:'12px', textAlign:'right'}}>
                  <button className="btn btn-secondary" onClick={()=>setShowModal(false)}>Cancel</button>
                  <button className="btn btn-primary" onClick={savePatient}>{editing?'Update':'Save'}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WardRoundsApp />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Unit E Ward Rounds</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script crossorigin src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    :root{ --green:#15803d; --blue:#1e40af; --bg:#f1f5f9; --text:#0f172a; --border:#cbd5e1; --orange:#c2410c; --purple:#7e22ce; --red:#dc2626; }
    body{ margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); padding-bottom:100px; }
    .wrap{ max-width:1200px; margin:0 auto; padding:10px; }

    .topbar{ background:var(--green); color:white; padding:12px 16px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); }
    .title h1{ margin:0; font-size:18px; font-weight:800; }
    .title-row { display: flex; align-items: center; gap: 10px; }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; }
    .btn{ border:none; border-radius:6px; padding:8px 12px; font-weight:600; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:0.1s; box-shadow:0 1px 2px rgba(0,0,0,0.05); }
    .btn:active{ transform:translateY(1px); }
    .btn:disabled{ opacity: 0.6; cursor: not-allowed; }
    .btn-white{ background:white; color:var(--green); }
    .btn-blue{ background:#dbeafe; color:var(--blue); }
    .btn-red{ background:#fee2e2; color:#dc2626; }
    .btn-green{ background:#d1fae5; color:var(--green); }

    .notice-banner { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border: 2px solid #f59e0b; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
    .notice-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .notice-title { font-weight: 800; color: #92400e; font-size: 13px; text-transform: uppercase; }
    .notice-actions { display: flex; gap: 6px; }
    .notice-btn { background: white; border: 1px solid #f59e0b; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: #92400e; cursor: pointer; }
    .notice-btn.save { background: #15803d; color: white; border-color: #15803d; }
    .notice-content { color: #78350f; font-size: 14px; white-space: pre-wrap; }
    .notice-content.empty { color: #a16207; font-style: italic; }
    .notice-textarea { width: 100%; min-height: 60px; padding: 10px; border: 1px solid #f59e0b; border-radius: 8px; font-size: 14px; font-family: inherit; background: white; box-sizing: border-box; }
    .notice-collapsed { padding: 10px 16px; cursor: pointer; }
    .notice-collapsed .notice-header { margin-bottom: 0; }
    
    .controls-container { background: white; padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
    .filter-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); background: #f8fafc; color: #64748b; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .filter-btn.active { background: var(--green); color: white; border-color: var(--green); }
    .search-bar{ width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:14px; outline:none; box-sizing: border-box; }

    .ward-section{ background:white; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:20px; }
    .ward-header{ background:var(--blue); color:white; padding:10px 16px; font-weight:700; font-size:13px; display:flex; justify-content:space-between; align-items:center; cursor: pointer; }
    .ward-header:hover { background: #1e3a8a; }
    .arrow { transition: transform 0.2s; font-size: 10px; }
    .arrow.collapsed { transform: rotate(-90deg); }
    .ward-body.is-hidden { display: none; }
    .ward-count { background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: auto; margin-right: 10px; }

    .p-card{ padding:12px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:10px; }
    .p-card:last-child{ border-bottom:none; }

    .inp{ width:100%; padding:6px 8px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px; background:#f8fafc; font-family:inherit; box-sizing: border-box; }
    .inp:focus{ background:white; border-color:var(--green); outline:none; }
    .inp-bed{ width:70px; font-weight:800; text-align:center; color:var(--blue); background:#eff6ff; }
    .inp-name{ font-weight:700; font-size:15px; }
    .inp-doc{ width:110px; font-size:12px; font-weight:600; color:#64748b; }
    .inp-area{ min-height:45px; resize:vertical; }

    .status-select { padding: 4px; border-radius: 4px; border: 1px solid var(--border); font-size: 11px; font-weight: 600; cursor: pointer; }
    .status-new { background: #dbeafe; color: var(--blue); }
    .status-chronic { background: #ffedd5; color: var(--orange); }
    .status-non { background: #f3e8ff; color: var(--purple); }

    .btn-del{ width:28px; height:28px; border-radius:6px; background:#fef2f2; color:#ef4444; border:1px solid #fee2e2; font-weight:bold; cursor:pointer; }
    .btn-lab{ padding:4px 8px; border-radius:6px; background:#f3e8ff; color:var(--purple); border:1px solid #e9d5ff; font-weight:600; font-size:11px; cursor:pointer; position: relative; }
    .btn-lab.has-labs{ background:#d946ef; color:white; border-color:#d946ef; }
    .lab-count{ position:absolute; top:-6px; right:-6px; background:var(--red); color:white; font-size:10px; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

    .modalOverlay{ position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:100; padding:10px; }
    .modal{ background:white; width:100%; max-width:600px; border-radius:12px; display:flex; flex-direction:column; max-height:95vh; overflow:hidden; }
    .modal-head{ background:var(--purple); padding:14px; color:white; font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
    .modal-body{ padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
    .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:12px 16px; border-top:1px solid var(--border); }
    .form-group label{ font-size:11px; font-weight:700; color:#64748b; text-transform:uppercase; margin-bottom:4px; display:block; }

    .sync-badge { font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: 600; }
    .sync-badge.idle { background: rgba(255,255,255,0.2); color: white; }
    .sync-badge.syncing { background: #fef08a; color: #854d0e; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 200; }

    /* Lab Image Styles */
    .add-lab-area { border: 2px dashed var(--purple); border-radius: 12px; padding: 24px; text-align: center; background: #faf5ff; cursor: pointer; transition: all 0.2s; }
    .add-lab-area:hover { background: #f3e8ff; border-color: #a855f7; }
    .add-lab-area.dragging { background: #e9d5ff; border-color: #9333ea; }
    .add-lab-icon { font-size: 32px; margin-bottom: 8px; }
    .add-lab-text { font-weight: 600; color: var(--purple); margin-bottom: 4px; }
    .add-lab-hint { font-size: 12px; color: #a855f7; }

    .lab-images-grid { display: flex; flex-direction: column; gap: 12px; }
    .lab-image-card { background: #f8fafc; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    .lab-image-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: linear-gradient(135deg, #7e22ce 0%, #a855f7 100%); color: white; }
    .lab-image-date { font-size: 12px; font-weight: 600; }
    .lab-image-time { font-size: 11px; opacity: 0.8; }
    .lab-image-actions { display: flex; gap: 8px; }
    .lab-image-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .lab-image-btn:hover { background: rgba(255,255,255,0.3); }
    .lab-image-btn.delete:hover { background: rgba(239,68,68,0.8); }
    .lab-image-container { position: relative; cursor: pointer; }
    .lab-image-container img { width: 100%; display: block; }
    .lab-image-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
    .lab-image-container:hover .lab-image-overlay { opacity: 1; }
    .lab-image-overlay span { color: white; font-weight: 600; font-size: 14px; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px; }
    .lab-image-note { padding: 10px 12px; border-top: 1px solid var(--border); }
    .lab-image-note input { width: 100%; border: none; background: transparent; font-size: 13px; color: var(--text); }
    .lab-image-note input::placeholder { color: #94a3b8; }

    /* Fullscreen Image Viewer */
    .image-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; display: flex; flex-direction: column; }
    .image-viewer-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; color: white; }
    .image-viewer-title { font-weight: 600; }
    .image-viewer-close { background: rgba(255,255,255,0.1); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 20px; }
    .image-viewer-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
    .image-viewer-body img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    .image-viewer-nav { display: flex; justify-content: center; gap: 12px; padding: 16px; }
    .image-viewer-nav button { background: rgba(255,255,255,0.1); border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .image-viewer-nav button:hover { background: rgba(255,255,255,0.2); }
    .image-viewer-nav button:disabled { opacity: 0.3; cursor: not-allowed; }

    .empty-labs { text-align: center; padding: 40px 20px; color: #94a3b8; }
    .empty-labs-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
    .empty-labs-text { font-size: 14px; }

    @media(min-width: 768px){
      .p-card{ flex-direction:row; align-items:flex-start; gap:14px; }
      .col-1{ width:130px; display:flex; flex-direction:column; gap:6px; }
      .col-2{ flex:1; display:flex; flex-direction:column; gap:6px; }
      .col-3{ width:280px; display:flex; flex-direction:column; gap:6px; }
    }
    @media(max-width: 767px){ .mobile-row{ display:flex; gap:8px; } .p-card{ padding-right: 50px; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCTUw2zpoz_lgMrDCt00CsudqvZgGu4xko",
      authDomain: "unit-e-1d07b.firebaseapp.com",
      databaseURL: "https://unit-e-1d07b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "unit-e-1d07b",
      storageBucket: "unit-e-1d07b.firebasestorage.app",
      messagingSenderId: "465930916258",
      appId: "1:465930916258:web:0ec4d478bb3d6d7bd262fb"
    };

    if (window.firebase && !firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    const SHEETS_SYNC_URL = "https://script.google.com/macros/s/AKfycbzeCRMInJT0ipKr3xgVvDpr6O3Y21dX7qqxoXipDdYz-JvrLZoC71xLicQO2lKxz6Rwzg/exec";
    const SPREADSHEET_ID = "1I2Cmm2YPUuJw4o4cOgl-iFmqTmfy6S9btFZ-5AIMxh4";
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/edit`;

    const pingSheets = () => {
      const url = `${SHEETS_SYNC_URL}?t=${Date.now()}`;
      if (navigator.sendBeacon) navigator.sendBeacon(url, new Blob([], { type: "text/plain" }));
      else fetch(url, { method: "GET", mode: "no-cors", cache: "no-store" }).catch(() => {});
    };

    const WARD_ORDER = ["Ward 19", "Ward 20", "Ward 21", "Ward 22", "Ward 27", "Ward 5", "Ward 10", "ICU", "ER", "Unassigned"];
    const STATUS_OPTIONS = ["New", "Chronic", "Non-Chronic"];

    const isTimestamp = (val) => String(val || "").match(/^\d{4}-\d{2}-\d{2}|^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s|\d{13,}|T\d{2}:\d{2}/);
    const cleanBed = (val) => isTimestamp(val) ? "" : String(val || "").trim();
    const makeKey = (ward, name) => `${(ward || "").toLowerCase().trim()}|${(name || "").toLowerCase().trim()}`;
    
    const formatDateTime = (ts) => {
      if (!ts) return { date: "", time: "" };
      const d = new Date(ts);
      return {
        date: d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
        time: d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
      };
    };

    // FIX 1: Aggressive compression for RTDB
    const compressImage = (file, maxWidth = 800) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            
            if (width > maxWidth) {
              height = (height * maxWidth) / width;
              width = maxWidth;
            }
            
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            // Lower quality to 0.5 to prevent "Payload too large" errors
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.5));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

    // Image Viewer Component
    const ImageViewer = ({ images, currentIndex, onClose, onNavigate }) => {
      const current = images[currentIndex];
      if (!current) return null;

      return (
        <div className="image-viewer" onClick={onClose}>
          <div className="image-viewer-header" onClick={e => e.stopPropagation()}>
            <div className="image-viewer-title">
              {formatDateTime(current.timestamp).date} • {formatDateTime(current.timestamp).time}
              {current.note && ` • ${current.note}`}
            </div>
            <button className="image-viewer-close" onClick={onClose}>×</button>
          </div>
          <div className="image-viewer-body" onClick={e => e.stopPropagation()}>
            <img src={current.image} alt="Lab result" />
          </div>
          {images.length > 1 && (
            <div className="image-viewer-nav" onClick={e => e.stopPropagation()}>
              <button onClick={() => onNavigate(currentIndex - 1)} disabled={currentIndex === 0}>
                ← Previous
              </button>
              <span style={{ color: 'white', padding: '10px' }}>{currentIndex + 1} / {images.length}</span>
              <button onClick={() => onNavigate(currentIndex + 1)} disabled={currentIndex === images.length - 1}>
                Next →
              </button>
            </div>
          )}
        </div>
      );
    };

    // Lab Modal Component - UPDATED FIX
    const LabModal = ({ patient, onClose, onSave }) => {
      // FIX 2: Handle Firebase sparse arrays (Objects) by forcing them into Arrays
      const [labImages, setLabImages] = useState(() => {
        const data = patient.labImages;
        if (!data) return [];
        if (Array.isArray(data)) return data; 
        return Object.values(data); 
      });
      
      const [dragging, setDragging] = useState(false);
      const [viewerIndex, setViewerIndex] = useState(null);
      const [uploading, setUploading] = useState(false);
      const [saving, setSaving] = useState(false); // New saving state
      const fileRef = useRef(null);
      const cameraRef = useRef(null);

      const handleFile = async (file) => {
        if (!file || !file.type.startsWith('image/')) return;
        
        setUploading(true);
        try {
          const compressed = await compressImage(file);
          const newImage = {
            id: Date.now().toString(),
            image: compressed,
            timestamp: Date.now(),
            note: ""
          };
          setLabImages(prev => [newImage, ...prev]);
        } catch (err) {
          console.error("Error processing image:", err);
        }
        setUploading(false);
      };

      const handleFileInput = (e) => {
        const file = e.target.files?.[0];
        if (file) handleFile(file);
        e.target.value = '';
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setDragging(false);
        const file = e.dataTransfer.files?.[0];
        if (file) handleFile(file);
      };

      const handlePaste = useCallback((e) => {
        const items = e.clipboardData?.items;
        if (items) {
          for (const item of items) {
            if (item.type.startsWith('image/')) {
              handleFile(item.getAsFile());
              break;
            }
          }
        }
      }, []);

      useEffect(() => {
        document.addEventListener('paste', handlePaste);
        return () => document.removeEventListener('paste', handlePaste);
      }, [handlePaste]);

      const updateNote = (id, note) => {
        setLabImages(prev => prev.map(img => img.id === id ? { ...img, note } : img));
      };

      const deleteImage = (id) => {
        if (confirm("Delete this lab image?")) {
          setLabImages(prev => prev.filter(img => img.id !== id));
        }
      };

      // FIX 3: Wait for save to complete before closing
      const handleSave = async () => {
        setSaving(true);
        await onSave(patient.id, labImages);
        setSaving(false);
        onClose();
      };

      return (
        <div className="modalOverlay" onClick={!saving ? onClose : undefined}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-head">
              <span>🧪 Labs - {patient.name}</span>
              {!saving && <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'white', fontSize: '18px', cursor: 'pointer' }}>×</button>}
            </div>
            <div className="modal-body">
              {/* Add New Lab Image */}
              <div 
                className={`add-lab-area ${dragging ? 'dragging' : ''}`}
                onClick={() => !saving && fileRef.current?.click()}
                onDragOver={e => { e.preventDefault(); setDragging(true); }}
                onDragLeave={() => setDragging(false)}
                onDrop={handleDrop}
                style={{ opacity: saving ? 0.5 : 1, pointerEvents: saving ? 'none' : 'auto' }}
              >
                {uploading ? (
                  <>
                    <div className="add-lab-icon">⏳</div>
                    <div className="add-lab-text">Processing...</div>
                  </>
                ) : (
                  <>
                    <div className="add-lab-icon">📷</div>
                    <div className="add-lab-text">Add Lab Image</div>
                    <div className="add-lab-hint">Tap to take photo, upload, or paste (Ctrl+V)</div>
                  </>
                )}
              </div>
              
              <div style={{ display: 'flex', gap: 8, justifyContent: 'center', opacity: saving ? 0.5 : 1 }}>
                <button className="btn btn-blue" onClick={() => cameraRef.current?.click()} disabled={saving}>
                  📸 Camera
                </button>
                <button className="btn btn-white" onClick={() => fileRef.current?.click()} disabled={saving}>
                  📁 Gallery
                </button>
              </div>

              <input ref={fileRef} type="file" accept="image/*" onChange={handleFileInput} style={{ display: 'none' }} />
              <input ref={cameraRef} type="file" accept="image/*" capture="environment" onChange={handleFileInput} style={{ display: 'none' }} />

              {/* Lab Images List */}
              {labImages.length === 0 ? (
                <div className="empty-labs">
                  <div className="empty-labs-icon">🔬</div>
                  <div className="empty-labs-text">No lab images yet.<br/>Take a photo or upload a screenshot.</div>
                </div>
              ) : (
                <div className="lab-images-grid">
                  {labImages.map((lab, idx) => {
                    const { date, time } = formatDateTime(lab.timestamp);
                    return (
                      <div key={lab.id} className="lab-image-card">
                        <div className="lab-image-header">
                          <div>
                            <div className="lab-image-date">{date}</div>
                            <div className="lab-image-time">{time}</div>
                          </div>
                          <div className="lab-image-actions">
                            <button className="lab-image-btn delete" onClick={() => deleteImage(lab.id)} disabled={saving}>🗑️</button>
                          </div>
                        </div>
                        <div className="lab-image-container" onClick={() => setViewerIndex(idx)}>
                          <img src={lab.image} alt="Lab result" />
                          <div className="lab-image-overlay">
                            <span>👆 Tap to enlarge</span>
                          </div>
                        </div>
                        <div className="lab-image-note">
                          <input 
                            type="text" 
                            placeholder="Add a note (e.g., CBC, Renal panel...)"
                            value={lab.note || ""}
                            onChange={e => updateNote(lab.id, e.target.value)}
                            onClick={e => e.stopPropagation()}
                            disabled={saving}
                          />
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
            <div className="modal-foot">
              <button className="btn btn-white" onClick={onClose} disabled={saving}>Cancel</button>
              <button className="btn" style={{ background: 'var(--purple)', color: 'white' }} onClick={handleSave} disabled={saving}>
                {saving ? 'Saving...' : `Save (${labImages.length} img)`}
              </button>
            </div>
          </div>

          {/* Fullscreen Image Viewer */}
          {viewerIndex !== null && (
            <ImageViewer 
              images={labImages}
              currentIndex={viewerIndex}
              onClose={() => setViewerIndex(null)}
              onNavigate={setViewerIndex}
            />
          )}
        </div>
      );
    };

    // Notice Banner
    const NoticeBanner = ({ notice, onSave }) => {
      const [editing, setEditing] = useState(false);
      const [collapsed, setCollapsed] = useState(false);
      const [text, setText] = useState(notice?.text || "");
      useEffect(() => setText(notice?.text || ""), [notice?.text]);

      if (collapsed) {
        return (
          <div className="notice-banner notice-collapsed" onClick={() => setCollapsed(false)}>
            <div className="notice-header">
              <span className="notice-title">📢 Notice</span>
              <span style={{ fontSize: '11px', color: '#a16207' }}>▼</span>
            </div>
          </div>
        );
      }

      return (
        <div className="notice-banner">
          <div className="notice-header">
            <span className="notice-title">📢 Notice</span>
            <div className="notice-actions">
              {editing ? (
                <>
                  <button className="notice-btn" onClick={() => { setText(notice?.text || ""); setEditing(false); }}>Cancel</button>
                  <button className="notice-btn save" onClick={() => { onSave(text); setEditing(false); }}>Save</button>
                </>
              ) : (
                <>
                  <button className="notice-btn" onClick={() => setCollapsed(true)}>▲</button>
                  <button className="notice-btn" onClick={() => setEditing(true)}>Edit</button>
                </>
              )}
            </div>
          </div>
          {editing ? (
            <textarea className="notice-textarea" value={text} onChange={e => setText(e.target.value)} autoFocus />
          ) : (
            <div className={`notice-content ${!notice?.text ? 'empty' : ''}`}>{notice?.text || "No notices"}</div>
          )}
        </div>
      );
    };

    // Main App
    const App = () => {
      const [patients, setPatients] = useState([]);
      const [notice, setNotice] = useState({ text: "", updatedAt: null });
      const [search, setSearch] = useState("");
      const [viewFilter, setViewFilter] = useState("All");
      const [addModal, setAddModal] = useState(false);
      const [labModal, setLabModal] = useState(null);
      const [newP, setNewP] = useState({ ward: "Ward 19", bed: "", name: "", diagnosis: "", doctor: "", plan: "", status: "New", mrn: "" });
      const [collapsedWards, setCollapsedWards] = useState({});
      const [syncing, setSyncing] = useState(false);
      const [toast, setToast] = useState(null);
      const syncTimer = useRef(null);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };
      
      const scheduleSync = useCallback(() => {
        setSyncing(true);
        if (syncTimer.current) clearTimeout(syncTimer.current);
        syncTimer.current = setTimeout(() => { pingSheets(); setTimeout(() => setSyncing(false), 1000); }, 500);
      }, []);

      useEffect(() => {
        db.ref('notice').on('value', snap => setNotice(snap.val() || { text: "" }));
        db.ref('patients').on('value', snap => {
          const val = snap.val();
          setPatients(val ? Object.keys(val).map(k => ({ id: k, ...val[k], bed: cleanBed(val[k].bed) })) : []);
        });
        return () => { db.ref('notice').off(); db.ref('patients').off(); };
      }, []);

      const saveNotice = (text) => db.ref('notice').set({ text: text.trim(), updatedAt: Date.now() }).then(() => showToast("✓ Saved"));
      
      // FIX 4: Return promise for the Modal to await
      const saveLabImages = (patientId, labImages) => {
        return db.ref(`patients/${patientId}/labImages`).set(labImages).then(() => {
          showToast(`✓ ${labImages.length} lab image${labImages.length !== 1 ? 's' : ''} saved`);
          scheduleSync();
        });
      };
      
      const isDup = (ward, name, excludeId) => patients.some(p => p.id !== excludeId && makeKey(p.ward, p.name) === makeKey(ward, name));

      const update = useCallback((id, field, value) => {
        const p = patients.find(x => x.id === id);
        if (field === 'name' && isDup(p?.ward, value, id)) { showToast("⚠️ Duplicate"); return; }
        if (field === 'ward' && isDup(value, p?.name, id)) { showToast("⚠️ Duplicate"); return; }
        db.ref(`patients/${id}`).update({ [field]: field === 'bed' ? cleanBed(value) : value, timestamp: Date.now() }).then(scheduleSync);
      }, [patients, scheduleSync]);

      const del = (id) => confirm("Delete?") && db.ref(`patients/${id}`).remove().then(() => { showToast("✓ Deleted"); pingSheets(); });

      const saveNew = () => {
        const c = { ward: newP.ward || "Unassigned", bed: cleanBed(newP.bed), name: newP.name.trim(), diagnosis: newP.diagnosis, doctor: newP.doctor, status: newP.status || "New", plan: newP.plan, mrn: newP.mrn, timestamp: Date.now() };
        if (!c.name) { alert("Enter name"); return; }
        if (isDup(c.ward, c.name)) { alert("Duplicate"); return; }
        db.ref("patients").push(c).then(() => { setAddModal(false); setNewP({ ward: "Ward 19", bed: "", name: "", diagnosis: "", doctor: "", plan: "", status: "New", mrn: "" }); showToast("✓ Added"); pingSheets(); });
      };

      const groups = useMemo(() => {
        const g = {};
        (viewFilter === 'All' ? patients : patients.filter(p => p.status === viewFilter))
          .filter(p => `${p.name}${p.bed}${p.ward}${p.diagnosis}`.toLowerCase().includes(search.toLowerCase()))
          .forEach(p => { const w = p.ward || "Unassigned"; (g[w] = g[w] || []).push(p); });
        return { g, keys: Object.keys(g).sort((a, b) => WARD_ORDER.indexOf(a) - WARD_ORDER.indexOf(b)) };
      }, [patients, search, viewFilter]);

      const getLabCount = (p) => {
         // Handle both Array and Object formats for the counter
         const imgs = p.labImages;
         if (!imgs) return 0;
         if (Array.isArray(imgs)) return imgs.length;
         return Object.keys(imgs).length;
      };

      return (
        <div className="wrap">
          <div className="topbar">
            <div className="title">
              <div className="title-row">
                <h1>Unit E</h1>
                <span className={`sync-badge ${syncing ? 'syncing' : 'idle'}`}>{syncing ? '⏳' : '✓'} {patients.length}</span>
              </div>
            </div>
            <div className="actions">
              <button className="btn btn-white" onClick={() => setAddModal(true)}>+ Add</button>
              <button className="btn btn-green" onClick={() => window.open(SHEET_URL, '_blank')}>📊</button>
              <button className="btn btn-blue" onClick={() => { setSyncing(true); pingSheets(); showToast("🔄 Syncing..."); setTimeout(() => setSyncing(false), 2000); }}>🔄</button>
            </div>
          </div>

          <NoticeBanner notice={notice} onSave={saveNotice} />

          <div className="controls-container">
            <div className="filter-row">
              {['All', 'New', 'Chronic', 'Non-Chronic'].map(f => (
                <button key={f} className={`filter-btn ${viewFilter === f ? 'active' : ''}`} onClick={() => setViewFilter(f)}>{f}</button>
              ))}
            </div>
            <input className="search-bar" placeholder="Search..." value={search} onChange={e => setSearch(e.target.value)} />
          </div>

          {groups.keys.map(ward => (
            <div key={ward} className="ward-section">
              <div className="ward-header" onClick={() => setCollapsedWards(p => ({ ...p, [ward]: !p[ward] }))}>
                <div><span className={`arrow ${collapsedWards[ward] ? 'collapsed' : ''}`}>▼</span> {ward}</div>
                <span className="ward-count">{groups.g[ward].length}</span>
              </div>
              <div className={`ward-body ${collapsedWards[ward] ? 'is-hidden' : ''}`}>
                {groups.g[ward].map(p => (
                  <div className="p-card" key={p.id}>
                    <div className="mobile-row col-1">
                      <input className="inp inp-bed" value={p.bed || ''} placeholder="Bed" onChange={e => update(p.id, 'bed', e.target.value)} />
                      <input className="inp inp-doc" value={p.doctor || ''} placeholder="Dr." onChange={e => update(p.id, 'doctor', e.target.value)} />
                    </div>
                    <div className="col-2">
                      <div style={{ display: 'flex', gap: 8 }}>
                        <input className="inp inp-name" value={p.name || ''} placeholder="Name" onChange={e => update(p.id, 'name', e.target.value)} />
                        <input className="inp" style={{ width: '90px' }} value={p.mrn || ''} placeholder="MRN" onChange={e => update(p.id, 'mrn', e.target.value)} />
                      </div>
                      <input className="inp" value={p.diagnosis || ''} placeholder="Diagnosis" onChange={e => update(p.id, 'diagnosis', e.target.value)} />
                    </div>
                    <div className="col-3">
                      <textarea className="inp inp-area" value={p.plan || ''} placeholder="Plan..." onChange={e => update(p.id, 'plan', e.target.value)} />
                    </div>
                    <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                      <button className={`btn-lab ${getLabCount(p) > 0 ? 'has-labs' : ''}`} onClick={() => setLabModal(p)}>
                        🧪 Labs
                        {getLabCount(p) > 0 && <span className="lab-count">{getLabCount(p)}</span>}
                      </button>
                      <select className={`status-select status-${(p.status || "").toLowerCase().split('-')[0]}`} value={p.status || ""} onChange={e => update(p.id, 'status', e.target.value)}>
                        <option value="">-</option>
                        {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                      <button className="btn-del" onClick={() => del(p.id)}>×</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}

          {addModal && (
            <div className="modalOverlay">
              <div className="modal" style={{ maxWidth: '450px' }}>
                <div className="modal-head" style={{ background: 'var(--green)' }}>Add Patient</div>
                <div className="modal-body">
                  <div className="form-group"><label>Ward</label><select className="inp" value={newP.ward} onChange={e => setNewP({ ...newP, ward: e.target.value })}>{WARD_ORDER.map(w => <option key={w}>{w}</option>)}</select></div>
                  <div style={{ display: 'flex', gap: 10 }}>
                    <div className="form-group" style={{ flex: 1 }}><label>Bed</label><input className="inp" value={newP.bed} onChange={e => setNewP({ ...newP, bed: e.target.value })} /></div>
                    <div className="form-group" style={{ flex: 1 }}><label>Doctor</label><input className="inp" value={newP.doctor} onChange={e => setNewP({ ...newP, doctor: e.target.value })} /></div>
                  </div>
                  <div className="form-group"><label>Name</label><input className="inp" value={newP.name} onChange={e => setNewP({ ...newP, name: e.target.value })} /></div>
                  <div style={{ display: 'flex', gap: 10 }}>
                    <div className="form-group" style={{ flex: 1 }}><label>MRN</label><input className="inp" value={newP.mrn} onChange={e => setNewP({ ...newP, mrn: e.target.value })} /></div>
                    <div className="form-group" style={{ flex: 1 }}><label>Status</label><select className="inp" value={newP.status} onChange={e => setNewP({ ...newP, status: e.target.value })}>{STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                  </div>
                  <div className="form-group"><label>Diagnosis</label><input className="inp" value={newP.diagnosis} onChange={e => setNewP({ ...newP, diagnosis: e.target.value })} /></div>
                  <div className="form-group"><label>Plan</label><textarea className="inp inp-area" value={newP.plan} onChange={e => setNewP({ ...newP, plan: e.target.value })} /></div>
                </div>
                <div className="modal-foot">
                  <button className="btn btn-white" onClick={() => setAddModal(false)}>Cancel</button>
                  <button className="btn btn-blue" onClick={saveNew}>Save</button>
                </div>
              </div>
            </div>
          )}

          {labModal && <LabModal patient={labModal} onClose={() => setLabModal(null)} onSave={saveLabImages} />}
          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

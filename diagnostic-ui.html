<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit E - API Diagnostics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .test-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .test-btn:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .result-box {
            background: #f9fafb;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }
        .result-box.show {
            display: block;
        }
        .success { color: #059669; font-weight: 600; }
        .error { color: #dc2626; font-weight: 600; }
        .info { color: #3b82f6; }
        .warning { color: #f59e0b; }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }
        .status.loading {
            background: #fef3c7;
            color: #92400e;
        }
        .status.success {
            background: #d1fae5;
            color: #065f46;
        }
        .status.failed {
            background: #fee2e2;
            color: #991b1b;
        }
        .config-item {
            padding: 12px;
            background: #f9fafb;
            border-left: 4px solid #667eea;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 13px;
            word-break: break-all;
        }
        .config-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 4px;
        }
        .config-value {
            color: #6b7280;
            font-family: 'Courier New', monospace;
        }
        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔧 API Diagnostics</h1>
            <p class="subtitle">Test your API connection and diagnose issues</p>

            <button class="test-btn btn-primary" onclick="runBasicTest()">
                <span>🚀</span> Test API Connection
                <span id="status1"></span>
            </button>

            <button class="test-btn btn-secondary" onclick="runOCRTest()">
                <span>📷</span> Test OCR API
                <span id="status2"></span>
            </button>

            <button class="test-btn btn-secondary" onclick="runClaudeTest()">
                <span>✨</span> Test Claude Vision API
                <span id="status3"></span>
            </button>

            <button class="test-btn btn-secondary" onclick="showConfig()">
                <span>⚙️</span> Show Configuration
            </button>

            <div id="result" class="result-box"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbz_2zC2ztoesY0XBd7_M9YzddWzRolYjqnjXF3xr_jM0Ry4nDzqoXOpFgQZJRl1zPdU/exec';

        function showResult(html) {
            const resultBox = document.getElementById('result');
            resultBox.innerHTML = html;
            resultBox.classList.add('show');
        }

        function setStatus(id, type) {
            const statusEl = document.getElementById(id);
            if (type === 'loading') {
                statusEl.innerHTML = '<div class="spinner"></div>';
            } else if (type === 'success') {
                statusEl.innerHTML = '<span class="status success">✓ PASSED</span>';
            } else if (type === 'failed') {
                statusEl.innerHTML = '<span class="status failed">✗ FAILED</span>';
            } else {
                statusEl.innerHTML = '';
            }
        }

        async function runBasicTest() {
            setStatus('status1', 'loading');
            showResult('<div class="info">⏳ Testing API connection...</div>');

            try {
                const startTime = Date.now();
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'test' })
                });
                const elapsed = Date.now() - startTime;

                const responseText = await response.text();

                let html = `<div class="info">📍 API URL: ${API_URL}</div><br>`;
                html += `<div class="info">⏱️ Response Time: ${elapsed}ms</div><br>`;
                html += `<div class="info">📊 HTTP Status: ${response.status} ${response.statusText}</div><br>`;

                if (!response.ok) {
                    setStatus('status1', 'failed');
                    html += `<div class="error">❌ TEST FAILED</div><br>`;
                    html += `<div class="error">HTTP Error: ${response.status}</div><br>`;
                    html += `<div>Response: ${responseText.substring(0, 500)}</div>`;
                    showResult(html);
                    return;
                }

                try {
                    const result = JSON.parse(responseText);
                    setStatus('status1', 'success');
                    html += `<div class="success">✅ API TEST PASSED!</div><br>`;
                    html += `<div>Response: <pre>${JSON.stringify(result, null, 2)}</pre></div>`;
                } catch (e) {
                    setStatus('status1', 'failed');
                    html += `<div class="error">❌ Invalid JSON Response</div><br>`;
                    html += `<div>Parse Error: ${e.message}</div><br>`;
                    html += `<div>Response: ${responseText.substring(0, 500)}</div>`;
                }

                showResult(html);

            } catch (error) {
                setStatus('status1', 'failed');
                let html = `<div class="error">❌ TEST FAILED - Network Error</div><br>`;
                html += `<div class="error">Error: ${error.message}</div><br>`;
                html += `<div>Type: ${error.name}</div>`;
                showResult(html);
            }
        }

        async function runOCRTest() {
            setStatus('status2', 'loading');
            showResult('<div class="info">⏳ Testing OCR API with sample image...</div>');

            // Create test image
            const canvas = document.createElement('canvas');
            canvas.width = 100;
            canvas.height = 100;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, 100, 100);
            ctx.fillStyle = 'black';
            ctx.font = '20px Arial';
            ctx.fillText('TEST', 20, 50);
            const testImage = canvas.toDataURL('image/jpeg', 0.9);

            try {
                const startTime = Date.now();
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'runOCR',
                        image: testImage
                    })
                });
                const elapsed = Date.now() - startTime;

                const responseText = await response.text();

                let html = `<div class="info">⏱️ Response Time: ${elapsed}ms</div><br>`;
                html += `<div class="info">📊 HTTP Status: ${response.status} ${response.statusText}</div><br>`;

                if (!response.ok) {
                    setStatus('status2', 'failed');
                    html += `<div class="error">❌ OCR TEST FAILED</div><br>`;
                    html += `<div>Response: ${responseText.substring(0, 500)}</div>`;
                    showResult(html);
                    return;
                }

                const result = JSON.parse(responseText);
                if (result.error) {
                    setStatus('status2', 'failed');
                    html += `<div class="error">❌ API Error: ${result.error}</div>`;
                } else {
                    setStatus('status2', 'success');
                    html += `<div class="success">✅ OCR TEST PASSED!</div><br>`;
                    html += `<div>Text: ${result.text || '(empty)'}</div><br>`;
                    html += `<div>Confidence: ${result.confidence}%</div>`;
                }

                showResult(html);

            } catch (error) {
                setStatus('status2', 'failed');
                let html = `<div class="error">❌ OCR TEST FAILED</div><br>`;
                html += `<div class="error">Error: ${error.message}</div>`;
                showResult(html);
            }
        }

        async function runClaudeTest() {
            setStatus('status3', 'loading');
            showResult('<div class="info">⏳ Testing Claude Vision API...</div>');

            // Create test image
            const canvas = document.createElement('canvas');
            canvas.width = 200;
            canvas.height = 100;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, 200, 100);
            ctx.fillStyle = 'black';
            ctx.font = '16px Arial';
            ctx.fillText('WBC: 8.5', 20, 40);
            ctx.fillText('Hgb: 14.2', 20, 70);
            const testImage = canvas.toDataURL('image/jpeg', 0.9);

            try {
                const startTime = Date.now();
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'claudeVision',
                        image: testImage
                    })
                });
                const elapsed = Date.now() - startTime;

                const responseText = await response.text();

                let html = `<div class="info">⏱️ Response Time: ${elapsed}ms</div><br>`;
                html += `<div class="info">📊 HTTP Status: ${response.status} ${response.statusText}</div><br>`;

                if (!response.ok) {
                    setStatus('status3', 'failed');
                    html += `<div class="error">❌ CLAUDE TEST FAILED</div><br>`;
                    html += `<div>Response: ${responseText.substring(0, 500)}</div>`;
                    showResult(html);
                    return;
                }

                const result = JSON.parse(responseText);
                if (result.error) {
                    setStatus('status3', 'failed');
                    html += `<div class="error">❌ API Error: ${result.error}</div>`;
                } else {
                    setStatus('status3', 'success');
                    html += `<div class="success">✅ CLAUDE VISION TEST PASSED!</div><br>`;
                    html += `<div>Values Found: ${result.values?.length || 0}</div><br>`;
                    html += `<div>Report Type: ${result.reportType}</div><br>`;
                    html += `<div>Confidence: ${result.confidence}%</div>`;
                }

                showResult(html);

            } catch (error) {
                setStatus('status3', 'failed');
                let html = `<div class="error">❌ CLAUDE TEST FAILED</div><br>`;
                html += `<div class="error">Error: ${error.message}</div>`;
                showResult(html);
            }
        }

        function showConfig() {
            let html = '<div class="success">⚙️ Configuration Details</div><br>';

            html += '<div class="config-item">';
            html += '<div class="config-label">📍 Vision API URL:</div>';
            html += `<div class="config-value">${API_URL}</div>`;
            html += '</div>';

            html += '<div class="config-item">';
            html += '<div class="config-label">🕐 Timestamp:</div>';
            html += `<div class="config-value">${new Date().toISOString()}</div>`;
            html += '</div>';

            html += '<div class="config-item">';
            html += '<div class="config-label">📱 User Agent:</div>';
            html += `<div class="config-value">${navigator.userAgent}</div>`;
            html += '</div>';

            html += '<div class="config-item">';
            html += '<div class="config-label">🌐 Platform:</div>';
            html += `<div class="config-value">${navigator.platform}</div>`;
            html += '</div>';

            showResult(html);
        }
    </script>
</body>
</html>

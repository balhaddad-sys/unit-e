    <script src="ocr-neural-v5.js"></script>
</head>
<body>
<h2>Parser Test</h2>
<pre id="output"></pre>
<script>
// Simulate what Vision API might return for the KFT image
const rawOcrText = `
SMART PATHOLOGY LAB

smartpatholab@gmail.com

Sample Collected At:
125, Shivam Bungalow, S G Road,
Mumbai
Ref. By: Dr. Hiren Shah
Registered on: 02:31 PM 02 Dec, 22
Collected on: 03:11 PM 02 Dec, 22
Reported on: 04:35 PM 02 Dec, 22

KIDNEY PANEL (KFT)

Investigation          Result    Reference Value    Unit
Primary Sample Type :  Serum
Urea                   15        13 - 43            mg/dL
Urease UV
Creatinine             1.5       0.7 - 1.3          mg/dL
Modified Jaffe, Kinetic
Uric Acid              5.5       3.5 - 7.2          mg/dL
Uricase
Calcium, Total         10.2      8.7 - 10.4         mg/dL
Arsenazo III
Phosphorus             1.4       2.4 - 5.1          mg/dL
Molybdate UV
Alkaline Phosphatase (ALP)  80   30 - 120           U/L
IFCC-AMP
Total Protein          5.9       5.7 - 8.2          g/dL
Biuret
Albumin                4.1       3.2 - 4.8          g/dL
BCG
Sodium                 139       136 - 145          mEq/L
Indirect ISE
Potassium              3.9       3.5 - 5.1          mEq/L
Indirect ISE
Chloride               100       98 - 107           mEq/L
Indirect ISE

ADVICE: CKD RISK MAP
****End of Report****
`;

// Parser function (same as in main app)
const parseVisionToNeuralInput = (rawText) => {
    const items = [];
    const seen = new Set();
    const text = String(rawText || "");
    const lines = text.split(/\\r?\\n/).map(l => l.trim()).filter(l => l.length > 2);
    
    const SKIP_PATTERNS = [
        /^(age|sex|gender|pid|page|ref|date|time|collected|reported|registered|generated|sample|specimen|patient|name|mrn|id|hospital|lab|report|doctor|dr\\.|technician|pathologist|phone|email|address|barcode|qr)/i,
        /^(primary|type|serum|plasma|whole|blood|urine|stool|csf|fluid)/i,
        /^\\d+[\\s\\-\\.\\/]\\d+/,
        /thanks|reference|end of report|advice|guideline|risk map/i,
        /copyright|generated on|page \\d/i,
        /drlogy|smart path|pathology/i,
        /investigation|result|unit/i
    ];
    
    const KNOWN_TESTS = new Set([
        'UREA','BUN','CREATININE','CR','CREAT','URIC ACID','URIC','GFR','EGFR',
        'SODIUM','NA','POTASSIUM','K','CHLORIDE','CL',
        'CALCIUM','CA','PHOSPHORUS','PHOSPHATE','PO4','PHOS','MAGNESIUM','MG',
        'ALP','ALKALINE PHOSPHATASE','TOTAL PROTEIN','TP','PROTEIN','ALBUMIN','ALB'
    ]);
    
    const normalizeTest = (name) => {
        return name.toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/TOTAL$/,'').replace(/^SERUM/,'');
    };
    
    const isLikelyLabTest = (name) => {
        const norm = normalizeTest(name);
        if (norm.length < 2 || norm.length > 25) return false;
        if (KNOWN_TESTS.has(norm)) return true;
        if (KNOWN_TESTS.has(name.toUpperCase())) return true;
        for (const known of KNOWN_TESTS) {
            if (norm.includes(known) || known.includes(norm)) return true;
        }
        return false;
    };
    
    for (const line of lines) {
        if (SKIP_PATTERNS.some(p => p.test(line))) continue;
        
        // Table format
        const tableMatch = line.match(/^([A-Za-z][A-Za-z\\s\\(\\)\\-,\\.]{2,30}?)\\s{2,}(\\d+\\.?\\d*)/);
        if (tableMatch) {
            const testName = tableMatch[1].trim();
            const value = tableMatch[2];
            const normName = normalizeTest(testName);
            if (isLikelyLabTest(testName) && !seen.has(normName)) {
                seen.add(normName);
                items.push({ test: testName, value: value });
            }
        }
    }
    
    return items;
};

window.onload = function() {
    const parsed = parseVisionToNeuralInput(rawOcrText);
    document.getElementById('output').textContent = 'PARSED FROM TEXT:\\n' + JSON.stringify(parsed, null, 2);
    
    if (window.LabOCR && window.LabOCR.isReady) {
        const { results, labType, stats } = window.LabOCR.process(parsed);
        document.getElementById('output').textContent += '\\n\\nNEURAL PROCESSED (Type: ' + labType + '):\\n' + 
            JSON.stringify(results.map(r => ({
                test: r.test,
                value: r.value,
                flag: r.flag,
                category: r.category
            })), null, 2);
    }
};
</script>
</body>

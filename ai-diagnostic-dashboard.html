<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Diagnostic Dashboard - Unit E</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            width: 24px;
            height: 24px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .status {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }

        .status.healthy {
            background: #d4edda;
            color: #155724;
        }

        .status.degraded {
            background: #fff3cd;
            color: #856404;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.unknown {
            background: #e2e3e5;
            color: #383d41;
        }

        .info-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .info-label {
            font-weight: 600;
            color: #666;
        }

        .info-value {
            color: #333;
            word-break: break-all;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .log-container {
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 10px;
            padding: 8px;
            border-left: 3px solid #666;
            padding-left: 12px;
        }

        .log-entry.info { border-color: #4facfe; }
        .log-entry.success { border-color: #52c41a; }
        .log-entry.warning { border-color: #faad14; }
        .log-entry.error { border-color: #f5576c; }

        .log-timestamp {
            color: #888;
            font-size: 11px;
        }

        .log-message {
            color: #d4d4d4;
            margin-top: 4px;
        }

        .recommendation {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .recommendation.critical {
            background: #f8d7da;
            border-color: #dc3545;
        }

        .recommendation.warning {
            background: #fff3cd;
            border-color: #ffc107;
        }

        .recommendation.info {
            background: #d1ecf1;
            border-color: #17a2b8;
        }

        .recommendation h4 {
            margin-bottom: 8px;
            color: #333;
        }

        .recommendation p {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .recommendation code {
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .test-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .test-input:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea.test-input {
            min-height: 100px;
            font-family: inherit;
            resize: vertical;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            font-weight: 600;
            color: #666;
        }

        .metric-value {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🔬 AI Diagnostic Dashboard</h1>
            <p>Comprehensive debugging and monitoring for Unit E AI features</p>
        </div>

        <!-- Quick Status -->
        <div class="grid">
            <div class="card">
                <h2>⚡ Quick Status</h2>
                <div id="quickStatus" class="loading">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>
                <button class="btn btn-secondary" onclick="loadQuickStatus()">Refresh Status</button>
            </div>

            <div class="card">
                <h2>🎯 Quick Actions</h2>
                <button class="btn" onclick="runFullDiagnostics()">Run Full Diagnostics</button>
                <button class="btn btn-secondary" onclick="testOCREndpoint()">Test OCR Endpoint</button>
                <button class="btn btn-secondary" onclick="testConsultEndpoint()">Test Consultation</button>
                <button class="btn btn-danger" onclick="clearLogs()">Clear Debug Logs</button>
            </div>

            <div class="card">
                <h2>📊 API Configuration</h2>
                <div id="apiConfig" class="loading">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>
            </div>
        </div>

        <!-- Full Diagnostics Report -->
        <div class="card full-width" id="diagnosticsSection" style="display: none;">
            <h2>📋 Full Diagnostic Report</h2>
            <div id="diagnosticsReport"></div>
        </div>

        <!-- Recommendations -->
        <div class="card full-width" id="recommendationsSection" style="display: none;">
            <h2>💡 Recommendations</h2>
            <div id="recommendations"></div>
        </div>

        <!-- Test OCR -->
        <div class="card full-width" id="ocrTestSection" style="display: none;">
            <h2>🖼️ OCR Test Results</h2>
            <div id="ocrTestResults"></div>
        </div>

        <!-- Test Consultation -->
        <div class="card full-width" id="consultTestSection" style="display: none;">
            <h2>💬 Consultation Test Results</h2>
            <textarea class="test-input" id="consultQuery" placeholder="Enter medical question to test...">What is the recommended treatment for acute gout with elevated creatinine?</textarea>
            <button class="btn" onclick="testConsultWithQuery()">Test with Custom Query</button>
            <div id="consultTestResults"></div>
        </div>

        <!-- Debug Logs -->
        <div class="card full-width">
            <h2>📝 Debug Logs</h2>
            <button class="btn btn-secondary" onclick="loadLogs()" style="width: auto; display: inline-block; margin-right: 10px;">Refresh Logs</button>
            <button class="btn btn-danger" onclick="clearLogs()" style="width: auto; display: inline-block;">Clear Logs</button>
            <div id="debugLogs" class="log-container" style="margin-top: 15px;">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading logs...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration - Production API URL (must match config.js)
        const API_URL = 'https://script.google.com/macros/s/AKfycbyoPcc2U3wGzA2GPJszh68MX3YoM_vjdrCOl6fRbRAewqHQ8k1_mgf5ub_mC9s7Sg6h/exec';

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            loadQuickStatus();
            loadLogs();
        });

        // Load quick status
        async function loadQuickStatus() {
            try {
                const response = await fetch(`${API_URL}?action=aiDebugQuick`);
                const data = await response.json();

                const statusHtml = `
                    <div class="status ${data.status || 'unknown'}">${(data.status || 'unknown').toUpperCase()}</div>
                    <div class="info-grid">
                        <span class="info-label">Timestamp:</span>
                        <span class="info-value">${new Date(data.timestamp).toLocaleString()}</span>

                        <span class="info-label">OpenAI Configured:</span>
                        <span class="info-value">${data.openai?.configured ? '✅ Yes' : '❌ No'}</span>

                        <span class="info-label">API Key Preview:</span>
                        <span class="info-value">${data.openai?.keyPreview || 'N/A'}</span>

                        <span class="info-label">Vision Fallback:</span>
                        <span class="info-value">${data.vision?.configured ? '✅ Available' : '⚠️ Not configured'}</span>

                        <span class="info-label">Model:</span>
                        <span class="info-value">${data.model || 'N/A'}</span>
                    </div>
                `;

                document.getElementById('quickStatus').innerHTML = statusHtml;

                // Update API config
                const configHtml = `
                    <div class="metric">
                        <span class="metric-label">OpenAI Key Length</span>
                        <span class="metric-value">${data.openai?.keyLength || 0}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Status</span>
                        <span class="metric-value">${data.status || 'unknown'}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Model</span>
                        <span class="metric-value">${data.model || 'N/A'}</span>
                    </div>
                `;
                document.getElementById('apiConfig').innerHTML = configHtml;

            } catch (error) {
                document.getElementById('quickStatus').innerHTML = `
                    <div class="error-message">
                        ❌ Failed to load status: ${error.message}
                    </div>
                `;
            }
        }

        // Run full diagnostics
        async function runFullDiagnostics() {
            const section = document.getElementById('diagnosticsSection');
            const report = document.getElementById('diagnosticsReport');
            const recSection = document.getElementById('recommendationsSection');
            const recDiv = document.getElementById('recommendations');

            section.style.display = 'block';
            recSection.style.display = 'block';
            report.innerHTML = '<div class="loading"><div class="spinner"></div><p>Running diagnostics...</p></div>';
            recDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Analyzing...</p></div>';

            try {
                const response = await fetch(`${API_URL}?action=aiDebugFull`);
                const data = await response.json();

                // Display checks
                let checksHtml = '<h3>Checks:</h3>';
                Object.keys(data.checks || {}).forEach(checkName => {
                    const check = data.checks[checkName];
                    const passed = check.passed !== false;
                    checksHtml += `
                        <div class="recommendation ${passed ? 'info' : 'warning'}">
                            <h4>${passed ? '✅' : '⚠️'} ${checkName}</h4>
                            <p><strong>Passed:</strong> ${passed ? 'Yes' : 'No'}</p>
                            ${check.duration ? `<p><strong>Duration:</strong> ${check.duration}ms</p>` : ''}
                            ${check.error ? `<p><strong>Error:</strong> ${check.error}</p>` : ''}
                            ${check.message ? `<p>${check.message}</p>` : ''}
                        </div>
                    `;
                });

                report.innerHTML = checksHtml;

                // Display recommendations
                const recommendations = data.recommendations || [];
                if (recommendations.length === 0) {
                    recDiv.innerHTML = '<div class="success-message">✅ No issues found! All systems operational.</div>';
                } else {
                    let recHtml = '';
                    recommendations.forEach(rec => {
                        recHtml += `
                            <div class="recommendation ${rec.severity || 'info'}">
                                <h4>${rec.severity === 'critical' ? '🔴' : rec.severity === 'warning' ? '⚠️' : 'ℹ️'} ${rec.message}</h4>
                                ${rec.fix ? `<p><strong>Fix:</strong> ${rec.fix}</p>` : ''}
                            </div>
                        `;
                    });
                    recDiv.innerHTML = recHtml;
                }

            } catch (error) {
                report.innerHTML = `<div class="error-message">❌ Diagnostics failed: ${error.message}</div>`;
                recDiv.innerHTML = `<div class="error-message">❌ Failed to generate recommendations</div>`;
            }
        }

        // Test OCR endpoint
        async function testOCREndpoint() {
            const section = document.getElementById('ocrTestSection');
            const results = document.getElementById('ocrTestResults');

            section.style.display = 'block';
            results.innerHTML = '<div class="loading"><div class="spinner"></div><p>Testing OCR endpoint...</p></div>';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'aiDebugOCR',
                        image: null // Will use test image if implemented
                    })
                });
                const data = await response.json();

                results.innerHTML = `
                    <div class="${data.passed ? 'success-message' : 'error-message'}">
                        ${data.passed ? '✅ OCR endpoint test passed!' : '❌ OCR endpoint test failed'}
                    </div>
                    <div class="info-grid" style="margin-top: 15px;">
                        <span class="info-label">Duration:</span>
                        <span class="info-value">${data.duration || 0}ms</span>

                        <span class="info-label">Error:</span>
                        <span class="info-value">${data.error || 'None'}</span>
                    </div>
                    <pre style="margin-top: 15px; background: #f5f5f5; padding: 15px; border-radius: 6px; overflow-x: auto;">${JSON.stringify(data, null, 2)}</pre>
                `;

            } catch (error) {
                results.innerHTML = `<div class="error-message">❌ OCR test failed: ${error.message}</div>`;
            }
        }

        // Test consultation endpoint
        async function testConsultEndpoint() {
            const section = document.getElementById('consultTestSection');
            const results = document.getElementById('consultTestResults');

            section.style.display = 'block';
            results.innerHTML = '<div class="loading"><div class="spinner"></div><p>Testing consultation endpoint...</p></div>';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'aiDebugConsult',
                        query: null // Will use default test query
                    })
                });
                const data = await response.json();

                results.innerHTML = `
                    <div class="${data.passed ? 'success-message' : 'error-message'}">
                        ${data.passed ? '✅ Consultation endpoint test passed!' : '❌ Consultation endpoint test failed'}
                    </div>
                    <div class="info-grid" style="margin-top: 15px;">
                        <span class="info-label">Duration:</span>
                        <span class="info-value">${data.duration || 0}ms</span>

                        <span class="info-label">Error:</span>
                        <span class="info-value">${data.error || 'None'}</span>
                    </div>
                    <pre style="margin-top: 15px; background: #f5f5f5; padding: 15px; border-radius: 6px; overflow-x: auto;">${JSON.stringify(data, null, 2)}</pre>
                `;

            } catch (error) {
                results.innerHTML = `<div class="error-message">❌ Consultation test failed: ${error.message}</div>`;
            }
        }

        // Test consultation with custom query
        async function testConsultWithQuery() {
            const query = document.getElementById('consultQuery').value;
            const results = document.getElementById('consultTestResults');

            results.innerHTML = '<div class="loading"><div class="spinner"></div><p>Testing consultation with custom query...</p></div>';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'aiDebugConsult',
                        query: query
                    })
                });
                const data = await response.json();

                results.innerHTML = `
                    <div class="${data.passed ? 'success-message' : 'error-message'}">
                        ${data.passed ? '✅ Consultation test passed!' : '❌ Consultation test failed'}
                    </div>
                    <div class="info-grid" style="margin-top: 15px;">
                        <span class="info-label">Query:</span>
                        <span class="info-value">${query}</span>

                        <span class="info-label">Duration:</span>
                        <span class="info-value">${data.duration || 0}ms</span>

                        <span class="info-label">Error:</span>
                        <span class="info-value">${data.error || 'None'}</span>
                    </div>
                    <pre style="margin-top: 15px; background: #f5f5f5; padding: 15px; border-radius: 6px; overflow-x: auto;">${JSON.stringify(data, null, 2)}</pre>
                `;

            } catch (error) {
                results.innerHTML = `<div class="error-message">❌ Test failed: ${error.message}</div>`;
            }
        }

        // Load debug logs
        async function loadLogs() {
            const logsDiv = document.getElementById('debugLogs');
            logsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading logs...</p></div>';

            try {
                const response = await fetch(`${API_URL}?action=aiDebugLogs&limit=50`);
                const data = await response.json();

                if (!data.logs || data.logs.length === 0) {
                    logsDiv.innerHTML = '<p style="color: #888; text-align: center;">No logs available</p>';
                    return;
                }

                let logsHtml = '';
                data.logs.forEach(log => {
                    logsHtml += `
                        <div class="log-entry ${log.type}">
                            <div class="log-timestamp">${new Date(log.timestamp).toLocaleString()}</div>
                            <div class="log-message"><strong>[${log.type.toUpperCase()}]</strong> ${log.message}</div>
                            ${log.details ? `<pre style="margin-top: 5px; font-size: 11px;">${JSON.stringify(log.details, null, 2)}</pre>` : ''}
                        </div>
                    `;
                });

                logsDiv.innerHTML = logsHtml;

            } catch (error) {
                logsDiv.innerHTML = `<div class="error-message">❌ Failed to load logs: ${error.message}</div>`;
            }
        }

        // Clear logs
        async function clearLogs() {
            if (!confirm('Are you sure you want to clear all debug logs?')) return;

            try {
                const response = await fetch(`${API_URL}?action=aiDebugClearLogs`);
                const data = await response.json();

                if (data.success) {
                    alert('✅ Logs cleared successfully');
                    loadLogs();
                } else {
                    alert('❌ Failed to clear logs');
                }

            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
